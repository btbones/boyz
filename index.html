<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Tools</title>
<script>
// Old links like /boyz/#ch6 pointed at the health hub before it moved to health.html
if(/^#(ch6|ch7|ch8|unit2)$/.test(location.hash))location.replace('health.html'+location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#EFF0F2; --surface:#FFFFFF; --ink:#1C2128; --muted:#5D6672; --line:#D5D9DF; --hover:#9AA3AE;
  --hh:#0F6E6A; --hhs:#D5EAE6; --fq:#8A5A00; --fqs:#F6E7C4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#12161B; --surface:#1B2027; --ink:#E6EAEF; --muted:#98A2AE; --line:#2E3540; --hover:#56606C;
    --hh:#4FC0B5; --hhs:#173B3A; --fq:#F2C14E; --fqs:#3A3018;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:26px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.how{color:var(--muted);margin:0;max-width:60ch}
.list{display:flex;flex-direction:column;gap:10px}
.pick{color:inherit;text-decoration:none;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:border-color .15s,transform .05s}
.pick:hover{border-color:var(--hover)}
.pick:active{transform:scale(.995)}
.pick:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.num{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--s);color:var(--c)}
.num svg{width:26px;height:26px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.txt b{font-family:var(--display);font-size:19px;font-weight:600}
.txt span{color:var(--muted);font-size:14px}
.go{flex:none;font-family:var(--display);font-weight:600;color:var(--c);font-size:15px;white-space:nowrap}
.khh{--c:var(--hh);--s:var(--hhs)} .kfq{--c:var(--fq);--s:var(--fqs)}
@media (max-width:420px){.go{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Study tools</p>
    <h1>What are we studying?</h1>
    <p class="how">Pick a set of quizzes to get started.</p>
  </header>
  <div class="list">
    <a class="pick khh" href="health.html">
      <span class="num"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>
      <span class="txt"><b>Health Study Hub</b><span>Chapter 6–8 vocab quizzes and the Unit 2 practice test</span></span>
      <span class="go">Open →</span>
    </a>
    <a class="pick kfq" href="flags.html">
      <span class="num"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg></span>
      <span class="txt"><b>Coverage Flag Quiz</b><span>Flags of every GeoGuessr Street View country and territory</span></span>
      <span class="go">Open →</span>
    </a>
  </div>
</div>
</body>
</html>
