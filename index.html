<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#EFF0F2; --surface:#FFFFFF; --ink:#1C2128; --muted:#5D6672; --line:#D5D9DF; --hover:#9AA3AE;
  --c6:#0F6E6A; --c6s:#D5EAE6; --c7:#3D4FA8; --c7s:#DFE3F6; --c8:#55690F; --c8s:#E4EBCD; --u2:#73367A; --u2s:#EEDFF0;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12161B; --surface:#1B2027; --ink:#E6EAEF; --muted:#98A2AE; --line:#2E3540; --hover:#56606C;
    --c6:#4FC0B5; --c6s:#173B3A; --c7:#93A2F0; --c7s:#232A4D; --c8:#B7CC6B; --c8s:#2E3A1C; --u2:#D49ADB; --u2s:#3A2440;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161B; --surface:#1B2027; --ink:#E6EAEF; --muted:#98A2AE; --line:#2E3540; --hover:#56606C;
  --c6:#4FC0B5; --c6s:#173B3A; --c7:#93A2F0; --c7s:#232A4D; --c8:#B7CC6B; --c8s:#2E3A1C; --u2:#D49ADB; --u2s:#3A2440;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:26px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.how{color:var(--muted);margin:0;max-width:60ch}
section{display:flex;flex-direction:column;gap:10px}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.list{display:flex;flex-direction:column;gap:10px}
.pick{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .15s,transform .1s}
.pick:hover{border-color:var(--hover)}
.pick:active{transform:scale(.995)}
.pick:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.num{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;line-height:1;background:var(--s);color:var(--c)}
.num>span{display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1}
.num small{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.txt b{font-family:var(--display);font-size:19px;font-weight:600}
.txt span{color:var(--muted);font-size:14px}
.go{flex:none;font-family:var(--display);font-weight:600;color:var(--c);font-size:15px;white-space:nowrap}
.k6{--c:var(--c6);--s:var(--c6s)} .k7{--c:var(--c7);--s:var(--c7s)} .k8{--c:var(--c8);--s:var(--c8s)} .ku2{--c:var(--u2);--s:var(--u2s)}
@media (max-width:420px){.go{display:none}}
/* quiz view */
#view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:5}
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:var(--surface);border-bottom:1.5px solid var(--line)}
.back{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.back:hover{border-color:var(--hover)}
.back:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar .t{font-family:var(--display);font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
#frame{flex:1;width:100%;border:0;display:block;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body{margin:0}
</style>
</head>
<body>

<div class="wrap" id="home">
  <header>
    <p class="eyebrow">Health class · Study tools</p>
    <h1>Health Study Hub</h1>
    <p class="how">Pick a chapter vocab quiz or the Unit 2 practice test. Each one reshuffles every time you open it.</p>
  </header>
  <section>
    <h2>Chapter vocab quizzes</h2>
    <div class="list">
      <button class="pick k6" data-q="ch6"><span class="num"><span><small>Ch</small>6</span></span><span class="txt"><b>Stress</b><span>27 terms · matching · 3 pages (10, 10, 7)</span></span><span class="go">Start →</span></button>
      <button class="pick k7" data-q="ch7"><span class="num"><span><small>Ch</small>7</span></span><span class="txt"><b>Mental Health</b><span>23 terms · matching · 2 pages (12, 11)</span></span><span class="go">Start →</span></button>
      <button class="pick k8" data-q="ch8"><span class="num"><span><small>Ch</small>8</span></span><span class="txt"><b>Nutrition</b><span>46 terms · matching · 4 pages (12, 12, 11, 11)</span></span><span class="go">Start →</span></button>
    </div>
  </section>
  <section>
    <h2>Unit tests</h2>
    <div class="list">
      <button class="pick ku2" data-q="unit2"><span class="num"><span><small>Unit</small>2</span></span><span class="txt"><b>Unit 2 Practice Test</b><span>42 questions · matching, true/false, multiple choice, select all</span></span><span class="go">Start →</span></button>
    </div>
  </section>
</div>

<div id="view" hidden>
  <div class="bar"><button class="back" id="back" type="button">← All quizzes</button><span class="t" id="vtitle"></span></div>
  <iframe id="frame" title="Quiz"></iframe>
</div>

<script>
const QUIZ={"ch6": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch 6 Stress Match<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\">\n<style>\n:root{\n  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#18292D; --muted:#5A6D70; --line:#CFDAD7;\n  --accent:#0F6E6A; --accent-soft:#D5EAE6; --good:#2E7D4F; --good-soft:#DDF0E3;\n  --bad:#B3412E; --bad-soft:#F6DFDA;\n  --display:\"Bricolage Grotesque\", \"Segoe UI\", system-ui, sans-serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    color-scheme:dark;\n    --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n    --accent:#4FC0B5; --accent-soft:#173B3A; --good:#5BC486; --good-soft:#163527;\n    --bad:#F08A76; --bad-soft:#3E211C;\n  }\n}\n:root[data-theme=\"dark\"]{\n  color-scheme:dark;\n  --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n  --accent:#4FC0B5; --accent-soft:#173B3A; --good:#5BC486; --good-soft:#163527;\n  --bad:#F08A76; --bad-soft:#3E211C;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}\n.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}\nheader{display:flex;flex-direction:column;gap:6px}\n.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}\nh1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}\n.how{color:var(--muted);margin:0;max-width:60ch}\n.status{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}\n.meter{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}\n.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}\n.status span{font-size:14px;color:var(--muted);white-space:nowrap}\n.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}\n.terms{display:flex;flex-wrap:wrap;gap:8px}\n.term{font-family:var(--display);font-weight:600;font-size:16px;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}\n.term:hover{border-color:var(--accent)}\n.defs{display:flex;flex-direction:column;gap:10px}\n.def{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:background .15s,border-color .15s}\n.def:hover{border-color:var(--accent)}\n.def .ans{font-family:var(--display);font-weight:600;font-size:14px;color:var(--good)}\n.sel{background:var(--accent-soft);border-color:var(--accent)}\n.done{background:var(--good-soft);border-color:var(--good);cursor:default}\n.term.done{color:var(--good)}\n.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;animation:shake .35s}\n@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.btn{font-family:var(--display);font-weight:600;font-size:16px;padding:12px 20px;border-radius:10px;border:none;background:var(--accent);color:var(--bg);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}\n.row{display:flex;flex-wrap:wrap;gap:10px}\n.results{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}\n.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}\n.missed{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}\n.missed b{font-family:var(--display)}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n[hidden]{display:none!important}\nhtml{color-scheme:light}\nbody{margin:0}\n<\/style>\n<script>\naddEventListener('message',e=>{const d=e.data||{};if(d.type==='theme'){if(d.theme)document.documentElement.dataset.theme=d.theme;else delete document.documentElement.dataset.theme}});\n<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <header>\n    <p class=\"eyebrow\">Health \u00b7 Chapter 6 \u00b7 Stress<\/p>\n    <h1>Stress Match<\/h1>\n    <p class=\"how\">Tap a term, then tap the definition it goes with. 27 terms across 3 pages (10, 10, then 7). Use <b>Shuffle page<\/b> to reorder the current page or <b>Shuffle all<\/b> on page 1 to mix words across pages. Your score counts matches you got on the first try.<\/p>\n  <\/header>\n  <div class=\"status\"><div class=\"meter\"><i id=\"bar\"><\/i><\/div><span id=\"count\">Page 1 of 3<\/span><\/div>\n  <section id=\"game\" style=\"display:flex;flex-direction:column;gap:14px\">\n    <div class=\"row\" id=\"shufallrow\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"shufall\" type=\"button\">Shuffle all<\/button><span class=\"note\" id=\"shufallnote\">Mixes all words across every page and starts over.<\/span><\/div>\n    <p class=\"label\">Terms<\/p>\n    <div class=\"terms\" id=\"terms\"><\/div>\n    <p class=\"label\">Definitions<\/p>\n    <div class=\"defs\" id=\"defs\"><\/div>\n    <div class=\"row\"><button class=\"btn ghost\" id=\"shufpage\" type=\"button\">Shuffle page<\/button><button class=\"btn\" id=\"next\" hidden>Next page<\/button><\/div>\n  <\/section>\n  <section class=\"results\" id=\"results\" hidden><\/section>\n<\/div>\n\n<script>\nconst CARDS=[\n[\"Body scan\",\"Relaxation technique that involves paying careful attention to the body, scanning it for signs of tension, and then releasing that tension\"],\n[\"Burnout\",\"State of emotional, physical, and mental exhaustion; occurs due to prolonged stress\"],\n[\"Cardiovascular system\",\"Body system that transports blood throughout the body; consists of the heart and blood vessels\"],\n[\"Cognition\",\"Ability to think, reason, and remember\"],\n[\"Digestive system\",\"Body system of organs that take in food, pass nutrients into the bloodstream, and then expel waste\"],\n[\"Distress\",\"Stress that causes negative feelings and harmful health effects\"],\n[\"Endocrine system\",\"Body system of glands that secrete hormones to regulate body processes\"],\n[\"Eustress\",\"Positive stress that encourages growth and motivation\"],\n[\"Fight-or-flight response\",\"Physiological reaction in which the body mobilizes its resources to fight off or escape a perceived threat; also called the stress response\"],\n[\"Immune system\",\"Body system of organs, tissues, and cells that defend against infection\"],\n[\"Mindfulness-based stress reduction (MBSR)\",\"Using relaxation techniques like deep breathing, visualization, focused attention, and guided movement while focusing intensely on the present\"],\n[\"Nervous system\",\"Body system of the brain, spinal cord, and nerves that carry information throughout the body\"],\n[\"Positive reappraisal\",\"Thinking about the good aspects of stressful events\"],\n[\"PTSD\",\"Stress-related disorder with flashbacks, numbness, and difficulty sleeping after an extremely stressful event\"],\n[\"Progressive muscle relaxation\",\"Relaxation technique of tensing and then relaxing each part of the body until the whole body feels relaxed\"],\n[\"Relaxation response\",\"Physiological reaction in which the body returns to its resting state after a stressful event\"],\n[\"Reproductive system\",\"Body system of organs that work together to create new human life; differs between males and females\"],\n[\"Stress\",\"The body's physical and psychological reactions to situations people perceive as threats\"],\n[\"Stress hormones\",\"Chemicals that coordinate the fight-or-flight response; include epinephrine, norepinephrine, and cortisol\"],\n[\"Stress management\",\"Using strategies to reduce the impact of the stress response and handle threatening situations in positive ways\"],\n[\"Stress-related disorders\",\"Mental illnesses that develop from stressful events, such as acute stress disorder and PTSD\"],\n[\"Stressors\",\"Factors that lead to stress\"],\n[\"Technostress\",\"Stress caused by the constant presence of technology\"],\n[\"Time management\",\"Devoting the right amount of time to each task, committing only to what you have time for, and prioritizing\"],\n[\"Toxic stress\",\"Stress from repeated, long-lasting exposure to severe stressors such as neglect, abuse, violence, or loss of a loved one\"],\n[\"Trauma\",\"Extreme stress due to deeply disturbing events such as disasters, sexual assault, or violence\"],\n[\"Visualization\",\"Relaxation technique that involves imagining yourself in a pleasant environment\"]\n];\nconst $=id=>document.getElementById(id);\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nlet pool,rounds,r,missed,selTerm,selDef,left,total,matched=new Set();\n\nfunction start(indices){\n  pool=shuffle(indices); total=pool.length; missed=new Set();\n  rounds=[]; for(let k=0;k<total;k+=10) rounds.push(pool.slice(k,k+10));\n  r=0; $('results').hidden=true; $('game').hidden=false; render();\n}\nfunction render(keep){\n  const ids=rounds[r]; selTerm=selDef=null; if(!keep)matched=new Set(); left=ids.length-matched.size; $('next').hidden=left!==0||r>=rounds.length-1;\n  $('shufallrow').hid  cause a drop in weight and dangerous side effects; also called water pills\"],\n[\"Empty calories\",\"Units of energy that supply few or no nutrients to the body\"],\n[\"Fad diets\",\"Stylish weight-loss plans that promise significant weight loss in short periods of time, often by cutting out food groups or buying premade meals\"],\n[\"Fat-soluble vitamins\",\"Type of vitamin that dissolves in the body's fats and can be stored for later use\"],\n[\"Fats\",\"Nutrients, largely made up of fatty acids, that provide a valuable source of energy for muscles and help absorb and transport vitamins and nutrients\"],\n[\"Food additives\",\"Substances added to food products to cause desired changes to flavor, shelf life, or other qualities\"],\n[\"Food allergy\",\"Condition in which the body's immune system reacts to a food as if it is harmful; tiny amounts of the food can cause sudden symptoms\"],\n[\"Food diary\",\"Daily record of what a person eats; used to track eating patterns and calorie intake\"],\n[\"Food intolerances\",\"Conditions in which a person's body cannot properly digest particular types of food; can develop gradually when a person eats large amounts of a certain food often\"],\n[\"Food preferences\",\"Opinions about different types of food; influenced by genetics, age, feelings and thoughts, cultural background, and social environment\"],\n[\"Foodborne illnesses\",\"Illnesses that are transmitted by food; also called food poisoning\"],\n[\"Foodborne infection\",\"Foodborne illness that occurs when food is handled or prepared improperly; caused by bacteria, viruses, or parasites\"],\n[\"Foodborne intoxication\",\"Foodborne illness caused by toxins, which are produced by organisms present in a food\"],\n[\"Generally recognized as safe (GRAS)\",\"Proven by the Food and Drug Administration (FDA) to be safe for consumption\"],\n[\"Genetically modified organism (GMO)\",\"Living thing with genetic material that has been altered through genetic engineering\"],\n[\"Glucose\",\"Simple carbohydrate and the preferred source of energy for the brain and central nervous system\"],\n[\"Malnutrition\",\"Form of poor nutrition in which a person does not get or properly absorb the recommended amounts of essential nutrients\"],\n[\"Metabolism\",\"Rate at which the body uses energy to carry out basic physiological processes\"],\n[\"Minerals\",\"Inorganic nutrients absorbed from plants, water, and animal food sources\"],\n[\"MyPlate\",\"Food guidance system created by the USDA; reminds people about the proportions of the five food groups they should eat at a meal\"],\n[\"Nutrient-dense foods\",\"Foods that provide vitamins, minerals, and other substances with positive health effects; contain little or no saturated fats, added sugars, and sodium\"],\n[\"Nutrients\",\"Chemical substances that provide the nutrition essential for growth, energy, and function\"],\n[\"Nutrition Facts label\",\"FDA-required label on all packaged foods; lists serving size, servings, calories, amounts of nutrients, and daily values\"],\n[\"Obesity\",\"Condition of excess body fat or excessive overweight\"],\n[\"Organic\",\"Produced without the use of chemical fertilizers, pesticides, or other artificial chemicals\"],\n[\"Overnutrition\",\"Form of malnutrition caused by consuming too many of some nutrients\"],\n[\"Overweight\",\"Condition of excess body weight from fat, bone, muscle, water, or a combination of these factors\"],\n[\"Protein\",\"Nutrient the body uses to build and maintain cells and tissues and provide energy; may also act as hormones or enzymes\"],\n[\"Saturated fats\",\"Type of fat found primarily in animal-based foods; typically solid at room temperature\"],\n[\"Trans fat\",\"Type of fat historically found in many processed foods; can also occur naturally in animal-based foods\"],\n[\"Undernutrition\",\"Form of malnutrition caused by the body not receiving or absorbing needed nutrients\"],\n[\"Underweight\",\"Condition of a body weight that is too l e-height:1}\n.opt.sel .box{background:var(--accent);border-color:var(--accent);color:var(--surface)}\n.opt:disabled{cursor:default}\n.opt.right{background:var(--good-soft);border-color:var(--good)}\n.opt.miss{background:var(--surface);border-color:var(--good);border-style:dashed}\n.opt.no{background:var(--bad-soft);border-color:var(--bad)}\n.fb{margin:0;padding:10px 12px;border-radius:10px;font-size:15px}\n.fb.ok{background:var(--good-soft)}\n.fb.bad{background:var(--bad-soft)}\n.fb b{font-family:var(--display)}\n.note{font-size:14px;color:var(--muted);margin:0}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.btn{font-family:var(--display);font-weight:600;font-size:16px;padding:11px 18px;border-radius:10px;border:none;background:var(--accent);color:var(--surface);cursor:pointer;align-self:flex-start}\n.btn:disabled{opacity:.45;cursor:default}\n.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}\n.row{display:flex;flex-wrap:wrap;gap:10px}\n.big{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}\n.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.tally div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}\n.tally b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}\n.missed{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}\n.missed b{font-family:var(--display)}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n[hidden]{display:none!important}\nhtml{color-scheme:light}\nbody{margin:0}\n<\/style>\n<script>\naddEventListener('message',e=>{const d=e.data||{};if(d.type==='theme'){if(d.theme)document.documentElement.dataset.theme=d.theme;else delete document.documentElement.dataset.theme}});\n<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <header>\n    <p class=\"eyebrow\">Health \u00b7 Unit 2 Test Review<\/p>\n    <h1>Unit 2 Practice Test<\/h1>\n    <p class=\"how\">Four parts: vocabulary matching, true or false, multiple choice, and select-all-that-apply. Each answer is checked right away, with the textbook page to review. Questions and choices reshuffle every time you retake it.<\/p>\n  <\/header>\n  <div class=\"row\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"reshuffle\" type=\"button\">Shuffle questions and answers<\/button><span class=\"note\" id=\"shufnote\">Starts over with a new random order.<\/span><\/div>\n  <nav class=\"steps\" id=\"steps\"><\/nav>\n  <main id=\"main\"><\/main>\n<\/div>\n\n<script>\nconst VOCAB=[\n[\"Rumination\",\"Repeatedly dwelling on the same negative thoughts, problems, or feelings\"],\n[\"Self-compassion\",\"Treating yourself with kindness and understanding when you fail, make mistakes, or are struggling\"],\n[\"Resilience\",\"Ability to recover, adapt, and bounce back after difficult events or adversity\"],\n[\"Empathy\",\"Ability to understand and share the feelings of another person\"],\n[\"Burnout\",\"State of emotional, physical, and mental exhaustion caused by prolonged stress\"],\n[\"Self-respect\",\"Valuing yourself and believing you deserve to be treated with dignity, including by yourself\"],\n[\"Relaxation response\",\"Physiological reaction in which the body returns to its resting state after a stressful event\"],\n[\"Emotional empathy\",\"Ability to actually feel or share the emotions another person is experiencing\"],\n[\"Core values\",\"Deeply held beliefs about what is most important, which guide a person's decisions and behavior\"],\n[\"Self-talk\",\"The inner voice and messages you tell yourself, which can be positive or negative\"],\n[\"Body scan\",\"Relaxation technique of paying careful attention to the body, finding signs of tension, and releasing that tension\"],\n[\"Biological sex\",\"Classification as male or female based on physical traits such as chromosomes, hormones, and reproductive organs\"],\n[\"Cognitive empathy\",\"Ability to understand another person's point of view and know what they are thinking or feeling\"],\n[\"Tolerance\",\"Body's need for an increased amount of a substance to experience the effects once felt with smaller amounts\"],\n[\"Toxic stress\",\"Stress from repeated, long-lasting exposure to severe stressors such as neglect, abuse, violence, or loss of a loved one\"],\n[\"Diversity\",\"The differences among people, such as culture, race, ethnicity, religion, abilities, and beliefs\"],\n[\"Outlook\",\"A person's general attitude or way of viewing life and the future\"]\n];\n\nconst TF_ALL=[\n{f:{q:\"People with healthy self-esteem often worry about what other people think of them.\",\n    why:\"People with healthy self-esteem feel secure in who they are, so they don't constantly worry about others' opinions.\"},\n t:{q:\"People with healthy self-esteem do not spend a lot of time worrying about what other people think of them.\",\n    why:\"Healthy self-esteem means feeling secure in who you are, so others' opinions don't control you.\"}},\n{f:{q:\"People with low emotional intelligence control their feelings and impulses and act with thought and integrity.\",\n    why:\"That describes people with high emotional intelligence. Low emotional intelligence makes feelings and impulses harder to control.\"},\n t:{q:\"People with high emotional intelligence control their feelings and impulses and act with thought and integrity.\",\n    why:\"Controlling feelings and impulses and acting with thought and integrity are signs of high emotional intelligence.\"}},\n{f:{q:\"Feeling happy is easier for people who do not have a mental illness because happiness means you have only positive emotions all the time.\",\n    why:\"Happiness does not mean having only positive emotions. Everyone feels negative emotions sometimes, and people with mental illnesses can also experience happiness.\"},\n t:{q:\"Happiness does not mean having only positive emotions all the time, and people with a mental illness can also experience happiness.\",\n    why:\"Everyone feels negative emotions sometimes. Being happy doesn't require only positive emotions, and people with mental illnesses can feel happy too.\"}},\n{f:{q:\"Experiencing adversity decreases a person's resilience, making it harder to recover from future difficult events.\",\n    why:\"Working through adversity often builds resilience, making it easier to recover from future difficult events.\"},\n t:{q:\"Experiencing adversity can increase a person's resilience, making it easier to recover from future difficult events.\",\n    why:\"Working through hard times builds resilience, which helps people recover from later difficulties.\"}},\n{f:{q:\"If a person confides in you about considering suicide, or if you think someone is considering suicide, you should keep it secret.\",\n    why:\"Never keep it secret. Tell a trusted adult right away. You can also call or text 988, the Suicide & Crisis Lifeline.\"},\n t:{q:\"If a person confides in you about considering suicide, or if you think someone is considering suicide, you should tell a trusted adult right away instead of keeping it secret.\",\n    why:\"Getting help quickly matters more than keeping a secret. You can also call or text 988, the Suicide & Crisis Lifeline.\"}}\n];\nlet TF=[];\nfunction pickTF(){\n  const idx=shuffle(TF_ALL.map((_,i)=>i)), nTrue=2+Math.floor(Math.random()*2), tset=new Set(idx.slice(0,nTrue));\n  TF=TF_ALL.map((x,i)=>tset.has(i)?{q:x.t.q,a:true,why:x.t.why}:{q:x.f.q,a:false,why:x.f.why});\n}\n\nconst MC=[\n{\"q\":\"Which personality disorder involves an exaggerated sense of one's own importance, a deep need for excessive attention, and a lack of empathy?\",\"pg\":217,\"a\":\"Narcissistic personality disorder\",\"o\":[\"Borderline personality disorder\",\"Paranoid personality disorder\",\"Obsessive-compulsive personality disorder\",\"Antisocial personality disorder\",\"Schizoid personality disorder\"],\"why\":\"An exaggerated sense of importance, a need for excessive attention, and a lack of empathy define narcissistic personality disorder.\"},\n{\"q\":\"Which stage of the Mental Health Continuum are you in if you are experiencing sadness and low energy?\",\"pg\":104,\"a\":\"Reacting\",\"o\":[\"Healthy\",\"Ill\",\"Injured\"],\"why\":\"The continuum goes Healthy \u2192 Reacting \u2192 Injured \u2192 Ill. Sadness and low energy are signs of the Reacting stage.\"},\n{\"q\":\"Which defense mechanism is the transfer of feelings to another person or object?\",\"pg\":130,\"a\":\"Displacement\",\"o\":[\"Reaction formation\",\"Projection\",\"Intellectualization\",\"Denial\",\"Rationalization\",\"Regression\",\"Repression\"],\"why\":\"Displacement moves feelings onto another person or object, like yelling at a sibling when you're actually angry at a coach.\"},\n{\"q\":\"Are your responses to different stressors in or out of your field of control?\",\"pg\":151,\"a\":\"In your field of control\",\"o\":[\"Out of your field of control\"],\"why\":\"You can't always control the stressor, but your response to it is in your control.\"},\n{\"q\":\"In Maslow's Hierarchy of Human Needs, which needs must be met before anything else?\",\"pg\":107,\"a\":\"Physical needs\",\"o\":[\"Self-actualization\",\"Love and acceptance needs\",\"Security needs\",\"Esteem needs\"],\"why\":\"The order is physical needs \u2192 security \u2192 love and acceptance \u2192 esteem \u2192 self-actualization. Physical needs come first.\"},\n{\"q\":\"Is \\\"Change is impossible\\\" a good example of positive self-talk?\",\"pg\":196,\"a\":\"No\",\"o\":[\"Yes\"],\"why\":\"\\\"Change is impossible\\\" is negative self-talk.\"},\n{\"q\":\"Do people with resilience have negative or positive views of themselves?\",\"pg\":165,\"a\":\"Positive views of themselves\",\"o\":[\"Negative views of themselves\"],\"why\":\"Resilient people have positive views of themselves and confidence in their strengths and abilities.\"},\n{\"q\":\"What is the order of the 5 stages of grief?\",\"pg\":238,\"a\":\"Denial \u2192 Anger \u2192 Bargaining \u2192 Depression \u2192 Acceptance\",\"o\":[\"Denial \u2192 Bargaining \u2192 Anger \u2192 Acceptance \u2192 Depression\",\"Anger \u2192 Denial \u2192 Depression \u2192 Bargaining \u2192 Acceptance\",\"Depression \u2192 Denial \u2192 Anger \u2192 Bargaining \u2192 Acceptance\"],\"why\":\"Memory trick: DABDA (Denial, Anger, Bargaining, Depression, Acceptance). Likely to be on the test.\"},\n{\"q\":\"In which stage of grief do people often feel out of control and helpless in the face of death?\",\"pg\":238,\"a\":\"Bargaining\",\"o\":[\"Denial\",\"Depression\",\"Anger\",\"Acceptance\"],\"why\":\"In bargaining, people feel out of control and helpless and try to regain control.\"},\n{\"q\":\"Which illness involves difficulty paying attention, overly active behavior, and impulsiveness?\",\"pg\":214,\"a\":\"ADHD (attention-deficit/hyperactivity disorder)\",\"o\":[\"Autism spectrum disorder\",\"Obsessive-compulsive disorder (OCD)\",\"Bipolar disorder\"],\"why\":\"Trouble paying attention, overly active behavior, and impulsiveness are the signs of ADHD.\"}\n];\n\nconst MULTI=[\n{\"q\":\"Which are impacts that stress has on the cardiovascular system?\",\"pg\":186,\"a\":[\"Heart rate and blood pressure increase\",\"Chronic wear and tear increases the risk of heart attack, stroke, and other cardiovascular diseases\",\"Fatty deposits and glucose build up on blood vessel walls over time, narrowing them\",\"The heart must work harder to pump blood\"],\"o\":[\"Blood vessels permanently widen\",\"Heart rate and blood pressure decrease\"],\"why\":\"If stress is resolved, the body should relax and return to normal. Chronic stress causes lasting damage.\"},\n{\"q\":\"Which are healthy, positive ways to accept and express your emotions?\",\"pg\":133,\"a\":[\"Documenting a positive moment\",\"Crying\",\"Sharing with friends, family, or a trusted adult\",\"Doing an activity you enjoy\",\"Finding a reason to laugh\",\"Taking a walk or run\",\"Taking a long bath or shower\",\"Writing in a journal\"],\"o\":[\"Lashing out at others\",\"Bottling feelings up so no one sees them\"],\"why\":\"The book also lists reducing stress. Healthy expression lets feelings out without hurting yourself or others.\"},\n{\"q\":\"Which are tendencies of teens who focus on finding meaning and purpose in life?\",\"pg\":145,\"a\":[\"Hold beliefs in causes or ideas bigger than themselves\",\"Learn from failure, which teaches resilience and persistence\",\"Find inspiring mentors, such as parents, teachers, and coaches\",\"Spend time in the community through a part-time job, volunteering, or causes\",\"Work with other people instead of competing against them\",\"Do what they love instead of what they think others want them to do\"],\"o\":[\"Avoid failure at all costs\",\"Do whatever others expect of them\"],\"why\":\"Teens focused on purpose follow what they love, collaborate, find mentors, get involved, learn from failure, and believe in something bigger than themselves.\"},\n{\"q\":\"Which describe a positive environment that can build self-esteem?\",\"pg\":125,\"a\":[\"Being supported for your successes\",\"Being supported when situations don't go your way\"],\"o\":[\"Being criticized for any shortcomings\",\"Being held to impossibly high standards\"],\"why\":\"In a positive environment, people are supported both when they succeed and when things go wrong.\"},\n{\"q\":\"Which are characteristics of a person who has a \\\"sense of balance\\\"?\",\"pg\":103,\"a\":[\"Feels comfortable spending time alone\",\"Enjoys spending time with others\"],\"o\":[\"Avoids being alone whenever possible\",\"Avoids spending time with others\"],\"why\":\"A person with a sense of balance enjoys time with others and is also comfortable alone.\"},\n{\"q\":\"Which are healthy practices for self-compassion?\",\"pg\":168,\"a\":[\"Treat yourself the way you would treat a close friend or sibling\",\"Remind yourself that your experiences are normal, human experiences\",\"Be mindful of negative self-talk\"],\"o\":[\"Assume no one else has ever struggled the way you do\",\"Criticize yourself harshly so you'll do better\"],\"why\":\"Self-compassion means kindness toward yourself, watching your self-talk, and remembering that everyone struggles.\"},\n{\"q\":\"Which are examples of how stigma affects people with mental illness?\",\"pg\":228,\"a\":[\"They feel shame and embarrassment\",\"They deny they have a condition\"],\"o\":[\"They talk openly about their condition\",\"They feel more comfortable seeking treatment\"],\"why\":\"Stigma can lead people to deny their condition or feel ashamed and embarrassed, which keeps them from getting help.\"},\n{\"q\":\"Which are characteristics of people with empathy?\",\"pg\":162,\"a\":[\"Acknowledge how others feel instead of brushing off their concerns\",\"Imitate people's behavior to build a connection, such as matching eye contact\",\"Give emotional support and reassurance\",\"Stay with people during challenges instead of rushing to find solutions\",\"Avoid judging and blaming people for their struggles\",\"Show care and concern about other people's feelings\",\"Put themselves in other people's shoes and see the world from their perspective\",\"Ask questions to clarify what others are experiencing\"],\"o\":[\"Dismiss feelings that seem overblown\",\"Rush to fix the problem so the conversation can end\"],\"why\":\"People with empathy can take another person's perspective and even feel the same emotions.\"},\n{\"q\":\"Which describe a negative environment that can harm self-esteem?\",\"pg\":125,\"a\":[\"Being criticized for any shortcomings\",\"Being held to impossibly high standards\",\"Being blamed for failures and disappointments\"],\"o\":[\"Being supported when situations don't go your way\",\"Being supported for your successes\"],\"why\":\"Negative environments criticize shortcomings, blame people for failures, and set impossibly high standards.\"},\n{\"q\":\"Which are benefits of happiness?\",\"pg\":143,\"a\":[\"Reduced risk of health conditions\",\"Lower levels of stress and anxiety\",\"Better mental and emotional health\",\"Better health habits\",\"Longer life\",\"Faster recovery from health conditions\",\"Stronger support system\"],\"o\":[\"Never getting sick\",\"Never feeling sadness again\"],\"why\":\"Happiness brings many health benefits, but it does not remove negative emotions or illness entirely.\"}\n];\n\nconst $=id=>document.getElementById(id);\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst esc=s=>s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n\nconst PARTS=[\n {key:'vocab',name:'Vocabulary',total:VOCAB.length},\n {key:'tf',name:'True/False',total:TF.length},\n {key:'mc',name:'Multiple choice',total:MC.length},\n {key:'multi',name:'Select all',total:MULTI.length},\n {key:'results',name:'Results'}\n];\nlet S, cur=0;\n\nfunction newTest(){\n  pickTF();\n  S={\n    vocab:{order:null,page:0,missed:new Set(),done:0,finished:false},\n    tf:{order:shuffle(TF.map((_,i)=>i)),ans:{}},\n    mc:{order:shuffle(MC.map((_,i)=>i)),opts:MC.map(m=>shuffle([m.a,...m.o])),ans:{}},\n    multi:{order:shuffle(MULTI.map((_,i)=>i)),opts:MULTI.map(m=>shuffle([...m.a,...m.o])),pick:{},ans:{}}\n  };\n  const p=shuffle(VOCAB.map((_,i)=>i)); S.vocab.order=[p.slice(0,9),p.slice(9)];\n  go(0);\n}\nfunction partScore(k){\n  if(k==='vocab'){const v=S.vocab;return {done:v.done,right:v.done-[...v.missed].filter(i=>v.matched?.has(i)).length,total:VOCAB.length}}\n  const st=S[k];const vals=Object.values(st.ans);return {done:vals.length,right:vals.filter(Boolean).length,total:PARTS.find(p=>p.key===k).total};\n}\nfunction vocabRight(){return VOCAB.length-S.vocab.missed.size}\nfunction drawSteps(){\n  $('steps').innerHTML='';\n  PARTS.forEach((p,i)=>{\n    const b=document.createElement('button');b.className='step'+(i===cur?' on':'');\n    let sub='';\n    if(p.key==='results') sub='Score';\n    else if(p.key==='vocab') sub=`${S.vocab.done}/${p.total} done`;\n    else sub=`${Object.keys(S[p.key].ans).length}/${p.total} done`;\n    b.innerHTML=`<b>${esc(p.name)}<\/b><span>${sub}<\/span>`;\n    b.onclick=()=>go(i);\n    $('steps').append(b);\n  });\n}\nfunction go(i){cur=i;drawSteps();const k=PARTS[i].key;\n  ({vocab:drawVocab,tf:drawTF,mc:drawMC,multi:drawMulti,results:drawResults})[k]();\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction nextBtn(label){const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=()=>go(cur+1);return b}\n\n/* ---------- Part 1: matching ---------- */\nlet selT=null,selD=null;\nfunction drawVocab(){\n  const v=S.vocab, ids=v.order[v.page];\n  const m=$('main'); m.innerHTML='';\n  const part=document.createElement('section');part.className='part';\n  part.innerHTML=`<h2>Part 1: Vocabulary matching<\/h2>\n   <p class=\"note\">Tap a term, then tap its definition. Page ${v.page+1} of 2 (${v.order[0].length} terms, then ${v.order[1].length}).<\/p>\n   <div class=\"sub\"><div class=\"meter\"><i style=\"width:${v.done/VOCAB.length*100}%\"><\/i><\/div><span>${v.done} of ${VOCAB.length} matched<\/span><\/div>\n   <p class=\"label\">Terms<\/p><div class=\"terms\" id=\"terms\"><\/div>\n   <p class=\"label\">Definitions<\/p><div class=\"defs\" id=\"defs\"><\/div>\n   <div class=\"row\" id=\"vnav\"><\/div>`;\n  m.append(part);\n  v.matched=v.matched||new Set();\n  selT=selD=null;\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='term'+(v.matched.has(i)?' done':'');b.textContent=VOCAB[i][0];b.dataset.i=i;b.onclick=()=>pickV('t',b);$('terms').append(b)});\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='def'+(v.matched.has(i)?' done':'');b.dataset.i=i;\n    if(v.matched.has(i)){const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+VOCAB[i][0];b.append(a)}\n    const d=document.createElement('span');d.textContent=VOCAB[i][1];b.append(d);b.onclick=()=>pickV('d',b);$('defs').append(b)});\n  vnav();\n}\nfunction vnav(){\n  const v=S.vocab,n=$('vnav');n.innerHTML='';\n  const pageDone=v.order[v.page].every(i=>v.matched.has(i));\n  if(v.page===0){const b=document.createElement('button');b.className='btn';b.textContent='Next page';b.disabled=!pageDone;b.onclick=()=>{v.page=1;drawVocab();window.scrollTo({top:0,behavior:'smooth'})};n.append(b)}\n  else{\n    const back=document.createElement('button');back.className='btn ghost';back.textContent='Previous page';back.onclick=()=>{v.page=0;drawVocab()};n.append(back);\n    const b=nextBtn('Go to Part 2');b.disabled=!pageDone;n.append(b);\n  }\n}\nfunction pickV(kind,el){\n  if(el.classList.contains('done'))return;\n  if(kind==='t'){if(selT)selT.classList.remove('sel');selT=selT===el?null:el}else{if(selD)selD.classList.remove('sel');selD=selD===el?null:el}\n  if(el===selT||el===selD)el.classList.add('sel');\n  if(selT&&selD){\n    const t=selT,d=selD;t.classList.remove('sel');d.classList.remove('sel');selT=selD=null;\n    const v=S.vocab;\n    if(t.dataset.i===d.dataset.i){\n      const i=+t.dataset.i;v.matched.add(i);v.done++;\n      t.classList.add('done');d.classList.add('done');\n      const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+t.textContent;d.prepend(a);\n      document.querySelector('.meter i').style.width=(v.done/VOCAB.length*100)+'%';\n      document.querySelector('.sub span').textContent=`${v.done} of ${VOCAB.length} matched`;\n      drawSteps();vnav();\n    }else{\n      v.missed.add(+t.dataset.i);v.missed.add(+d.dataset.i);\n      [t,d].forEach(e=>{e.classList.add('wrong');setTimeout(()=>e.classList.remove('wrong'),450)});\n    }\n  }\n}\n\n/* ---------- shared question card ---------- */\nfunction card(n,text,pg){\n  const q=document.createElement('div');q.className='q';\n  q.innerHTML=`<div class=\"qhead\"><span class=\"qn\">${n}.<\/span><p class=\"qt\">${esc(text)}${pg?` <span class=\"pg\">(pg. ${pg})<\/span>`:''}<\/p><\/div>`;\n  return q;\n}\nfunction fb(q,ok,html){const p=document.createElement('p');p.className='fb '+(ok?'ok':'bad');p.innerHTML=html;q.append(p)}\nfunction partShell(title,note){\n  const m=$('main');m.innerHTML='';\n  const s=document.createElement('section');s.className='part';\n  s.innerHTML=`<h2>${title}<\/h2><p class=\"note\">${note}<\/p>`;m.append(s);return s;\n}\n\n/* ---------- Part 2: true/false ---------- */\nfunction drawTF(){\n  const s=partShell('Part 2: True or false','Remember: if any part of the statement is false, the whole statement is false.');\n  S.tf.order.forEach((qi,n)=>{\n    const it=TF[qi],q=card(n+1,it.q);const o=document.createElement('div');o.className='opts row2';\n    [true,false].forEach(val=>{\n      const b=document.createElement('button');b.className='opt';b.textContent=val?'True':'False';\n      const answered=qi in S.tf.ans;\n      if(answered){b.disabled=true;if(val===it.a)b.classList.add('right');else if(S.tf.chosen?.[qi]===val)b.classList.add('no')}\n      b.onclick=()=>{S.tf.ans[qi]=(val===it.a);(S.tf.chosen=S.tf.chosen||{})[qi]=val;drawTF();drawSteps()};\n      o.append(b);\n    });\n    q.append(o);\n    if(qi in S.tf.ans)fb(q,S.tf.ans[qi],`<b>${S.tf.ans[qi]?'Correct.':'Not quite.'}<\/b> The answer is <b>${it.a?'True':'False'}<\/b>. ${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn('Go to Part 3'));\n}\n\n/* ---------- Part 3: multiple choice ---------- */\nfunction drawMC(){\n  const s=partShell('Part 3: Multiple choice','Choose the best answer.');\n  S.mc.order.forEach((qi,n)=>{\n    const it=MC[qi],q=card(n+1,it.q,it.pg);const o=document.createElement('div');o.className='opts';\n    const answered=qi in S.mc.ans;\n    S.mc.opts[qi].forEach(txt=>{\n      const b=document.createElement('button');b.className='opt';b.textContent=txt;\n      if(answered){b.disabled=true;if(txt===it.a)b.classList.add('right');else if(S.mc.chosen?.[qi]===txt)b.classList.add('no')}\n      b.onclick=()=>{S.mc.ans[qi]=(txt===it.a);(S.mc.chosen=S.mc.chosen||{})[qi]=txt;drawMC();drawSteps()};\n      o.append(b);\n    });\n    q.append(o);\n    if(answered)fb(q,S.mc.ans[qi],`<b>${S.mc.ans[qi]?'Correct.':'Not quite.'}<\/b> ${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn('Go to Part 4'));\n}\n\n/* ---------- Part 4: select all ---------- */\nfunction drawMulti(){\n  const s=partShell('Part 4: Select all that apply','Pick every correct answer, then tap Check. You need all the right ones and none of the wrong ones to get credit.');\n  S.multi.order.forEach((qi,n)=>{\n    const it=MULTI[qi],q=card(n+1,it.q,it.pg);const o=document.createElement('div');o.className='opts';\n    const answered=qi in S.multi.ans;const picked=S.multi.pick[qi]=S.multi.pick[qi]||new Set();\n    S.multi.opts[qi].forEach(txt=>{\n      const b=document.createElement('button');b.className='opt'+(picked.has(txt)?' sel':'');\n      const isRight=it.a.includes(txt);\n      b.innerHTML=`<span class=\"box\">${picked.has(txt)?'\u2713':''}<\/span><span><\/span>`;b.lastChild.textContent=txt;\n      if(answered){b.disabled=true;b.classList.remove('sel');\n        if(isRight&&picked.has(txt))b.classList.add('right');\n        else if(isRight)b.classList.add('miss');\n        else if(picked.has(txt))b.classList.add('no');\n        b.firstChild.textContent=isRight?'\u2713':(picked.has(txt)?'\u2717':'');\n      }\n      b.onclick=()=>{picked.has(txt)?picked.delete(txt):picked.add(txt);drawMultiKeep()};\n      o.append(b);\n    });\n    q.append(o);\n    if(answered){\n      fb(q,S.multi.ans[qi],`<b>${S.multi.ans[qi]?'Correct.':'Not quite.'}<\/b> ${S.multi.ans[qi]?'':'Dashed boxes are correct answers you missed. '}${esc(it.why)}`);\n    }else{\n      const c=document.createElement('button');c.className='btn ghost';c.textContent='Check';c.disabled=picked.size===0;\n      c.onclick=()=>{S.multi.ans[qi]=it.a.length===picked.size&&it.a.every(x=>picked.has(x));drawMultiKeep();drawSteps()};\n      q.append(c);\n    }\n    s.append(q);\n  });\n  s.append(nextBtn('See results'));\n}\nfunction drawMultiKeep(){const y=window.scrollY;drawMulti();window.scrollTo(0,y)}\n\n/* ---------- Results ---------- */\nfunction drawResults(){\n  const vr=S.vocab.done?vocabRight():0;\n  const tf=Object.values(S.tf.ans).filter(Boolean).length,mc=Object.values(S.mc.ans).filter(Boolean).length,mu=Object.values(S.multi.ans).filter(Boolean).length;\n  const total=VOCAB.length+TF.length+MC.length+MULTI.length,right=(S.vocab.done===VOCAB.length?vr:0)+tf+mc+mu;\n  const unanswered=(VOCAB.length-S.vocab.done)+(TF.length-Object.keys(S.tf.ans).length)+(MC.length-Object.keys(S.mc.ans).length)+(MULTI.length-Object.keys(S.multi.ans).length);\n  const s=partShell('Results',unanswered?`${unanswered} question${unanswered>1?'s are':' is'} still unanswered. Unanswered questions count as wrong.`:'Every question answered. Vocabulary counts terms you matched on the first try.');\n  const box=document.createElement('div');box.style.cssText='display:flex;flex-direction:column;gap:14px';\n  box.innerHTML=`<div><p class=\"label\">Total score<\/p><div class=\"big\">${right}/${total} <span style=\"font-size:22px;color:var(--muted)\">${Math.round(right/total*100)}%<\/span><\/div><\/div>\n   <div class=\"tally\">\n    <div><span class=\"label\">Vocabulary<\/span><b>${S.vocab.done===VOCAB.length?vr:0}/${VOCAB.length}<\/b><\/div>\n    <div><span class=\"label\">True/False<\/span><b>${tf}/${TF.length}<\/b><\/div>\n    <div><span class=\"label\">Multiple choice<\/span><b>${mc}/${MC.length}<\/b><\/div>\n    <div><span class=\"label\">Select all<\/span><b>${mu}/${MULTI.length}<\/b><\/div>\n   <\/div>`;\n  s.append(box);\n  const items=[];\n  if(S.vocab.done===VOCAB.length)[...S.vocab.missed].forEach(i=>items.push(`<li><b>${esc(VOCAB[i][0])}<\/b>: ${esc(VOCAB[i][1])}<\/li>`));\n  TF.forEach((t,i)=>{if(S.tf.ans[i]===false)items.push(`<li><b>${t.a?'True':'False'}:<\/b> ${esc(t.q)} ${esc(t.why)}<\/li>`)});\n  MC.forEach((m,i)=>{if(S.mc.ans[i]===false)items.push(`<li>${esc(m.q)} <b>${esc(m.a)}<\/b> <span class=\"pg\">(pg. ${m.pg})<\/span><\/li>`)});\n  MULTI.forEach((m,i)=>{if(S.multi.ans[i]===false)items.push(`<li>${esc(m.q)} <b>${m.a.map(esc).join('; ')}<\/b> <span class=\"pg\">(pg. ${m.pg})<\/span><\/li>`)});\n  if(items.length){const h=document.createElement('p');h.className='label';h.textContent='Review these';s.append(h);const ul=document.createElement('ul');ul.className='missed';ul.innerHTML=items.join('');s.append(ul)}\n  else if(!unanswered){const p=document.createElement('p');p.textContent='Perfect score. You are ready for the Unit 2 test.';p.style.margin='0';s.append(p)}\n  const r=document.createElement('div');r.className='row';\n  const again=document.createElement('button');again.className='btn';again.textContent='Retake with new shuffle';again.onclick=newTest;r.append(again);\n  s.append(r);\n}\n$('reshuffle').onclick=()=>{newTest();const n=$('shufnote');n.textContent='Shuffled. New order loaded.';setTimeout(()=>n.textContent='Starts over with a new random order.',2500)};\nnewTest();\n<\/script>\n\n<\/body>\n<\/html>\n"};
const META={ch6:{t:'Ch 6 · Stress',k:'k6'},ch7:{t:'Ch 7 · Mental Health',k:'k7'},ch8:{t:'Ch 8 · Nutrition',k:'k8'},unit2:{t:'Unit 2 Practice Test',k:'ku2'}};
const home=document.getElementById('home'),view=document.getElementById('view'),frame=document.getElementById('frame');
function sendTheme(){try{frame.contentWindow&&frame.contentWindow.postMessage({type:'theme',theme:document.documentElement.dataset.theme||''},'*')}catch(e){}}
frame.addEventListener('load',sendTheme);
new MutationObserver(sendTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function openQuiz(q){
  if(!QUIZ[q])return;
  const m=META[q];
  document.getElementById('vtitle').innerHTML=`<span class="dot ${m.k}"></span>`;
  document.getElementById('vtitle').append(m.t);
  frame.srcdoc=QUIZ[q];
  home.hidden=true;view.hidden=false;document.getElementById('back').focus();
  if(location.hash!=='#'+q)location.hash=q;
}
function closeQuiz(){
  view.hidden=true;home.hidden=false;frame.removeAttribute('srcdoc');frame.src='about:blank';
  if(location.hash)history.replaceState?history.replaceState(null,'',location.pathname+location.search):location.hash='';
}
document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>openQuiz(b.dataset.q));
document.getElementById('back').onclick=closeQuiz;
addEventListener('hashchange',()=>{const q=location.hash.slice(1);if(QUIZ[q])openQuiz(q);else if(!view.hidden)closeQuiz()});
const start=location.hash.slice(1);if(QUIZ[start])openQuiz(start);
</script>
