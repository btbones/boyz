<style>
:root{

}

    --bg:#12161B; --surface:#1B2027; --ink:#E6EAEF; --muted:#98A2AE; --line:#2E3540; --hover:#56606C;

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161B; --surface:#1B2027; --ink:#E6EAEF; --muted:#98A2AE; --line:#2E3540; --hover:#56606C;
  --c6:#4FC0B5; --c6s:#173B3A; --c7:#93A2F0; --c7s:#232A4D; --c8:#B7CC6B; --c8s:#2E3A1C; --c9:#E0B25C; --c9s:#3D3016; --c10:#F0909E; --c10s:#40202A; --u2:#D49ADB; --u2s:#3A2440;
}
[hidden]{display:none!important}
*{box-sizing:border-box}

.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.go{flex:none;font-family:var(--display);font-weight:600;color:var(--c);font-size:15px;white-space:nowrap}
.k6{--c:var(--c6);--s:var(--c6s)} .k7{--c:var(--c7);--s:var(--c7s)} .k8{--c:var(--c8);--s:var(--c8s)} .k9{--c:var(--c9);--s:var(--c9s)} .k10{--c:var(--c10);--s:var(--c10s)} .ku2{--c:var(--u2);--s:var(--u2s)}
@media (max-width:420px){.go{display:none}}
/* quiz view */
#view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:5}
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:var(--surface);border-bottom:1.5px solid var(--line)}

.back:hover{border-color:var(--hover)}
.back:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar .t{font-family:var(--display);font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.up{align-self:flex-start;text-decoration:none;margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
#frame{flex:1;width:100%;border:0;display:block;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body{margin:0}
</style>
</head>

    </div>

</div>

<script>
const QUIZ={"ch6": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch 6 Stress Match<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\">\n<style>\n:root{\n  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#18292D; --muted:#5A6D70; --line:#CFDAD7;\n  --accent:#0F6E6A; --accent-soft:#D5EAE6; --good:#2E7D4F; --good-soft:#DDF0E3;\n  --bad:#B3412E; --bad-soft:#F6DFDA;\n  --display:\"Bricolage Grotesque\", \"Segoe UI\", system-ui, sans-serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    color-scheme:dark;\n    --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n    --accent:#4FC0B5; --accent-soft:#173B3A; --good:#5BC486; --good-soft:#163527;\n    --bad:#F08A76; --bad-soft:#3E211C;\n  }\n}\n:root[data-theme=\"dark\"]{\n  color-scheme:dark;\n  --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n  --accent:#4FC0B5; --accent-soft:#173B3A; --good:#5BC486; --good-soft:#163527;\n  --bad:#F08A76; --bad-soft:#3E211C;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}\n.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}\nheader{display:flex;flex-direction:column;gap:6px}\n.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}\nh1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}\n.how{color:var(--muted);margin:0;max-width:60ch}\n.status{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}\n.meter{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}\n.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}\n.status span{font-size:14px;color:var(--muted);white-space:nowrap}\n.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}\n.terms{display:flex;flex-wrap:wrap;gap:8px}\n.term{font-family:var(--display);font-weight:600;font-size:16px;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}\n.term:hover{border-color:var(--accent)}\n.defs{display:flex;flex-direction:column;gap:10px}\n.def{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:background .15s,border-color .15s}\n.def:hover{border-color:var(--accent)}\n.def .ans{font-family:var(--display);font-weight:600;font-size:14px;color:var(--good)}\n.sel{background:var(--accent-soft);border-color:var(--accent)}\n.done{background:var(--good-soft);border-color:var(--good);cursor:default}\n.term.done{color:var(--good)}\n.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;animation:shake .35s}\n@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.btn{font-family:var(--display);font-weight:600;font-size:16px;padding:12px 20px;border-radius:10px;border:none;background:var(--accent);color:var(--bg);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}\n.row{display:flex;flex-wrap:wrap;gap:10px}\n.results{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}\n.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}\n.missed{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}\n.missed b{font-family:var(--display)}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n.top{display:flex;align-items:center;justify-content:space-between;gap:12px}\n.top .eyebrow{margin:0}\n.btn.sm{padding:8px 14px;font-size:15px;white-space:nowrap}\n.plan{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}\n.plan summary{font-family:var(--display);font-weight:600;cursor:pointer}\n.plan ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}\n.tabs{display:flex;flex-wrap:wrap;gap:8px}\n.tab{font-family:var(--display);font-weight:600;font-size:16px;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}\n.tab:hover{border-color:var(--accent)}\n.tab[aria-selected=\"true\"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}\n.pset select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}\n.pane{display:flex;flex-direction:column;gap:18px}\n.group{display:flex;flex-direction:column;gap:10px}\n.group h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0}\n.tip{margin:0;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:15px}\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-items:start}\n.card{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}\n.card:hover{border-color:var(--accent)}\n.card b{font-family:var(--display);font-size:17px}\n.card .hint{font-size:13px;color:var(--muted)}\n.card .back{display:none;flex-direction:column;gap:8px}\n.card.open{border-color:var(--accent)}\n.card.open .hint{display:none}\n.card.open .back{display:flex}\n.hook{color:var(--accent);font-size:14px}\n.card .hook b{font-family:inherit;font-size:inherit}\n.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}\n.q{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.3;margin:0}\n.sub{color:var(--muted);font-size:14px}\n.opts{display:flex;flex-direction:column;gap:8px}\n.opts .def{font-family:var(--display);font-weight:600}\n.opts .def.miss{background:var(--bad-soft);border-color:var(--bad)}\n.why{margin:0}\n.why b{font-family:var(--display)}\n.answer{font-family:var(--display);font-weight:800;font-size:26px;margin:0;color:var(--accent)}\n\n[hidden]{display:none!important}\nhtml{color-scheme:light}\nbody{margin:0}\n<\/style>\n<script>\naddEventListener('message',e=>{const d=e.data||{};if(d.type==='theme'){if(d.theme)document.documentElement.dataset.theme=d.theme;else delete document.documentElement.dataset.theme}});\n<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <header>\n    <div class=\"top\"><p class=\"eyebrow\">Health \u00b7 Chapter 6 \u00b7 Stress<\/p><button class=\"btn ghost sm\" id=\"mode\" type=\"button\">Study Guide<\/button><\/div>\n    <h1 id=\"title\">Stress Match<\/h1>\n    <p class=\"how\" id=\"how\">Tap a term, then tap the definition it goes with. 27 terms across 3 pages (10, 10, then 7). Use <b>Shuffle page<\/b> to reorder the current page or <b>Shuffle all<\/b> on page 1 to mix words across pages. Your score counts matches you got on the first try.<\/p>\n  <\/header>\n  <div id=\"match\" style=\"display:flex;flex-direction:column;gap:18px\">\n  <div class=\"status\"><div class=\"meter\"><i id=\"bar\"><\/i><\/div><span id=\"count\">Page 1 of 3<\/span><\/div>\n  <section id=\"game\" style=\"display:flex;flex-direction:column;gap:14px\">\n    <div class=\"row\" id=\"shufallrow\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"shufall\" type=\"button\">Shuffle all<\/button><span class=\"note\" id=\"shufallnote\">Mixes all words across every page and starts over.<\/span><\/div>\n    <p class=\"label\">Terms<\/p>\n    <div class=\"terms\" id=\"terms\"><\/div>\n    <p class=\"label\">Definitions<\/p>\n    <div class=\"defs\" id=\"defs\"><\/div>\n    <div class=\"row\"><button class=\"btn ghost\" id=\"shufpage\" type=\"button\">Shuffle page<\/button><button class=\"btn\" id=\"next\" hidden>Next page<\/button><\/div>\n  <\/section>\n  <section class=\"results\" id=\"results\" hidden><\/section>\n  <\/div>\n  <section id=\"guide\" hidden style=\"display:flex;flex-direction:column;gap:16px\">\n    <p class=\"how\">Learn the 27 words in 5 groups, then practice remembering them without looking. Short sessions on 3 or 4 different days work better than one long session.<\/p>\n    <details class=\"plan\"><summary>4-day study plan<\/summary><ol>\n      <li><b>Day 1:<\/b> Go through the <b>Word cards<\/b>. Explain each word in your own words and say its hook. Then play the match quiz once.<\/li>\n      <li><b>Day 2:<\/b> <b>Say the word.<\/b> Spend your time on the ones you miss.<\/li>\n      <li><b>Day 3:<\/b> <b>Which one?<\/b> Then <b>Say the word<\/b> again.<\/li>\n      <li><b>Day before the test:<\/b> Match quiz with <b>Shuffle all<\/b>, then practice the words you missed.<\/li>\n    <\/ol><\/details>\n    <div class=\"tabs\" role=\"tablist\">\n      <button class=\"tab\" role=\"tab\" id=\"t-cards\" type=\"button\">Word cards<\/button>\n      <button class=\"tab\" role=\"tab\" id=\"t-which\" type=\"button\">Which one?<\/button>\n      <button class=\"tab\" role=\"tab\" id=\"t-say\" type=\"button\">Say the word<\/button>\n    <\/div>\n    <div class=\"row pset\" id=\"psetrow\" style=\"align-items:center\"><label class=\"sub\" for=\"pset\">Practice<\/label><select id=\"pset\"><\/select><\/div>\n    <div class=\"pane\" id=\"p-cards\" role=\"tabpanel\">\n      <div class=\"row\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"allcards\" type=\"button\">Show all definitions<\/button><span class=\"sub\">Or tap one card at a time.<\/span><\/div>\n      <div class=\"pane\" id=\"groups\"><\/div>\n    <\/div>\n    <div class=\"panel\" id=\"p-which\" role=\"tabpanel\" hidden>\n      <p class=\"label\" id=\"wc\"><\/p>\n      <p class=\"q\" id=\"wq\"><\/p>\n      <div class=\"opts\" id=\"wo\"><\/div>\n      <p class=\"why\" id=\"wwhy\" hidden><\/p>\n      <div class=\"row\"><button class=\"btn\" id=\"wnext\" type=\"button\" hidden>Next<\/button><\/div>\n    <\/div>\n    <div class=\"panel\" id=\"p-say\" role=\"tabpanel\" hidden>\n      <p class=\"label\" id=\"sc\"><\/p>\n      <p class=\"q\" id=\"sq\"><\/p>\n      <p class=\"sub\" id=\"shint\">Say the word out loud, then check.<\/p>\n      <div class=\"row\"><button class=\"btn\" id=\"sshow\" type=\"button\">Show answer<\/button><\/div>\n      <div id=\"sans\" hidden style=\"display:flex;flex-direction:column;gap:12px\">\n        <p class=\"answer\" id=\"sterm\"><\/p>\n        <p class=\"hook\" id=\"shook\" style=\"margin:0\"><\/p>\n        <div class=\"row\"><button class=\"btn\" id=\"sok\" type=\"button\">I got it<\/button><button class=\"btn ghost\" id=\"sno\" type=\"button\">Not yet<\/button><\/div>\n      <\/div>\n      <div id=\"send\" hidden style=\"display:flex;flex-direction:column;gap:12px\"><\/div>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\nconst CARDS=[\n[\"Body scan\",\"Relaxation technique that involves paying careful attention to the body, scanning it for signs of tension, and then releasing that tension\"],\n[\"Burnout\",\"State of emotional, physical, and mental exhaustion; occurs due to prolonged stress\"],\n[\"Cardiovascular system\",\"Body system that transports blood throughout the body; consists of the heart and blood vessels\"],\n[\"Cognition\",\"Ability to think, reason, and remember\"],\n[\"Digestive system\",\"Body system of organs that take in food, pass nutrients into the bloodstream, and then expel waste\"],\n[\"Distress\",\"Stress that causes negative feelings and harmful health effects\"],\n[\"Endocrine system\",\"Body system of glands that secrete hormones to regulate body processes\"],\n[\"Eustress\",\"Positive stress that encourages growth and motivation\"],\n[\"Fight-or-flight response\",\"Physiological reaction in which the body mobilizes its resources to fight off or escape a perceived threat; also called the stress response\"],\n[\"Immune system\",\"Body system of organs, tissues, and cells that defend against infection\"],\n[\"Mindfulness-based stress reduction (MBSR)\",\"Using relaxation techniques like deep breathing, visualization, focused attention, and guided movement while focusing intensely on the present\"],\n[\"Nervous system\",\"Body system of the brain, spinal cord, and nerves that carry information throughout the body\"],\n[\"Positive reappraisal\",\"Thinking about the good aspects of stressful events\"],\n[\"PTSD\",\"Stress-related disorder with flashbacks, numbness, and difficulty sleeping after an extremely stressful event\"],\n[\"Progressive muscle relaxation\",\"Relaxation technique of tensing and then relaxing each part of the body until the whole body feels relaxed\"],\n[\"Relaxation response\",\"Physiological reaction in which the body returns to its resting state after a stressful event\"],\n[\"Reproductive system\",\"Body system of organs that work together to create new human life; differs between males and females\"],\n[\"Stress\",\"The body's physical and psychological reactions to situations people perceive as threats\"],\n[\"Stress hormones\",\"Chemicals that coordinate the fight-or-flight response; include epinephrine, norepinephrine, and cortisol\"],\n[\"Stress management\",\"Using strategies to reduce the impact of the stress response and handle threatening situations in positive ways\"],\n[\"Stress-related disorders\",\"Mental illnesses that develop from stressful events, such as acute stress disorder and PTSD\"],\n[\"Stressors\",\"Factors that lead to stress\"],\n[\"Technostress\",\"Stress caused by the constant presence of technology\"],\n[\"Time management\",\"Devoting the right amount of time to each task, committing only to what you have time for, and prioritizing\"],\n[\"Toxic stress\",\"Stress from repeated, long-lasting exposure to severe stressors such as neglect, abuse, violence, or loss of a loved one\"],\n[\"Trauma\",\"Extreme stress due to deeply disturbing events such as disasters, sexual assault, or violence\"],\n[\"Visualization\",\"Relaxation technique that involves imagining yourself in a pleasant environment\"]\n];\nconst $=id=>document.getElementById(id);\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nlet pool,rounds,r,missed,selTerm,selDef,left,total,matched=new Set();\n\nfunction start(indices){\n  pool=shuffle(indices); total=pool.length; missed=new Set();\n  rounds=[]; for(let k=0;k<total;k+=10) rounds.push(pool.slice(k,k+10));\n  r=0; $('results').hidden=true; $('game').hidden=false; render();\n}\nfunction render(keep){\n  const ids=rounds[r]; selTerm=selDef=null; if(!keep)matched=new Set(); left=ids.length-matched.size; $('next').hidden=left!==0||r>=rounds.length-1;\n  $('shufallrow').hidden=r!==0;\n  $('count').textContent=`Page ${r+1} of ${rounds.length}`;\n  $('bar').style.width=(rounds.slice(0,r).flat().length/total*100)+'%';\n  $('terms').innerHTML=''; $('defs').innerHTML='';\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='term'+(matched.has(i)?' done':'');b.textContent=CARDS[i][0];b.dataset.i=i;b.onclick=()=>pick('t',b);$('terms').append(b)});\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='def'+(matched.has(i)?' done':'');b.dataset.i=i;b.innerHTML=`<span class=\"d\"><\/span>`;b.querySelector('.d').textContent=CARDS[i][1];\n    if(matched.has(i)){const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+CARDS[i][0];b.prepend(a)}\n    b.onclick=()=>pick('d',b);$('defs').append(b)});\n}\nfunction pick(kind,el){\n  if(el.classList.contains('done'))return;\n  if(kind==='t'){ if(selTerm)selTerm.classList.remove('sel'); selTerm=selTerm===el?null:el; }\n  else { if(selDef)selDef.classList.remove('sel'); selDef=selDef===el?null:el; }\n  if(el===selTerm||el===selDef) el.classList.add('sel');\n  if(selTerm&&selDef) check();\n}\nfunction check(){\n  const t=selTerm,d=selDef; t.classList.remove('sel'); d.classList.remove('sel'); selTerm=selDef=null;\n  if(t.dataset.i===d.dataset.i){\n    matched.add(+t.dataset.i); t.classList.add('done'); d.classList.add('done');\n    const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+t.textContent;d.prepend(a);\n    if(--left===0){\n      $('bar').style.width=(rounds.slice(0,r+1).flat().length/total*100)+'%';\n      if(r<rounds.length-1){$('next').hidden=false;$('next').focus();} else finish();\n    }\n  } else {\n    missed.add(+t.dataset.i); missed.add(+d.dataset.i);\n    [t,d].forEach(e=>{e.classList.add('wrong');setTimeout(()=>e.classList.remove('wrong'),450)});\n  }\n}\nfunction finish(){\n  $('game').hidden=true; const res=$('results'); res.hidden=false;\n  const right=total-missed.size; const pct=Math.round(right/total*100);\n  $('count').textContent='Finished';\n  let html=`<p class=\"label\">First-try score<\/p><div class=\"big\">${right}/${total} <span style=\"font-size:20px;color:var(--muted)\">${pct}%<\/span><\/div>`;\n  if(missed.size){\n    html+=`<p class=\"label\">Review these<\/p><ul class=\"missed\">`+[...missed].map(i=>`<li><b>${CARDS[i][0]}<\/b>: ${CARDS[i][1]}<\/li>`).join('')+`<\/ul>`;\n    html+=`<div class=\"row\"><button class=\"btn\" id=\"retry\">Practice missed (${missed.size})<\/button><button class=\"btn ghost\" id=\"again\">Start over<\/button><\/div>`;\n  } else html+=`<p style=\"margin:0\">Perfect score. You know this chapter.<\/p><div class=\"row\"><button class=\"btn\" id=\"again\">Start over<\/button><\/div>`;\n  res.innerHTML=html;\n  const m=[...missed]; if($('retry'))$('retry').onclick=()=>start(m);\n  $('again').onclick=()=>start(CARDS.map((_,i)=>i));\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n$('next').onclick=()=>{r++;render();window.scrollTo({top:0,behavior:'smooth'})};\n$('shufpage').onclick=()=>{render();$('terms').scrollIntoView({behavior:'smooth',block:'start'})};\n$('shufall').onclick=()=>{start(pool.slice());const n=$('shufallnote');n.textContent='Shuffled. All words have new pages.';setTimeout(()=>n.textContent='Mixes all words across every page and starts over.',2500)};\nstart(CARDS.map((_,i)=>i));\n\n// ---- Study guide ----\nconst MATCH_TITLE=\"Stress Match\",GUIDE_TITLE=\"Stress Study Guide\";\nconst HOOK={\n\"Stress\": \"Your body's AND mind's whole reaction to something you see as a threat.\",\n\"Stressors\": \"-ors are the doers: stressors are the things that CAUSE stress.\",\n\"Eustress\": \"Eu = good, like euphoria. Good stress that pushes you, like nerves before a big game.\",\n\"Distress\": \"Dis = bad. Stress that makes you feel worse and hurts your health.\",\n\"Technostress\": \"Techno = technology. Stress from always being connected: pings, texts, screens.\",\n\"Toxic stress\": \"Toxic = poison. Severe stress that keeps happening for a long time, like abuse or neglect.\",\n\"Trauma\": \"Extreme stress from a deeply disturbing event, like a disaster or violence.\",\n\"Fight-or-flight response\": \"Your body gets ready to FIGHT the threat or run away (FLEE) from it.\",\n\"Stress hormones\": \"The chemical messengers of fight-or-flight: epinephrine (adrenaline), norepinephrine, and cortisol.\",\n\"Relaxation response\": \"After the threat passes, your body relaxes back to its resting state.\",\n\"Cognition\": \"Cog = thinking, like \\\"cognitive.\\\" Your ability to think, reason, and remember.\",\n\"Nervous system\": \"Nerves: the brain, spinal cord, and nerves carry messages around the body.\",\n\"Endocrine system\": \"Endo = inside. Glands release hormones inside your body to control body processes.\",\n\"Cardiovascular system\": \"Cardio = heart, vascular = blood vessels. Moves blood through your body.\",\n\"Immune system\": \"Immune = protected. Organs, tissues, and cells that fight infection.\",\n\"Digestive system\": \"Digest food: take it in, absorb nutrients, get rid of waste.\",\n\"Reproductive system\": \"Reproduce = make new life.\",\n\"Burnout\": \"Like a candle burned all the way down: worn out in body, mind, and emotions after stress lasts too long.\",\n\"Stress-related disorders\": \"Mental illnesses that develop FROM stressful events, like acute stress disorder and PTSD.\",\n\"PTSD\": \"Post-Traumatic Stress Disorder. Post = after: flashbacks, numbness, and trouble sleeping AFTER a trauma.\",\n\"Stress management\": \"Managing = handling. Strategies to handle stress in positive ways.\",\n\"Time management\": \"Manage your time: the right time for each task, don't overcommit, do what matters most first.\",\n\"Positive reappraisal\": \"Re-appraise = look at it again. Look again and find the good side of a stressful event.\",\n\"Body scan\": \"Scan from head to toe for tension, then release it.\",\n\"Progressive muscle relaxation\": \"Progress through your body: tense each muscle group, then relax it.\",\n\"Visualization\": \"Visual = seeing. Picture yourself somewhere pleasant.\",\n\"Mindfulness-based stress reduction (MBSR)\": \"Mindful = focused on right now. Relaxation techniques plus paying full attention to the present.\"\n};\nconst GROUPS=[{\"n\": \"Kinds of stress\", \"tip\": \"Eustress = good stress (eu = good, like euphoria). Distress = bad stress. Toxic stress lasts a long time; trauma comes from one deeply disturbing event.\", \"w\": [\"Stress\", \"Stressors\", \"Eustress\", \"Distress\", \"Technostress\", \"Toxic stress\", \"Trauma\"]}, {\"n\": \"The body's stress reaction\", \"tip\": \"Fight-or-flight = gearing UP. Relaxation response = calming back DOWN.\", \"w\": [\"Fight-or-flight response\", \"Stress hormones\", \"Relaxation response\", \"Cognition\"]}, {\"n\": \"Body systems stress affects\", \"tip\": \"Nerves = nervous \u00b7 glands and hormones = endocrine \u00b7 heart and blood = cardiovascular \u00b7 fighting germs = immune \u00b7 food = digestive \u00b7 new life = reproductive\", \"w\": [\"Nervous system\", \"Endocrine system\", \"Cardiovascular system\", \"Immune system\", \"Digestive system\", \"Reproductive system\"]}, {\"n\": \"When stress causes harm\", \"w\": [\"Burnout\", \"Stress-related disorders\", \"PTSD\"]}, {\"n\": \"Managing stress\", \"tip\": \"Body scan = look for tension, then let it go. Progressive muscle relaxation = tense first, then relax. Visualization = picture a pleasant place.\", \"w\": [\"Stress management\", \"Time management\", \"Positive reappraisal\", \"Body scan\", \"Progressive muscle relaxation\", \"Visualization\", \"Mindfulness-based stress reduction (MBSR)\"]}];\nconst WHICH=[\n[\"Your heart races and your mind worries when you see a situation as a threat\", \"Stress\", [\"Eustress\", \"Distress\", \"Stress\", \"Stressors\"]],\n[\"A big test, a fight with a friend, and a packed schedule\", \"Stressors\", [\"Eustress\", \"Distress\", \"Stress\", \"Stressors\"]],\n[\"Feeling excited and pumped before a championship game, which helps you play your best\", \"Eustress\", [\"Eustress\", \"Distress\", \"Stress\", \"Stressors\"]],\n[\"Worrying so much about a family problem that you get headaches and can't sleep\", \"Distress\", [\"Eustress\", \"Distress\", \"Stress\", \"Stressors\"]],\n[\"Feeling on edge because your phone buzzes with notifications all day long\", \"Technostress\", [\"Toxic stress\", \"Trauma\", \"Technostress\", \"Burnout\"]],\n[\"A child who lives with neglect and violence at home for years\", \"Toxic stress\", [\"Toxic stress\", \"Trauma\", \"Technostress\", \"Burnout\"]],\n[\"Surviving a house fire, an event so disturbing it causes extreme stress\", \"Trauma\", [\"Toxic stress\", \"Trauma\", \"Technostress\", \"Burnout\"]],\n[\"After months of nonstop practices, homework, and a part-time job, a student feels completely exhausted\", \"Burnout\", [\"Burnout\", \"Stress-related disorders\", \"PTSD\", \"Trauma\"]],\n[\"When a dog suddenly growls at you, your heart pounds and your muscles tense, ready to act\", \"Fight-or-flight response\", [\"Fight-or-flight response\", \"Relaxation response\", \"Stress hormones\", \"Cognition\"]],\n[\"Epinephrine and cortisol rush through your body during a scare\", \"Stress hormones\", [\"Fight-or-flight response\", \"Relaxation response\", \"Stress hormones\", \"Cognition\"]],\n[\"After the scare is over, your heartbeat and breathing slowly return to normal\", \"Relaxation response\", [\"Fight-or-flight response\", \"Relaxation response\", \"Stress hormones\", \"Cognition\"]],\n[\"Your ability to think, reason, and remember answers during a test\", \"Cognition\", [\"Fight-or-flight response\", \"Relaxation response\", \"Stress hormones\", \"Cognition\"]],\n[\"Your brain, spinal cord, and nerves sending messages through your body\", \"Nervous system\", [\"Nervous system\", \"Endocrine system\", \"Cardiovascular system\", \"Immune system\", \"Digestive system\", \"Reproductive system\"]],\n[\"Glands releasing hormones that control body processes\", \"Endocrine system\", [\"Nervous system\", \"Endocrine system\", \"Cardiovascular system\", \"Immune system\", \"Digestive system\", \"Reproductive system\"]],\n[\"Your heart and blood vessels moving blood around your body\", \"Cardiovascular system\", [\"Nervous system\", \"Endocrine system\", \"Cardiovascular system\", \"Immune system\", \"Digestive system\", \"Reproductive system\"]],\n[\"Cells and tissues that fight off a cold virus\", \"Immune system\", [\"Nervous system\", \"Endocrine system\", \"Cardiovascular system\", \"Immune system\", \"Digestive system\", \"Reproductive system\"]],\n[\"Organs that break down your lunch, absorb nutrients, and get rid of waste\", \"Digestive system\", [\"Nervous system\", \"Endocrine system\", \"Cardiovascular system\", \"Immune system\", \"Digestive system\", \"Reproductive system\"]],\n[\"Organs that work together to create new human life\", \"Reproductive system\", [\"Nervous system\", \"Endocrine system\", \"Cardiovascular system\", \"Immune system\", \"Digestive system\", \"Reproductive system\"]],\n[\"Mental illnesses, like acute stress disorder, that develop after stressful events\", \"Stress-related disorders\", [\"Burnout\", \"Stress-related disorders\", \"PTSD\", \"Trauma\"]],\n[\"Months after a car crash, someone has flashbacks, feels numb, and can't sleep\", \"PTSD\", [\"Burnout\", \"Stress-related disorders\", \"PTSD\", \"Trauma\"]],\n[\"Using healthy strategies to handle threatening situations in positive ways\", \"Stress management\", [\"Body scan\", \"Progressive muscle relaxation\", \"Visualization\", \"Mindfulness-based stress reduction (MBSR)\", \"Positive reappraisal\", \"Time management\", \"Stress management\"]],\n[\"Planning your week, saying no to a club you don't have time for, and doing the most important homework first\", \"Time management\", [\"Body scan\", \"Progressive muscle relaxation\", \"Visualization\", \"Mindfulness-based stress reduction (MBSR)\", \"Positive reappraisal\", \"Time management\", \"Stress management\"]],\n[\"After getting cut from the team, you focus on how you'll have more time to practice and try again next year\", \"Positive reappraisal\", [\"Body scan\", \"Progressive muscle relaxation\", \"Visualization\", \"Mindfulness-based stress reduction (MBSR)\", \"Positive reappraisal\", \"Time management\", \"Stress management\"]],\n[\"Paying close attention to each part of your body, noticing where it feels tight, then letting the tightness go\", \"Body scan\", [\"Body scan\", \"Progressive muscle relaxation\", \"Visualization\", \"Mindfulness-based stress reduction (MBSR)\", \"Positive reappraisal\", \"Time management\", \"Stress management\"]],\n[\"Squeezing your fists tight for five seconds, letting go, then doing the same with your shoulders\", \"Progressive muscle relaxation\", [\"Body scan\", \"Progressive muscle relaxation\", \"Visualization\", \"Mindfulness-based stress reduction (MBSR)\", \"Positive reappraisal\", \"Time management\", \"Stress management\"]],\n[\"Closing your eyes and imagining you're lying on a warm, quiet beach\", \"Visualization\", [\"Body scan\", \"Progressive muscle relaxation\", \"Visualization\", \"Mindfulness-based stress reduction (MBSR)\", \"Positive reappraisal\", \"Time management\", \"Stress management\"]],\n[\"Combining deep breathing and gentle movement while focusing completely on the present moment\", \"Mindfulness-based stress reduction (MBSR)\", [\"Body scan\", \"Progressive muscle relaxation\", \"Visualization\", \"Mindfulness-based stress reduction (MBSR)\", \"Positive reappraisal\", \"Time management\", \"Stress management\"]]\n];\nconst DEF=Object.fromEntries(CARDS);\nconst setHook=(el,w)=>{el.innerHTML='<b>Hook:<\/b> ';el.append(HOOK[w])};\n\nlet guide=false;\n$('mode').onclick=()=>{\n  guide=!guide;\n  $('match').hidden=guide; $('how').hidden=guide; $('guide').hidden=!guide;\n  $('title').textContent=guide?GUIDE_TITLE:MATCH_TITLE;\n  $('mode').textContent=guide?'Match quiz':'Study Guide';\n  window.scrollTo({top:0});\n};\n\nfunction tab(name){\n  ['cards','which','say'].forEach(x=>{$('t-'+x).setAttribute('aria-selected',x===name);$('p-'+x).hidden=x!==name});\n  $('psetrow').hidden=name==='cards';\n}\n['cards','which','say'].forEach(x=>$('t-'+x).onclick=()=>tab(x));\ntab('cards');\n\nGROUPS.forEach(g=>{\n  const s=document.createElement('section');s.className='group';\n  const h=document.createElement('h2');h.textContent=g.n;s.append(h);\n  if(g.tip){const p=document.createElement('p');p.className='tip';p.textContent=g.tip;s.append(p)}\n  const c=document.createElement('div');c.className='cards';s.append(c);\n  g.w.forEach(w=>{\n    const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-expanded','false');\n    b.innerHTML='<b><\/b><span class=\"hint\">Tap to see the definition<\/span><span class=\"back\"><span class=\"d\"><\/span><span class=\"hook\"><\/span><\/span>';\n    b.querySelector('b').textContent=w;b.querySelector('.d').textContent=DEF[w];setHook(b.querySelector('.hook'),w);\n    b.onclick=()=>b.setAttribute('aria-expanded',b.classList.toggle('open'));\n    c.append(b);\n  });\n  $('groups').append(s);\n});\n$('allcards').onclick=()=>{\n  const open=$('allcards').textContent.startsWith('Show');\n  document.querySelectorAll('.card').forEach(b=>{b.classList.toggle('open',open);b.setAttribute('aria-expanded',open)});\n  $('allcards').textContent=open?'Hide all definitions':'Show all definitions';\n};\n\n// Practice set: all words or one group, shared by Which one? and Say the word\nconst SETS=[{n:`All ${CARDS.length} words`,w:CARDS.map(c=>c[0])},...GROUPS.map(g=>({n:`${g.n} (${g.w.length})`,w:g.w}))];\nSETS.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.n;$('pset').append(o)});\nlet cur=SETS[0].w;\n$('pset').onchange=()=>{cur=SETS[$('pset').value].w;whichStart();sayStart()};\n\nconst WHICH_ROUND=15;\nlet wq,wi,wright,wanswered;\nfunction whichStart(){wq=shuffle(WHICH.filter(x=>cur.includes(x[1]))).slice(0,WHICH_ROUND);wi=0;wright=0;whichShow()}\nfunction whichShow(){\n  wanswered=false; $('wwhy').hidden=true; $('wnext').hidden=true; $('wo').innerHTML='';\n  if(wi>=wq.length){\n    $('wc').textContent='Finished';\n    $('wq').textContent=`You got ${wright} of ${wq.length} on the first try.`;\n    $('wnext').textContent=WHICH.filter(x=>cur.includes(x[1])).length>WHICH_ROUND?'New questions':'Try again'; $('wnext').hidden=false; return;\n  }\n  const [q,a,opts]=wq[wi];\n  $('wc').textContent=`Question ${wi+1} of ${wq.length} \u00b7 Which word fits?`;\n  $('wq').textContent=q;\n  shuffle([a,...shuffle(opts.filter(o=>o!==a)).slice(0,3)]).forEach(o=>{\n    const b=document.createElement('button');b.type='button';b.className='def';b.textContent=o;\n    b.onclick=()=>whichPick(b,o);$('wo').append(b);\n  });\n}\nfunction whichPick(b,o){\n  if(wanswered)return; wanswered=true;\n  const a=wq[wi][1];\n  if(o===a){wright++;b.classList.add('done')}\n  else{b.classList.add('miss');[...$('wo').children].find(x=>x.textContent===a).classList.add('done')}\n  $('wwhy').innerHTML='<b><\/b> ';$('wwhy').querySelector('b').textContent=(o===a?'Right! ':'It\u2019s ')+a+'.';$('wwhy').append(HOOK[a]);$('wwhy').hidden=false;\n  $('wnext').textContent=wi<wq.length-1?'Next':'See score'; $('wnext').hidden=false; $('wnext').focus();\n}\n$('wnext').onclick=()=>{if(wi>=wq.length)whichStart();else{wi++;whichShow()}};\nwhichStart();\n\nlet sq,smissed,sknown,stotal;\nfunction sayStart(){sq=shuffle(CARDS.map((_,i)=>i).filter(i=>cur.includes(CARDS[i][0])));stotal=sq.length;smissed=new Set();sknown=0;$('send').hidden=true;sayShow()}\nfunction sayShow(){\n  $('sans').hidden=true;\n  const end=!sq.length;\n  ['sq','shint','sshow'].forEach(id=>$(id).hidden=end);\n  $('sc').textContent=end?'Finished':`${sknown} of ${stotal} known \u00b7 What's the word?`;\n  if(end){\n    const right=stotal-smissed.size;\n    let html=`<p class=\"q\">First-try score: ${right}/${stotal}<\/p>`;\n    if(smissed.size)html+=`<p class=\"label\">Keep practicing these<\/p><ul class=\"missed\">`+[...smissed].map(i=>`<li><b>${CARDS[i][0]}<\/b>: ${HOOK[CARDS[i][0]]}<\/li>`).join('')+`<\/ul>`;\n    html+=`<div class=\"row\"><button class=\"btn\" id=\"sagain\" type=\"button\">Go again<\/button><\/div>`;\n    $('send').innerHTML=html;$('send').hidden=false;$('sagain').onclick=sayStart;return;\n  }\n  $('sq').textContent=CARDS[sq[0]][1];\n}\n$('sshow').onclick=()=>{\n  const w=CARDS[sq[0]][0];$('sterm').textContent=w;setHook($('shook'),w);\n  $('sshow').hidden=true;$('shint').hidden=true;$('sans').hidden=false;$('sok').focus();\n};\n$('sok').onclick=()=>{sq.shift();sknown++;sayShow()};\n$('sno').onclick=()=>{const i=sq.shift();smissed.add(i);sq.splice(Math.min(3,sq.length),0,i);sayShow()};\nsayStart();\n<\/script>\n\n<\/body>\n<\/html>\n", "ch7": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch 7 Mental Health Match<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\">\n<style>\n:root{\n  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#18292D; --muted:#5A6D70; --line:#CFDAD7;\n  --accent:#3D4FA8; --accent-soft:#DFE3F6; --good:#2E7D4F; --good-soft:#DDF0E3;\n  --bad:#B3412E; --bad-soft:#F6DFDA;\n  --display:\"Bricolage Grotesque\", \"Segoe UI\", system-ui, sans-serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    color-scheme:dark;\n    --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n    --accent:#93A2F0; --accent-soft:#232A4D; --good:#5BC486; --good-soft:#163527;\n    --bad:#F08A76; --bad-soft:#3E211C;\n  }\n}\n:root[data-theme=\"dark\"]{\n  color-scheme:dark;\n  --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n  --accent:#93A2F0; --accent-soft:#232A4D; --good:#5BC486; --good-soft:#163527;\n  --bad:#F08A76; --bad-soft:#3E211C;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}\n.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}\nheader{display:flex;flex-direction:column;gap:6px}\n.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}\nh1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}\n.how{color:var(--muted);margin:0;max-width:60ch}\n.status{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}\n.meter{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}\n.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}\n.status span{font-size:14px;color:var(--muted);white-space:nowrap}\n.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}\n.terms{display:flex;flex-wrap:wrap;gap:8px}\n.term{font-family:var(--display);font-weight:600;font-size:16px;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}\n.term:hover{border-color:var(--accent)}\n.defs{display:flex;flex-direction:column;gap:10px}\n.def{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:background .15s,border-color .15s}\n.def:hover{border-color:var(--accent)}\n.def .ans{font-family:var(--display);font-weight:600;font-size:14px;color:var(--good)}\n.sel{background:var(--accent-soft);border-color:var(--accent)}\n.done{background:var(--good-soft);border-color:var(--good);cursor:default}\n.term.done{color:var(--good)}\n.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;animation:shake .35s}\n@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.btn{font-family:var(--display);font-weight:600;font-size:16px;padding:12px 20px;border-radius:10px;border:none;background:var(--accent);color:var(--bg);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}\n.row{display:flex;flex-wrap:wrap;gap:10px}\n.results{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}\n.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}\n.missed{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}\n.missed b{font-family:var(--display)}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n.top{display:flex;align-items:center;justify-content:space-between;gap:12px}\n.top .eyebrow{margin:0}\n.btn.sm{padding:8px 14px;font-size:15px;white-space:nowrap}\n.plan{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}\n.plan summary{font-family:var(--display);font-weight:600;cursor:pointer}\n.plan ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}\n.tabs{display:flex;flex-wrap:wrap;gap:8px}\n.tab{font-family:var(--display);font-weight:600;font-size:16px;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}\n.tab:hover{border-color:var(--accent)}\n.tab[aria-selected=\"true\"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}\n.pset select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}\n.pane{display:flex;flex-direction:column;gap:18px}\n.group{display:flex;flex-direction:column;gap:10px}\n.group h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0}\n.tip{margin:0;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:15px}\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-items:start}\n.card{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}\n.card:hover{border-color:var(--accent)}\n.card b{font-family:var(--display);font-size:17px}\n.card .hint{font-size:13px;color:var(--muted)}\n.card .back{display:none;flex-direction:column;gap:8px}\n.card.open{border-color:var(--accent)}\n.card.open .hint{display:none}\n.card.open .back{display:flex}\n.hook{color:var(--accent);font-size:14px}\n.card .hook b{font-family:inherit;font-size:inherit}\n.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}\n.q{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.3;margin:0}\n.sub{color:var(--muted);font-size:14px}\n.opts{display:flex;flex-direction:column;gap:8px}\n.opts .def{font-family:var(--display);font-weight:600}\n.opts .def.miss{background:var(--bad-soft);border-color:var(--bad)}\n.why{margin:0}\n.why b{font-family:var(--display)}\n.answer{font-family:var(--display);font-weight:800;font-size:26px;margin:0;color:var(--accent)}\n\n[hidden]{display:none!important}\nhtml{color-scheme:light}\nbody{margin:0}\n<\/style>\n<script>\naddEventListener('message',e=>{const d=e.data||{};if(d.type==='theme'){if(d.theme)document.documentElement.dataset.theme=d.theme;else delete document.documentElement.dataset.theme}});\n<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <header>\n    <div class=\"top\"><p class=\"eyebrow\">Health \u00b7 Chapter 7 \u00b7 Mental Health<\/p><button class=\"btn ghost sm\" id=\"mode\" type=\"button\">Study Guide<\/button><\/div>\n    <h1 id=\"title\">Mental Health Match<\/h1>\n    <p class=\"how\" id=\"how\">Tap a term, then tap the definition it goes with. 23 terms across 2 pages (12, then 11), shuffled fresh every time. Use <b>Shuffle page<\/b> to reorder the current page or <b>Shuffle all<\/b> on page 1 to mix words across pages. Your score counts matches you got on the first try.<\/p>\n  <\/header>\n  <div id=\"match\" style=\"display:flex;flex-direction:column;gap:18px\">\n  <div class=\"status\"><div class=\"meter\"><i id=\"bar\"><\/i><\/div><span id=\"count\">Page 1 of 2<\/span><\/div>\n  <section id=\"game\" style=\"display:flex;flex-direction:column;gap:14px\">\n    <div class=\"row\" id=\"shufallrow\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"shufall\" type=\"button\">Shuffle all<\/button><span class=\"note\" id=\"shufallnote\">Mixes all words across every page and starts over.<\/span><\/div>\n    <p class=\"label\">Terms<\/p>\n    <div class=\"terms\" id=\"terms\"><\/div>\n    <p class=\"label\">Definitions<\/p>\n    <div class=\"defs\" id=\"defs\"><\/div>\n    <div class=\"row\"><button class=\"btn ghost\" id=\"shufpage\" type=\"button\">Shuffle page<\/button><button class=\"btn\" id=\"next\" hidden>Next page<\/button><\/div>\n  <\/section>\n  <section class=\"results\" id=\"results\" hidden><\/section>\n  <\/div>\n  <section id=\"guide\" hidden style=\"display:flex;flex-direction:column;gap:16px\">\n    <p class=\"how\">Learn the 23 words in 6 groups, then practice remembering them without looking. Short sessions on 3 or 4 different days work better than one long session.<\/p>\n    <details class=\"plan\"><summary>4-day study plan<\/summary><ol>\n      <li><b>Day 1:<\/b> Go through the <b>Word cards<\/b>. Explain each word in your own words and say its hook. Then play the match quiz once.<\/li>\n      <li><b>Day 2:<\/b> <b>Say the word.<\/b> Spend your time on the ones you miss.<\/li>\n      <li><b>Day 3:<\/b> <b>Which one?<\/b> Then <b>Say the word<\/b> again.<\/li>\n      <li><b>Day before the test:<\/b> Match quiz with <b>Shuffle all<\/b>, then practice the words you missed.<\/li>\n    <\/ol><\/details>\n    <div class=\"tabs\" role=\"tablist\">\n      <button class=\"tab\" role=\"tab\" id=\"t-cards\" type=\"button\">Word cards<\/button>\n      <button class=\"tab\" role=\"tab\" id=\"t-which\" type=\"button\">Which one?<\/button>\n      <button class=\"tab\" role=\"tab\" id=\"t-say\" type=\"button\">Say the word<\/button>\n    <\/div>\n    <div class=\"row pset\" id=\"psetrow\" style=\"align-items:center\"><label class=\"sub\" for=\"pset\">Practice<\/label><select id=\"pset\"><\/select><\/div>\n    <div class=\"pane\" id=\"p-cards\" role=\"tabpanel\">\n      <div class=\"row\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"allcards\" type=\"button\">Show all definitions<\/button><span class=\"sub\">Or tap one card at a time.<\/span><\/div>\n      <div class=\"pane\" id=\"groups\"><\/div>\n    <\/div>\n    <div class=\"panel\" id=\"p-which\" role=\"tabpanel\" hidden>\n      <p class=\"label\" id=\"wc\"><\/p>\n      <p class=\"q\" id=\"wq\"><\/p>\n      <div class=\"opts\" id=\"wo\"><\/div>\n      <p class=\"why\" id=\"wwhy\" hidden><\/p>\n      <div class=\"row\"><button class=\"btn\" id=\"wnext\" type=\"button\" hidden>Next<\/button><\/div>\n    <\/div>\n    <div class=\"panel\" id=\"p-say\" role=\"tabpanel\" hidden>\n      <p class=\"label\" id=\"sc\"><\/p>\n      <p class=\"q\" id=\"sq\"><\/p>\n      <p class=\"sub\" id=\"shint\">Say the word out loud, then check.<\/p>\n      <div class=\"row\"><button class=\"btn\" id=\"sshow\" type=\"button\">Show answer<\/button><\/div>\n      <div id=\"sans\" hidden style=\"display:flex;flex-direction:column;gap:12px\">\n        <p class=\"answer\" id=\"sterm\"><\/p>\n        <p class=\"hook\" id=\"shook\" style=\"margin:0\"><\/p>\n        <div class=\"row\"><button class=\"btn\" id=\"sok\" type=\"button\">I got it<\/button><button class=\"btn ghost\" id=\"sno\" type=\"button\">Not yet<\/button><\/div>\n      <\/div>\n      <div id=\"send\" hidden style=\"display:flex;flex-direction:column;gap:12px\"><\/div>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\nconst CARDS=[\n[\"Addictive disorders\",\"Mental illnesses in which people develop a psychological dependence on certain processes or behaviors\"],\n[\"Anxiety disorders\",\"Mental illnesses in which feelings of worry and dread interfere with daily life\"],\n[\"Bipolar disorder\",\"Mood disorder characterized by extreme highs (mania) and lows (depression)\"],\n[\"Co-occurring disorders\",\"Two conditions that affect health at the same time; for example, substance use disorders and other mental illnesses\"],\n[\"Family therapy\",\"Treatment method in which family members meet together with a therapist to build positive, functional relationships and strengthen interactions\"],\n[\"Major depressive disorder\",\"Mood disorder characterized by feelings of intense sadness, worthlessness, and hopelessness; also called clinical depression\"],\n[\"Mental health medication\",\"Substances that cause changes in the brain to reduce the symptoms of a mental illness\"],\n[\"Mental illness\",\"Health condition in which negative or unhelpful feelings or thoughts become so severe they interfere with daily life\"],\n[\"Panic attacks\",\"Episodes of intense fear characterized by fast heartbeat, dizziness, shaking, trouble breathing, and chest pain\"],\n[\"Personality disorders\",\"Mental illnesses characterized by consistent patterns of inappropriate behavior\"],\n[\"Phobia\",\"Extreme, unrealistic fear of an object or situation\"],\n[\"Schizophrenia spectrum disorders\",\"Mental illnesses characterized by irregular thoughts, delusions, and hallucinations\"],\n[\"Stigma\",\"Negative, false, unfair beliefs associated with a circumstance, quality, or person\"],\n[\"Substance use disorder\",\"Mental illness in which a person continues using a substance despite negative effects on health and life\"],\n[\"Suicide\",\"Intentional act of ending one's own life\"],\n[\"Suicide clusters\",\"Series of suicides in a particular community that occur in a relatively short period of time\"],\n[\"Suicide contagion\",\"Copying of suicide attempts after exposure to another person's suicide\"],\n[\"Support group\",\"Treatment method in which people who have faced or are facing similar challenges meet to discuss obstacles and ways of overcoming them\"],\n[\"Survivors\",\"People who have lost someone to suicide\"],\n[\"Therapist\",\"Healthcare professional who diagnoses mental illnesses and delivers therapy\"],\n[\"Therapy\",\"Treatment method that changes the way a person thinks, interprets information, behaves, and experiences and expresses emotions; involves communicating with a therapist\"],\n[\"Tolerance\",\"Body's need for an increased amount of a substance to experience the effects once felt with smaller amounts\"],\n[\"Withdrawal\",\"Negative symptoms that develop when a person with a physical dependence stops using a substance\"]\n];\nconst $=id=>document.getElementById(id);\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nlet pool,rounds,r,missed,selTerm,selDef,left,total,matched=new Set();\n\nfunction start(indices){\n  pool=shuffle(indices); total=pool.length; missed=new Set();\n  rounds=[]; for(let k=0;k<total;k+=12) rounds.push(pool.slice(k,k+12));\n  r=0; $('results').hidden=true; $('game').hidden=false; render();\n}\nfunction render(keep){\n  const ids=rounds[r]; selTerm=selDef=null; if(!keep)matched=new Set(); left=ids.length-matched.size; $('next').hidden=left!==0||r>=rounds.length-1;\n  $('shufallrow').hidden=r!==0;\n  $('count').textContent=`Page ${r+1} of ${rounds.length}`;\n  $('bar').style.width=(rounds.slice(0,r).flat().length/total*100)+'%';\n  $('terms').innerHTML=''; $('defs').innerHTML='';\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='term'+(matched.has(i)?' done':'');b.textContent=CARDS[i][0];b.dataset.i=i;b.onclick=()=>pick('t',b);$('terms').append(b)});\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='def'+(matched.has(i)?' done':'');b.dataset.i=i;b.innerHTML=`<span class=\"d\"><\/span>`;b.querySelector('.d').textContent=CARDS[i][1];\n    if(matched.has(i)){const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+CARDS[i][0];b.prepend(a)}\n    b.onclick=()=>pick('d',b);$('defs').append(b)});\n}\nfunction pick(kind,el){\n  if(el.classList.contains('done'))return;\n  if(kind==='t'){ if(selTerm)selTerm.classList.remove('sel'); selTerm=selTerm===el?null:el; }\n  else { if(selDef)selDef.classList.remove('sel'); selDef=selDef===el?null:el; }\n  if(el===selTerm||el===selDef) el.classList.add('sel');\n  if(selTerm&&selDef) check();\n}\nfunction check(){\n  const t=selTerm,d=selDef; t.classList.remove('sel'); d.classList.remove('sel'); selTerm=selDef=null;\n  if(t.dataset.i===d.dataset.i){\n    matched.add(+t.dataset.i); t.classList.add('done'); d.classList.add('done');\n    const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+t.textContent;d.prepend(a);\n    if(--left===0){\n      $('bar').style.width=(rounds.slice(0,r+1).flat().length/total*100)+'%';\n      if(r<rounds.length-1){$('next').hidden=false;$('next').focus();} else finish();\n    }\n  } else {\n    missed.add(+t.dataset.i); missed.add(+d.dataset.i);\n    [t,d].forEach(e=>{e.classList.add('wrong');setTimeout(()=>e.classList.remove('wrong'),450)});\n  }\n}\nfunction finish(){\n  $('game').hidden=true; const res=$('results'); res.hidden=false;\n  const right=total-missed.size; const pct=Math.round(right/total*100);\n  $('count').textContent='Finished';\n  let html=`<p class=\"label\">First-try score<\/p><div class=\"big\">${right}/${total} <span style=\"font-size:20px;color:var(--muted)\">${pct}%<\/span><\/div>`;\n  if(missed.size){\n    html+=`<p class=\"label\">Review these<\/p><ul class=\"missed\">`+[...missed].map(i=>`<li><b>${CARDS[i][0]}<\/b>: ${CARDS[i][1]}<\/li>`).join('')+`<\/ul>`;\n    html+=`<div class=\"row\"><button class=\"btn\" id=\"retry\">Practice missed (${missed.size})<\/button><button class=\"btn ghost\" id=\"again\">Start over<\/button><\/div>`;\n  } else html+=`<p style=\"margin:0\">Perfect score. You know this chapter.<\/p><div class=\"row\"><button class=\"btn\" id=\"again\">Start over<\/button><\/div>`;\n  res.innerHTML=html;\n  const m=[...missed]; if($('retry'))$('retry').onclick=()=>start(m);\n  $('again').onclick=()=>start(CARDS.map((_,i)=>i));\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n$('next').onclick=()=>{r++;render();window.scrollTo({top:0,behavior:'smooth'})};\n$('shufpage').onclick=()=>{render();$('terms').scrollIntoView({behavior:'smooth',block:'start'})};\n$('shufall').onclick=()=>{start(pool.slice());const n=$('shufallnote');n.textContent='Shuffled. All words have new pages.';setTimeout(()=>n.textContent='Mixes all words across every page and starts over.',2500)};\nstart(CARDS.map((_,i)=>i));\n\n// ---- Study guide ----\nconst MATCH_TITLE=\"Mental Health Match\",GUIDE_TITLE=\"Mental Health Study Guide\";\nconst HOOK={\n\"Mental illness\": \"Thoughts or feelings get so severe they get in the way of daily life.\",\n\"Stigma\": \"An unfair label: negative, false beliefs about a person or condition.\",\n\"Co-occurring disorders\": \"Co = together, occur = happen. Two conditions happening at the same time.\",\n\"Anxiety disorders\": \"Anxiety = worry. Worry and dread so strong they interfere with daily life.\",\n\"Panic attacks\": \"A sudden ATTACK of intense fear: racing heart, dizziness, shaking, chest pain.\",\n\"Phobia\": \"Extreme, unrealistic fear of ONE thing, like spiders or heights.\",\n\"Major depressive disorder\": \"Major = big, depressed = low. Intense sadness, worthlessness, and hopelessness.\",\n\"Bipolar disorder\": \"Bi = two, polar = opposite ends. Swings between extreme highs and extreme lows.\",\n\"Schizophrenia spectrum disorders\": \"Thoughts break from reality: delusions and hallucinations.\",\n\"Personality disorders\": \"A person's lasting pattern of behavior is consistently inappropriate.\",\n\"Substance use disorder\": \"Keeps using a SUBSTANCE even though it's hurting their health and life.\",\n\"Addictive disorders\": \"Dependent on a BEHAVIOR or process, like gambling, not a substance.\",\n\"Tolerance\": \"The body gets used to it, so it needs MORE to feel the same effect.\",\n\"Withdrawal\": \"Withdraw = take away. Bad symptoms when the substance is taken away.\",\n\"Therapist\": \"The -ist is the person: a professional who diagnoses mental illness and gives therapy.\",\n\"Therapy\": \"The treatment itself: working with a therapist to change how you think, act, and feel.\",\n\"Family therapy\": \"The whole family meets with a therapist together.\",\n\"Support group\": \"People facing the same challenge meet to support each other.\",\n\"Mental health medication\": \"Medicine that changes the brain to reduce the symptoms of a mental illness.\",\n\"Suicide\": \"The intentional act of ending one's own life.\",\n\"Suicide clusters\": \"A cluster is a group close together: several suicides in one community in a short time.\",\n\"Suicide contagion\": \"Contagion = spreading, like a contagious cold. Copying suicide attempts after exposure to someone's suicide.\",\n\"Survivors\": \"The people left behind: those who have lost someone to suicide.\"\n};\nconst GROUPS=[{\"n\": \"Mental illness basics\", \"w\": [\"Mental illness\", \"Stigma\", \"Co-occurring disorders\"]}, {\"n\": \"Anxiety and fear\", \"tip\": \"Anxiety disorders = ongoing worry. Panic attack = a sudden burst of intense fear. Phobia = extreme fear of one specific thing.\", \"w\": [\"Anxiety disorders\", \"Panic attacks\", \"Phobia\"]}, {\"n\": \"Other mental illnesses\", \"tip\": \"Major depressive disorder = only lows. Bipolar = swings between highs AND lows.\", \"w\": [\"Major depressive disorder\", \"Bipolar disorder\", \"Schizophrenia spectrum disorders\", \"Personality disorders\"]}, {\"n\": \"Substances and addiction\", \"tip\": \"Substance use disorder = a substance, like alcohol or drugs. Addictive disorders = a behavior, like gambling. Tolerance = need MORE. Withdrawal = feel sick when you STOP.\", \"w\": [\"Substance use disorder\", \"Addictive disorders\", \"Tolerance\", \"Withdrawal\"]}, {\"n\": \"Treatment\", \"tip\": \"Therapist = the person. Therapy = the treatment.\", \"w\": [\"Therapist\", \"Therapy\", \"Family therapy\", \"Support group\", \"Mental health medication\"]}, {\"n\": \"Suicide\", \"tip\": \"Cluster = several suicides close together in one community. Contagion = copying after exposure. If you or a friend is struggling, call or text 988 any time.\", \"w\": [\"Suicide\", \"Suicide clusters\", \"Suicide contagion\", \"Survivors\"]}];\nconst WHICH=[\n[\"Negative thoughts become so severe that someone can't go to school or see friends\", \"Mental illness\", [\"Mental illness\", \"Stigma\", \"Co-occurring disorders\"]],\n[\"Believing people with a mental illness are \\\"just weak\\\" and avoiding them\", \"Stigma\", [\"Mental illness\", \"Stigma\", \"Co-occurring disorders\"]],\n[\"Someone has a substance use disorder and depression at the same time\", \"Co-occurring disorders\", [\"Mental illness\", \"Stigma\", \"Co-occurring disorders\"]],\n[\"Constant worry and dread about everyday things make it hard to get through the school day\", \"Anxiety disorders\", [\"Anxiety disorders\", \"Panic attacks\", \"Phobia\"]],\n[\"Suddenly someone's heart races, they feel dizzy and shaky, and their chest hurts from intense fear\", \"Panic attacks\", [\"Anxiety disorders\", \"Panic attacks\", \"Phobia\"]],\n[\"Someone is so afraid of elevators that they clim ).hidden=true; $('wnext').hidden=true; $('wo').innerHTML='';\n  if(wi>=wq.length){\n    $('wc').textContent='Finished';\n    $('wq').textContent=`You got ${wright} of ${wq.length} on the first try.`;\n    $('wnext').textContent=WHICH.filter(x=>cur.includes(x[1])).length>WHICH_ROUND?'New questions':'Try again'; $('wnext').hidden=false; return;\n  }\n  const [q,a,opts]=wq[wi];\n  $('wc').textContent=`Question ${wi+1} of ${wq.length} \u00b7 Which word fits?`;\n  $('wq').textContent=q;\n  shuffle([a,...shuffle(opts.filter(o=>o!==a)).slice(0,3)]).forEach(o=>{\n    const b=document.createElement('button');b.type='button';b.className='def';b.textContent=o;\n    b.onclick=()=>whichPick(b,o);$('wo').append(b);\n  });\n}\nfunction whichPick(b,o){\n  if(wanswered)return; wanswered=true;\n  const a=wq[wi][1];\n  if(o===a){wright++;b.classList.add('done')}\n  else{b.classList.add('miss');[...$('wo').children].find(x=>x.textContent===a).classList.add('done')}\n  $('wwhy').innerHTML='<b><\/b> ';$('wwhy').querySelector('b').textContent=(o===a?'Right! ':'It\u2019s ')+a+'.';$('wwhy').append(HOOK[a]);$('wwhy').hidden=false;\n  $('wnext').textContent=wi<wq.length-1?'Next':'See score'; $('wnext').hidden=false; $('wnext').focus();\n}\n$('wnext').onclick=()=>{if(wi>=wq.length)whichStart();else{wi++;whichShow()}};\nwhichStart();\n\nlet sq,smissed,sknown,stotal;\nfunction sayStart(){sq=shuffle(CARDS.map((_,i)=>i).filter(i=>cur.includes(CARDS[i][0])));stotal=sq.length;smissed=new Set();sknown=0;$('send').hidden=true;sayShow()}\nfunction sayShow(){\n  $('sans').hidden=true;\n  const end=!sq.length;\n  ['sq','shint','sshow'].forEach(id=>$(id).hidden=end);\n  $('sc').textContent=end?'Finished':`${sknown} of ${stotal} known \u00b7 What's the word?`;\n  if(end){\n    const right=stotal-smissed.size;\n    let html=`<p class=\"q\">First-try score: ${right}/${stotal}<\/p>`;\n    if(smissed.size)html+=`<p class=\"label\">Keep practicing these<\/p><ul class=\"missed\">`+[...smissed].map(i=>`<li><b>${C
