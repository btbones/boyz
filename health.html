c:tabular-nums;flex:none}\n.qt{margin:0;font-weight:700}\n.pg{font-size:13px;color:var(--muted);font-weight:400;white-space:nowrap}\n.opts{display:flex;flex-direction:column;gap:8px}\n.opts.row2{flex-direction:row;flex-wrap:wrap}\n.opt{font:inherit;text-align:left;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}\n.opts.row2 .opt{flex:1;min-width:120px;justify-content:center;font-family:var(--display);font-weight:600}\n.opt .box{flex:none;width:18px;height:18px;margin-top:2px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;line-height:1}\n.opt.sel .box{background:var(--accent);border-color:var(--accent);color:var(--surface)}\n.opt:disabled{cursor:default}\n.opt.right{background:var(--good-soft);border-color:var(--good)}\n.opt.miss{background:var(--surface);border-color:var(--good);border-style:dashed}\n.opt.no{background:var(--bad-soft);border-color:var(--bad)}\n.fb{margin:0;padding:10px 12px;border-radius:10px;font-size:15px}\n.fb.ok{background:var(--good-soft)}\n.fb.bad{background:var(--bad-soft)}\n.fb b{font-family:var(--display)}\n.note{font-size:14px;color:var(--muted);margin:0}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.btn{font-family:var(--display);font-weight:600;font-size:16px;padding:11px 18px;border-radius:10px;border:none;background:var(--accent);color:var(--surface);cursor:pointer;align-self:flex-start}\n.btn:disabled{opacity:.45;cursor:default}\n.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}\n.row{display:flex;flex-wrap:wrap;gap:10px}\n.big{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}\n.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.tally div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}\n.tally b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}\n.missed{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}\n.missed b{font-family:var(--display)}\n.q:focus{outline:none}\n.key h3{font-family:var(--display);font-weight:800;font-size:18px;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}\n.key p{margin:0}\n.key ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}\n.tag{font-family:var(--body);font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 8px}\n.typed{display:flex;flex-wrap:wrap;gap:8px}\n.typed input,.q textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}\n.typed input{flex:1;min-width:160px}\n.typed .btn{align-self:stretch}\n.q textarea{width:100%;resize:vertical}\n.typed input:disabled,.q textarea:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);background:var(--surface)}\ninput:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.tblwrap{overflow-x:auto}\n.tbl{border-collapse:collapse;width:100%;background:var(--surface);font-size:15px}\n.tbl th,.tbl td{border:1.5px solid var(--line);padding:10px;text-align:center;font-variant-numeric:tabular-nums}\n.tbl thead th{background:var(--accent-soft);font-family:var(--display);font-weight:600}\n.tbl thead th:first-child,.tbl tbody th{text-align:left}\n@media (max-width:560px){.tbl{font-size:13px}.tbl th,.tbl td{padding:6px}}\n.model{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:10px;padding:12px}\n.model p{margin:0}\n.model ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}\n.labels{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}\n.nf{margin:0;flex:1 1 250px;max-width:340px;display:flex;flex-direction:column;gap:6px}\n.nf figcaption{font-family:var(--display);font-weight:800;font-size:18px}\n.nfb{background:#fff;color:#000;border:2px solid #000;padding:8px 10px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.25}\n.nfb p{margin:0}\n.nft{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.5px;white-space:nowrap;border-bottom:1px solid #000;padding-bottom:2px;margin-bottom:2px!important}\n.nfs{display:flex;justify-content:space-between;gap:8px;font-weight:700}\n.nfbar{background:#000;height:8px;margin:4px 0}\n.nfa{font-size:12px;font-weight:700}\n.nfc{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:22px}\n.nfc b:last-child{font-size:30px}\n.nfd{text-align:right;font-size:12px;font-weight:700;border-top:3px solid #000;padding-top:2px}\n.nr{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #000;padding:2px 0}\n.nr.i1{padding-left:14px}\n.nr.i2{padding-left:28px}\n.nfn{font-size:11px;border-top:3px solid #000;padding-top:4px;margin-top:2px!important}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n[hidden]{display:none!important}\nhtml{color-scheme:light}\nbody{margin:0}\n<\/style>\n<script>\naddEventListener('message',e=>{const d=e.data||{};if(d.type==='theme'){if(d.theme)document.documentElement.dataset.theme=d.theme;else delete document.documentElement.dataset.theme}});\n<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <header>\n    <p class=\"eyebrow\">Health \u00b7 Chapter 8 \u00b7 Review<\/p>\n    <h1>Nutrition Chapter Review<\/h1>\n    <p class=\"how\">Read the key ideas first, then try the practice test. It has the same six sections as your class worksheet, with new questions. Most answers are checked right away, and the questions reshuffle when you start over.<\/p>\n  <\/header>\n  <div class=\"row\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"reshuffle\" type=\"button\">Shuffle questions and answers<\/button><span class=\"note\" id=\"shufnote\">Starts over with a new random order.<\/span><\/div>\n  <nav class=\"steps\" id=\"steps\"><\/nav>\n  <main id=\"main\"><\/main>\n<\/div>\n\n<script>\nconst READY=\"Perfect score. You're ready for the Chapter 8 test.\";\nconst KEY=[\n{\"h\": \"Nutrients and energy\", \"b\": [\"<b>Carbohydrates<\/b> are your body's major energy source. Digestion turns them into <b>glucose<\/b>, the energy your brain prefers. <b>Dietary fiber<\/b> is a carbohydrate from plants that can't be completely digested.\", \"<b>Protein<\/b> builds and maintains cells and tissues, like muscle, skin, and hair.\", \"<b>Fats<\/b> give muscles energy and help your body absorb vitamins, so you need some. Limit saturated and trans fats instead of avoiding all fat.\", \"<b>Vitamins<\/b> are organic, and your body needs only small amounts of them. <b>Minerals<\/b> are inorganic and come from plants, water, and animal foods.\", \"<b>Calories<\/b> measure the energy in food. <b>Metabolism<\/b> is how fast your body uses energy for basic functions.\"]},\n{\"h\": \"Making good food choices\", \"b\": [\"<b>Nutrient-dense foods<\/b> have lots of vitamins and minerals, with little saturated fat, added sugar, or sodium. <b>Empty calories<\/b> give energy but few nutrients.\", \"<b>Food additives<\/b> are put in food to change things like flavor or shelf life. <b>Organic<\/b> foods are made without artificial chemicals like pesticides and chemical fertilizers.\", \"<b>MyPlate<\/b> shows the proportions of the five food groups to eat at a meal. The <b>Dietary Guidelines for Americans<\/b> give broader advice on eating patterns.\"]},\n{\"h\": \"Two kinds of malnutrition\", \"star\": true, \"b\": [\"<b>Overnutrition:<\/b> too many of some nutrients, such as added sugars, saturated fats, sodium, or refined grains.\", \"<b>Undernutrition:<\/b> not getting or absorbing the nutrients your body needs.\", \"A person can have too much of some nutrients and too little of others at the same time.\"]},\n{\"h\": \"Reading a food label\", \"star\": true, \"p\": \"Every number on a Nutrition Facts label is for one serving, so first work out how many servings were actually eaten.\", \"b\": [\"<b>Step 1:<\/b> Find the serving size. <b>Step 2:<\/b> Divide the amount eaten by the serving size to get the number of servings. <b>Step 3:<\/b> Multiply the label's number by the number of servings.\", \"<b>Example:<\/b> A serving is 1/2 cup with 5% of the Daily Value for sodium. Eating 1 1/2 cups is 3 servings, and 3 \u00d7 5% = 15%.\", \"<b>Percent Daily Value<\/b> is the share of a day's recommended amount, based on a 2,000-calorie eating plan.\", \"<b>Ingredients<\/b> are listed by weight, from most to least. They aren't ranked by how nutritious they are.\"]},\n{\"h\": \"Body composition and weight\", \"b\": [\"<b>Body composition<\/b> is the mix of fat, bone, and muscle in your body. Muscle and bone weigh more than fat.\", \"Females generally have a higher percentage of body fat than males.\", \"<b>BMI<\/b> compares weight with height. <b>Waist circumference<\/b> and <b>waist-to-hip ratio<\/b> show body fat distribution, or where fat is stored.\", \"US obesity rates doubled for adults and tripled for children from 1980 to 2008.\"]},\n{\"h\": \"Calorie balance and healthy thinking\", \"star\": true, \"b\": [\"<b>Calorie balance<\/b> means the calories you take in match the calories you use, so your weight tends to stay about the same.\", \"<b>More in than out:<\/b> weight goes up over time. <b>Less in than out:<\/b> weight goes down over time. Teens are still growing, so they need enough calories and nutrients.\", \"<b>All-or-nothing mindset:<\/b> seeing every choice as a total success or a total failure. One slip can then feel like a reason to give up, even though one food doesn't undo healthy habits.\", \"<b>Fad diets<\/b> promise fast weight loss, often by cutting out food groups. <b>Diuretics<\/b> (water pills) make you lose water and sodium, and they can have dangerous side effects.\"]},\n{\"h\": \"Food safety and reactions\", \"b\": [\"<b>Food allergy:<\/b> the immune system reacts to a food as if it's harmful, and even tiny amounts can cause sudden symptoms.\", \"<b>Food intolerance:<\/b> the body can't properly digest a type of food.\", \"<b>Foodborne illness:<\/b> food poisoning, which can come from germs or toxins in food.\"]}\n];\nconst FILL=[\n{\"q\": \"Your body relies on _____ to build and repair muscle, skin, hair, and other tissues.\", \"a\": \"protein\", \"alt\": [\"proteins\"], \"why\": \"Protein builds and maintains your body's cells and tissues.\"},\n{\"q\": \"Digestion turns the carbohydrates you eat into a simple sugar called _____, which your body prefers to use for energy.\", \"a\": \"glucose\", \"why\": \"Glucose is the preferred energy source, especially for the brain and nervous system.\"},\n{\"q\": \"Foods packed with vitamins and minerals, but low in saturated fat, added sugar, and sodium, are called _____ foods.\", \"a\": \"nutrient-dense\", \"why\": \"They give you a lot of nutrition without much of what you should limit.\"},\n{\"q\": \"Preservatives, flavorings, and other substances that companies put in food to change its taste or make it last longer are called food _____.\", \"a\": \"additives\", \"alt\": [\"additive\"], \"why\": \"Additives are added on purpose to change things like flavor or shelf life.\"},\n{\"q\": \"Measuring your waist can help show where fat is stored on your body. Where that fat is stored is called _____ distribution.\", \"a\": \"body fat\", \"alt\": [\"fat\"], \"why\": \"Body fat distribution means where fat deposits are located on the body.\"},\n{\"q\": \"Eating too much added sugar, saturated fat, sodium, or refined grains is a kind of malnutrition called _____.\", \"a\": \"overnutrition\", \"why\": \"Over = too much. Undernutrition is the opposite: not getting enough of the nutrients you need.\"}\n];\nconst TF=[\n{\"q\": \"It's healthiest to cut all fat out of what you eat.\", \"a\": false, \"why\": \"Your body needs some fat for energy and to absorb vitamins. The goal is limiting saturated and trans fats, not avoiding fat completely.\"},\n{\"q\": \"Someone can get too much of some nutrients while still missing out on others.\", \"a\": true, \"why\": \"Eating plenty of food doesn't guarantee good nutrition. Overnutrition and undernutrition are both forms of malnutrition.\"},\n{\"q\": \"The first ingredient listed on a food label is the one the food contains the most of.\", \"a\": true, \"why\": \"Ingredients are listed by weight, from most to least. They aren't ranked by how nutritious they are.\"},\n{\"q\": \"In general, males have a higher percentage of body fat than females.\", \"a\": false, \"why\": \"It's the other way around. Females generally have a higher percentage of body fat than males, which is a normal difference.\"},\n{\"q\": \"Because muscle weighs more than fat, a very muscular person can weigh a lot without having much body fat.\", \"a\": true, \"why\": \"Muscle and bone weigh more than fat, so weight alone doesn't tell you what a body is made of.\"},\n{\"q\": \"The percent Daily Value on a food label tells you how much is in the whole package.\", \"a\": false, \"why\": \"Percent Daily Values are for one serving. If you have more than one serving, multiply.\"},\n{\"q\": \"Fad diets are a reliable way to reach a healthy weight.\", \"a\": false, \"why\": \"Fad diets promise fast results, often by cutting out food groups or selling premade meals. Those results usually don't last.\"},\n{\"q\": \"When you take in about the same number of calories you use, your weight tends to stay about the same.\", \"a\": true, \"why\": \"That's calorie balance: calories in match calories out.\"}\n];\nconst MC=[\n{\"q\": \"Your body needs a lot of some nutrients and only a tiny bit of others. Which does it need in only tiny amounts?\", \"a\": \"Vitamins\", \"o\": [\"Water\", \"Protein\", \"Carbohydrates\"], \"why\": \"Vitamins are essential, but your body needs only very small amounts of them.\"},\n{\"q\": \"Which carbohydrate can't be completely digested by your body?\", \"a\": \"Dietary fiber\", \"o\": [\"Glucose\", \"Fructose\", \"Starch\"], \"why\": \"Dietary fiber comes only from plants. Your body can't fully digest it, but it still has many health benefits.\"},\n{\"q\": \"Which unit tells you how much energy a food provides?\", \"a\": \"Calorie\", \"o\": [\"Gram\", \"Milligram\", \"Cup\"], \"why\": \"Calories are units of energy in food. Grams and milligrams measure weight, and cups measure volume.\"},\n{\"q\": \"You want a quick picture of how much of your meal should come from each food group. Which tool is made for that?\", \"a\": \"MyPlate\", \"o\": [\"Nutrition Facts label\", \"Daily Values\", \"Ingredients list\"], \"why\": \"MyPlate shows the proportions of the five food groups to eat at a meal.\"},\n{\"q\": \"What happened to US obesity rates from 1980 to 2008?\", \"a\": \"They doubled for adults and tripled for children\", \"o\": [\"They stayed about the same for everyone\", \"They went down for adults and children\", \"They tripled for adults and doubled for children\"], \"why\": \"Obesity rates rose quickly during those years, especially among children.\"},\n{\"q\": \"Which statement is an example of an all-or-nothing mindset?\", \"a\": \"\\\"I had one cookie, so my healthy eating is ruined. I might as well finish the box.\\\"\", \"o\": [\"\\\"I had a cookie, so I'll have fruit with my next snack.\\\"\", \"\\\"I'm full, so I'll save the rest for later.\\\"\", \"\\\"I want more vegetables this week, so I'll add one at dinner.\\\"\"], \"why\": \"All-or-nothing thinking treats every choice as a total success or a total failure, so one slip can feel like a reason to give up.\"}\n];\nconst MATCH=[\n[\"Body composition\", \"How much of your body is made up of fat, bone, and muscle\"],\n[\"Body mass index (BMI)\", \"A tool that compares weight with height to see whether a weight is in a healthy range\"],\n[\"Diuretics\", \"Substances that make you urinate more so your body loses water and sodium, which can be dangerous\"],\n[\"Empty calories\", \"Energy from food that gives you few or no nutrients\"],\n[\"Fad diets\", \"Trendy plans that promise quick weight loss, usually by dropping whole food groups or buying special meals\"],\n[\"Metabolism\", \"How fast your body uses energy just to keep its basic functions going\"],\n[\"Minerals\", \"Nutrients like calcium and iron that aren't organic, and that come from plants, water, and animal foods\"],\n[\"Organic\", \"Farmed or made without artificial chemicals like pesticides and chemical fertilizers\"]\n];\nconst DATA={\"note\": \"Use the two labels to answer each question. Type just the number.\", \"html\": \"<div class=\\\"labels\\\"><figure class=\\\"nf\\\"><figcaption>Food A<\/figcaption><div class=\\\"nfb\\\"><p class=\\\"nft\\\">Nutrition Facts<\/p><p>8 servings per container<\/p><div class=\\\"nfs\\\"><span>Serving size<\/span><span>1/2 cup (30g)<\/span><\/div><div class=\\\"nfbar\\\"><\/div><p class=\\\"nfa\\\">Amount per serving<\/p><div class=\\\"nfc\\\"><b>Calories<\/b><b>140<\/b><\/div><p class=\\\"nfd\\\">% Daily Value*<\/p><div class=\\\"nr\\\"><span><b>Total Fat<\/b> 3g<\/span><b>4%<\/b><\/div><div class=\\\"nr i1\\\"><span>Saturated Fat 1g<\/span><b>5%<\/b><\/div><div class=\\\"nr i1\\\"><span><i>Trans<\/i> Fat 0g<\/span><b><\/b><\/div><div class=\\\"nr\\\"><span><b>Cholesterol<\/b> 0mg<\/span><b>0%<\/b><\/div><div class=\\\"nr\\\"><span><b>Sodium<\/b> 230mg<\/span><b>10%<\/b><\/div><div class=\\\"nr\\\"><span><b>Total Carbohydrate<\/b> 26g<\/span><b>9%<\/b><\/div><div class=\\\"nr i1\\\"><span>Dietary Fiber 3g<\/span><b>11%<\/b><\/div><div class=\\\"nr i1\\\"><span>Total Sugars 8g<\/span><b><\/b><\/div><div class=\\\"nr i2\\\"><span>Includes 6g Added Sugars<\/span><b>12%<\/b><\/div><div class=\\\"nr\\\"><span><b>Protein<\/b> 3g<\/span><b><\/b><\/div><div class=\\\"nfbar\\\"><\/div><div class=\\\"nr\\\"><span>Vitamin D 0mcg<\/span><b>0%<\/b><\/div><div class=\\\"nr\\\"><span>Calcium 40mg<\/span><b>3%<\/b><\/div><div class=\\\"nr\\\"><span>Iron 3mg<\/span><b>17%<\/b><\/div><div class=\\\"nr\\\"><span>Potassium 140mg<\/span><b>3%<\/b><\/div><p class=\\\"nfn\\\">* The % Daily Value shows how much a serving adds to a 2,000-calorie daily eating plan.<\/p><\/div><\/figure><figure class=\\\"nf\\\"><figcaption>Food B<\/figcaption><div class=\\\"nfb\\\"><p class=\\\"nft\\\">Nutrition Facts<\/p><p>2 servings per container<\/p><div class=\\\"nfs\\\"><span>Serving size<\/span><span>1 cup (240g)<\/span><\/div><div class=\\\"nfbar\\\"><\/div><p class=\\\"nfa\\\">Amount per serving<\/p><div class=\\\"nfc\\\"><b>Calories<\/b><b>180<\/b><\/div><p class=\\\"nfd\\\">% Daily Value*<\/p><div class=\\\"nr\\\"><span><b>Total Fat<\/b> 5g<\/span><b>6%<\/b><\/div><div class=\\\"nr i1\\\"><span>Saturated Fat 3g<\/span><b>15%<\/b><\/div><div class=\\\"nr i1\\\"><span><i>Trans<\/i> Fat 0g<\/span><b><\/b><\/div><div class=\\\"nr\\\"><span><b>Cholesterol<\/b> 20mg<\/span><b>7%<\/b><\/div><div class=\\\"nr\\\"><span><b>Sodium<\/b> 150mg<\/span><b>7%<\/b><\/div><div class=\\\"nr\\\"><span><b>Total Carbohydrate<\/b> 24g<\/span><b>9%<\/b><\/div><div class=\\\"nr i1\\\"><span>Dietary Fiber 1g<\/span><b>4%<\/b><\/div><div class=\\\"nr i1\\\"><span>Total Sugars 22g<\/span><b><\/b><\/div><div class=\\\"nr i2\\\"><span>Includes 11g Added Sugars<\/span><b>22%<\/b><\/div><div class=\\\"nr\\\"><span><b>Protein<\/b> 9g<\/span><b><\/b><\/div><div class=\\\"nfbar\\\"><\/div><div class=\\\"nr\\\"><span>Vitamin D 2.5mcg<\/span><b>13%<\/b><\/div><div class=\\\"nr\\\"><span>Calcium 300mg<\/span><b>23%<\/b><\/div><div class=\\\"nr\\\"><span>Iron 0.5mg<\/span><b>3%<\/b><\/div><div class=\\\"nr\\\"><span>Potassium 420mg<\/span><b>9%<\/b><\/div><p class=\\\"nfn\\\">* The % Daily Value shows how much a serving adds to a 2,000-calorie daily eating plan.<\/p><\/div><\/figure><\/div><p class=\\\"note\\\">These labels are made up for practice. They aren't real foods.<\/p>\", \"q\": [{\"q\": \"Alex has 3 cups of Food B. How many grams of added sugars is that?\", \"a\": 33, \"show\": \"33 g\", \"why\": \"A serving is 1 cup, so 3 cups is 3 servings. 3 \u00d7 11 g = 33 g.\"}, {\"q\": \"Someone on a 2,000-calorie eating plan has 1 cup of Food A. What percent of the Daily Value for sodium is that?\", \"a\": 20, \"show\": \"20%\", \"why\": \"A serving is 1/2 cup, so 1 cup is 2 servings. 2 \u00d7 10% = 20%.\"}, {\"q\": \"How many more milligrams of calcium are in one serving of Food B than in one serving of Food A?\", \"a\": 260, \"show\": \"260 mg\", \"why\": \"Subtract the smaller number from the bigger one: 300 \u2212 40 = 260.\"}, {\"q\": \"How many calories are in the whole container of Food A?\", \"a\": 1120, \"show\": \"1,120\", \"why\": \"The container has 8 servings with 140 calories each. 8 \u00d7 140 = 1,120.\"}]};\nconst SHORT=[\n{\"q\": \"Imagine explaining calorie balance to a younger kid. What does it mean, and what happens over time if someone regularly takes in more or fewer calories than they use?\", \"model\": [\"Calorie balance means the calories you get from food and drinks match the calories your body uses for basic functions and activity. If you regularly take in more than you use, you gain weight over time. If you regularly take in fewer than you use, you lose weight over time. Growing takes energy, so teens need enough calories too.\"], \"check\": [\"Say what calorie balance means (calories in match calories out)\", \"Explain what happens with more calories than you use\", \"Explain what happens with fewer calories than you use\"]},\n{\"q\": \"Some people feel they've either eaten \\\"perfectly\\\" or totally failed. Give your own example of this kind of thinking, and explain how it can get in the way of healthy habits.\", \"model\": [\"Example: \\\"I had fries at lunch, so today is already ruined. I'll eat whatever I want and start over next week.\\\" This makes one small choice feel like a total failure, so the person gives up instead of making a good choice at the next meal. It's better to see one food as just one food and keep going.\"], \"check\": [\"Give a specific example of all-or-nothing thinking\", \"Explain how it can make someone give up after one small slip\", \"Mention a better way to think about it\"]}\n];\nconst $=id=>document.getElementById(id);\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst mcOpts=m=>m.last?[...shuffle(m.o),m.a]:shuffle([m.a,...m.o]);\nconst idx=a=>a.map((_,i)=>i);\n\nconst PARTS=[\n {key:'key',name:'Key ideas'},\n {key:'fill',name:'Completion',total:FILL.length},\n {key:'tf',name:'True/False',total:TF.length},\n {key:'mc',name:'Multiple choice',total:MC.length},\n {key:'match',name:'Matching',total:MATCH.length},\n {key:'data',name:'Analyzing data',total:DATA.q.length},\n {key:'short',name:'Short answer',total:SHORT.length},\n {key:'results',name:'Results'}\n];\nconst QPARTS=PARTS.filter(p=>p.total);\nconst DRAW={key:drawKey,fill:drawFill,tf:drawTF,mc:drawMC,match:drawMatch,data:drawData,short:drawShort,results:drawResults};\nlet S,cur=0;\n\nfunction newTest(start){\n  S={\n    fill:{order:shuffle(idx(FILL)),text:{},ans:{}},\n    tf:{order:shuffle(idx(TF)),chosen:{},ans:{}},\n    mc:{order:shuffle(idx(MC)),opts:MC.map(mcOpts),chosen:{},ans:{}},\n    match:{terms:shuffle(idx(MATCH)),defs:shuffle(idx(MATCH)),matched:new Set(),missed:new Set()},\n    data:{order:idx(DATA.q),text:{},ans:{}},\n    short:{order:idx(SHORT),text:{},shown:{},ans:{}}\n  };\n  go(start);\n}\nconst answered=k=>k==='match'?S.match.matched.size:Object.keys(S[k].ans).length;\nconst score=k=>k==='match'?[...S.match.matched].filter(i=>!S.match.missed.has(i)).length:Object.values(S[k].ans).filter(Boolean).length;\n\nfunction drawSteps(){\n  $('steps').innerHTML='';\n  PARTS.forEach((p,i)=>{\n    const b=document.createElement('button');b.type='button';b.className='step'+(i===cur?' on':'');\n    if(i===cur)b.setAttribute('aria-current','step');\n    const sub=p.key==='key'?'Read first':p.key==='results'?'Score':`${answered(p.key)}/${p.total} done`;\n    b.innerHTML=`<b>${esc(p.name)}<\/b><span>${sub}<\/span>`;\n    b.onclick=()=>go(i);\n    $('steps').append(b);\n  });\n}\nfunction go(i){cur=i;drawSteps();DRAW[PARTS[i].key]();window.scrollTo({top:0,behavior:'smooth'})}\nfunction redraw(focusId){\n  const y=window.scrollY;DRAW[PARTS[cur].key]();drawSteps();window.scrollTo(0,y);\n  const f=focusId&&$(focusId);if(f)f.focus({preventScroll:f.tagName!=='INPUT'});\n}\nfunction nextBtn(){\n  const n=PARTS[cur+1],b=document.createElement('button');b.type='button';b.className='btn';\n  b.textContent=cur===0?'Start the practice test':n.key==='results'?'See results':'Next: '+n.name;\n  b.onclick=()=>go(cur+1);return b;\n}\nfunction partShell(title,note){\n  const m=$('main');m.innerHTML='';\n  const s=document.createElement('section');s.className='part';\n  s.innerHTML=`<h2>${title}<\/h2><p class=\"note\">${note}<\/p>`;m.append(s);return s;\n}\nfunction card(k,qi,n,text){\n  const q=document.createElement('div');q.className='q';q.id=`${k}-${qi}`;q.tabIndex=-1;\n  q.innerHTML=`<div class=\"qhead\"><span class=\"qn\">${n}.<\/span><p class=\"qt\">${esc(text)}<\/p><\/div>`;\n  return q;\n}\nfunction fb(q,ok,html){const p=document.createElement('p');p.className='fb '+(ok?'ok':'bad');p.innerHTML=html;q.append(p)}\n\n/* ---------- Key ideas ---------- */\nfunction drawKey(){\n  const s=partShell('Key ideas','Read these first. Spots marked \"Often mixed up\" are worth extra attention.');\n  KEY.forEach(k=>{\n    const c=document.createElement('div');c.className='q key';\n    c.innerHTML=`<h3>${esc(k.h)}${k.star?' <span class=\"tag\">Often mixed up<\/span>':''}<\/h3>${k.p?`<p>${k.p}<\/p>`:''}${k.b?`<ul>${k.b.map(x=>`<li>${x}<\/li>`).join('')}<\/ul>`:''}`;\n    s.append(c);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- typed answers (completion and data) ---------- */\nconst norm=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'');\nfunction typoDist(a,b){\n  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?0:j}\n  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){\n    const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);\n    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);\n  }\n  return d[a.length][b.length];\n}\nconst accepted=it=>[it.a,...(it.alt||[])].map(norm);\nconst isExact=(it,v)=>accepted(it).includes(norm(v));\nconst isWord=(it,v)=>isExact(it,v)||accepted(it).some(c=>typoDist(norm(v),c)<=(c.length>=8?2:c.length>=4?1:0));\nconst numOf=s=>{const m=s.replace(/,/g,'').match(/-?\\d+(\\.\\d+)?/);return m?parseFloat(m[0]):NaN};\nconst isNum=(it,v)=>Math.abs(numOf(v)-it.a)<.01;\n\nfunction typed(k,qi,n,it,isRight,place){\n  const st=S[k],q=card(k,qi,n,it.q),done=qi in st.ans;\n  const r=document.createElement('div');r.className='typed';\n  const inp=document.createElement('input');\n  inp.type='text';inp.id=`inp-${k}-${qi}`;inp.value=st.text[qi]||'';inp.placeholder=place;inp.disabled=done;\n  inp.setAttribute('aria-label',`Your answer to question ${n}`);\n  inp.autocomplete='off';inp.spellcheck=false;\n  inp.setAttribute('autocapitalize','off');inp.setAttribute('autocorrect','off');\n  if(k==='data')inp.inputMode='decimal';\n  r.append(inp);\n  if(!done){\n    const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent='Check';b.disabled=!inp.value.trim();\n    const submit=()=>{\n      const v=inp.value.trim();if(!v)return;\n      st.text[qi]=v;st.ans[qi]=isRight(it,v);\n      const later=st.order.slice(st.order.indexOf(qi)+1).find(i=>!(i in st.ans));\n      redraw(later===undefined?q.id:`inp-${k}-${later}`);\n    };\n    inp.oninput=()=>{st.text[qi]=inp.value;b.disabled=!inp.value.trim()};\n    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit()}};\n    b.onclick=submit;\n    r.append(b);\n  }\n  q.append(r);\n  return q;\n}\n\n/* ---------- Completion ---------- */\nfunction drawFill(){\n  const s=partShell('Completion','Type the word that fills in the blank. Close misspellings still count, and you will see the correct spelling.');\n  S.fill.order.forEach((qi,n)=>{\n    const it=FILL[qi],q=typed('fill',qi,n+1,it,isWord,'Type the word');\n    if(qi in S.fill.ans){\n      const ok=S.fill.ans[qi];\n      fb(q,ok,ok?`<b>Correct.<\/b> ${isExact(it,S.fill.text[qi])?'':`Spelling: <b>${esc(it.a)}<\/b>. `}${esc(it.why)}`:`<b>Not quite.<\/b> The answer is <b>${esc(it.a)}<\/b>. ${esc(it.why)}`);\n    }\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- True/false ---------- */\nfunction drawTF(){\n  const s=partShell('True or false','Remember: if any part of the statement is false, the whole statement is false.');\n  const st=S.tf;\n  st.order.forEach((qi,n)=>{\n    const it=TF[qi],q=card('tf',qi,n+1,it.q),done=qi in st.ans,o=document.createElement('div');o.className='opts row2';\n    [true,false].forEach(val=>{\n      const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=val?'True':'False';\n      if(done){b.disabled=true;if(val===it.a)b.classList.add('right');else if(st.chosen[qi]===val)b.classList.add('no')}\n      b.onclick=()=>{st.ans[qi]=val===it.a;st.chosen[qi]=val;redraw(q.id)};\n      o.append(b);\n    });\n    q.append(o);\n    if(done)fb(q,st.ans[qi],`<b>${st.ans[qi]?'Correct.':'Not quite.'}<\/b> The answer is <b>${it.a?'True':'False'}<\/b>. ${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Multiple choice ---------- */\nfunction drawMC(){\n  const s=partShell('Multiple choice','Choose the best answer.');\n  const st=S.mc;\n  st.order.forEach((qi,n)=>{\n    const it=MC[qi],q=card('mc',qi,n+1,it.q),done=qi in st.ans,o=document.createElement('div');o.className='opts';\n    st.opts[qi].forEach(txt=>{\n      const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=txt;\n      if(done){b.disabled=true;if(txt===it.a)b.classList.add('right');else if(st.chosen[qi]===txt)b.classList.add('no')}\n      b.onclick=()=>{st.ans[qi]=txt===it.a;st.chosen[qi]=txt;redraw(q.id)};\n      o.append(b);\n    });\n    q.append(o);\n    if(done)fb(q,st.ans[qi],`<b>${st.ans[qi]?'Correct.':'Not quite.'}<\/b> ${st.ans[qi]?'':`The answer is <b>${esc(it.a)}<\/b>. `}${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Matching ---------- */\nlet selT=null,selD=null;\nfunction drawMatch(){\n  const m=S.match,s=partShell('Matching','Tap a word, then tap the description it goes with. Your score counts matches you get on the first try.');\n  const box=document.createElement('div');box.className='part';\n  box.innerHTML=`<div class=\"sub\"><div class=\"meter\"><i id=\"mbar\" style=\"width:${m.matched.size/MATCH.length*100}%\"><\/i><\/div><span id=\"mcount\">${m.matched.size} of ${MATCH.length} matched<\/span><\/div>\n   <p class=\"label\">Words<\/p><div class=\"terms\" id=\"terms\"><\/div>\n   <p class=\"label\">Descriptions<\/p><div class=\"defs\" id=\"defs\"><\/div>`;\n  s.append(box);\n  selT=selD=null;\n  m.terms.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='term'+(m.matched.has(i)?' done':'');b.textContent=MATCH[i][0];b.dataset.i=i;b.onclick=()=>pickM('t',b);$('terms').append(b)});\n  m.defs.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='def'+(m.matched.has(i)?' done':'');b.dataset.i=i;\n    if(m.matched.has(i)){const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+MATCH[i][0];b.append(a)}\n    const d=document.createElement('span');d.textContent=MATCH[i][1];b.append(d);b.onclick=()=>pickM('d',b);$('defs').append(b)});\n  s.append(nextBtn());\n}\nfunction pickM(kind,el){\n  if(el.classList.contains('done'))return;\n  if(kind==='t'){if(selT)selT.classList.remove('sel');selT=selT===el?null:el}else{if(selD)selD.classList.remove('sel');selD=selD===el?null:el}\n  if(el===selT||el===selD)el.classList.add('sel');\n  if(selT&&selD){\n    const t=selT,d=selD,m=S.match;t.classList.remove('sel');d.classList.remove('sel');selT=selD=null;\n    if(t.dataset.i===d.dataset.i){\n      m.matched.add(+t.dataset.i);t.classList.add('done');d.classList.add('done');\n      const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+t.textContent;d.prepend(a);\n      $('mbar').style.width=(m.matched.size/MATCH.length*100)+'%';\n      $('mcount').textContent=`${m.matched.size} of ${MATCH.length} matched`;\n      drawSteps();\n    }else{\n      m.missed.add(+t.dataset.i);m.missed.add(+d.dataset.i);\n      [t,d].forEach(e=>{e.classList.add('wrong');setTimeout(()=>e.classList.remove('wrong'),450)});\n    }\n  }\n}\n\n/* ---------- Analyzing data ---------- */\nfunction drawData(){\n  const s=partShell('Analyzing data',DATA.note);\n  const t=document.createElement('div');t.className='part';t.innerHTML=DATA.html;s.append(t);\n  S.data.order.forEach((qi,n)=>{\n    const it=DATA.q[qi],q=typed('data',qi,n+1,it,isNum,'Type the number');\n    if(qi in S.data.ans)fb(q,S.data.ans[qi],`<b>${S.data.ans[qi]?'Correct.':'Not quite.'}<\/b> The answer is <b>${esc(it.show)}<\/b>. ${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Short answer ---------- */\nfunction drawShort(){\n  const s=partShell('Short answer','Write a sentence or two, then compare it with the sample answer and score yourself.');\n  const st=S.short;\n  st.order.forEach((qi,n)=>{\n    const it=SHORT[qi],q=card('short',qi,n+1,it.q),done=qi in st.ans;\n    const ta=document.createElement('textarea');ta.rows=4;ta.value=st.text[qi]||'';ta.disabled=done;\n    ta.setAttribute('aria-label',`Your answer to question ${n+1}`);\n    q.append(ta);\n    if(!st.shown[qi]){\n      const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent='Show sample answer';b.disabled=!ta.value.trim();\n      ta.oninput=()=>{st.text[qi]=ta.value;b.disabled=!ta.value.trim()};\n      b.onclick=()=>{st.shown[qi]=true;redraw(q.id)};\n      q.append(b);\n    }else{\n      ta.oninput=()=>{st.text[qi]=ta.value};\n      const m=document.createElement('div');m.className='model';\n      m.innerHTML=`<p class=\"label\">Sample answer<\/p>${it.model.map(x=>`<p>${esc(x)}<\/p>`).join('')}<p class=\"label\">Did you...<\/p><ul>${it.check.map(x=>`<li>${esc(x)}<\/li>`).join('')}<\/ul>`;\n      q.append(m);\n      if(done)fb(q,st.ans[qi],st.ans[qi]?'<b>Nice work.<\/b> You scored this one as covered.':'<b>Keep practicing.<\/b> Read the sample answer again, then try it in your own words.');\n      else{\n        const r=document.createElement('div');r.className='row';\n        [['I covered these',true,'btn'],['I need more practice',false,'btn ghost']].forEach(([label,val,cls])=>{\n          const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;b.onclick=()=>{st.ans[qi]=val;redraw(q.id)};r.append(b);\n        });\n        q.append(r);\n      }\n    }\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Results ---------- */\nfunction missedCount(){return QPARTS.reduce((n,p)=>n+(p.key==='match'?S.match.missed.size:Object.values(S[p.key].ans).filter(v=>v===false).length),0)}\nfunction retryMissed(){\n  ['fill','tf','mc','data','short'].forEach(k=>{\n    const st=S[k];\n    Object.keys(st.ans).forEach(i=>{\n      if(st.ans[i]!==false)return;\n      delete st.ans[i];\n      if(st.chosen)delete st.chosen[i];\n      if(st.shown)delete st.shown[i];\n      if(st.text&&k!=='short')delete st.text[i];\n      if(k==='mc')st.opts[i]=mcOpts(MC[i]);\n    });\n  });\n  const m=S.match;[...m.missed].forEach(i=>m.matched.delete(i));m.missed=new Set();\n  go(PARTS.findIndex(p=>p.total&&answered(p.key)<p.total));\n}\nfunction drawResults(){\n  const total=QPARTS.reduce((n,p)=>n+p.total,0),right=QPARTS.reduce((n,p)=>n+score(p.key),0);\n  const unanswered=QPARTS.reduce((n,p)=>n+p.total-answered(p.key),0),miss=missedCount();\n  const s=partShell('Results',unanswered?`${unanswered} question${unanswered>1?'s are':' is'} still unanswered. Unanswered questions count as wrong.`:'Every question answered. Matching counts first-try matches, and you scored the short answers yourself.');\n  const box=document.createElement('div');box.className='part';\n  box.innerHTML=`<div><p class=\"label\">Total score<\/p><div class=\"big\">${right}/${total} <span style=\"font-size:22px;color:var(--muted)\">${Math.round(right/total*100)}%<\/span><\/div><\/div>\n   <div class=\"tally\">${QPARTS.map(p=>`<div><span class=\"label\">${esc(p.name)}<\/span><b>${score(p.key)}/${p.total}<\/b><\/div>`).join('')}<\/div>`;\n  s.append(box);\n  const items=[];\n  FILL.forEach((it,i)=>{if(S.fill.ans[i]===false)items.push(`<li>${esc(it.q)} <b>${esc(it.a)}<\/b><\/li>`)});\n  TF.forEach((it,i)=>{if(S.tf.ans[i]===false)items.push(`<li><b>${it.a?'True':'False'}:<\/b> ${esc(it.q)} ${esc(it.why)}<\/li>`)});\n  MC.forEach((it,i)=>{if(S.mc.ans[i]===false)items.push(`<li>${esc(it.q)} <b>${esc(it.a)}<\/b><\/li>`)});\n  [...S.match.missed].forEach(i=>items.push(`<li><b>${esc(MATCH[i][0])}:<\/b> ${esc(MATCH[i][1])}<\/li>`));\n  DATA.q.forEach((it,i)=>{if(S.data.ans[i]===false)items.push(`<li>${esc(it.q)} <b>${esc(it.show)}<\/b>. ${esc(it.why)}<\/li>`)});\n  SHORT.forEach((it,i)=>{if(S.short.ans[i]===false)items.push(`<li>${esc(it.q)} Reread the sample answer.<\/li>`)});\n  if(items.length){\n    const h=document.createElement('p');h.className='label';h.textContent='Review these';s.append(h);\n    const ul=document.createElement('ul');ul.className='missed';ul.innerHTML=items.join('');s.append(ul);\n  }else if(!unanswered){\n    const p=document.createElement('p');p.textContent=READY;p.style.margin='0';s.append(p);\n  }\n  const r=document.createElement('div');r.className='row';\n  if(miss){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent='Retry missed questions';b.onclick=retryMissed;r.append(b)}\n  const again=document.createElement('button');again.type='button';again.className=miss?'btn ghost':'btn';again.textContent='Retake with new shuffle';again.onclick=()=>newTest(1);r.append(again);\n  s.append(r);\n}\n$('reshuffle').onclick=()=>{newTest(1);const n=$('shufnote');n.textContent='Shuffled. New order loaded.';setTimeout(()=>n.textContent='Starts over with a new random order.',2500)};\nnewTest(0);\n<\/script>\n\n<\/body>\n<\/html>\n", "ch9r": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch 9 Body Image Review<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\">\n<style>\n:root{\n  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#18292D; --muted:#5A6D70; --line:#CFDAD7;\n  --accent:#8A5A00; --accent-soft:#F3E6C8; --good:#2E7D4F; --good-soft:#DDF0E3;\n  --bad:#B3412E; --bad-soft:#F6DFDA;\n  --display:\"Bricolage Grotesque\", \"Segoe UI\", system-ui, sans-serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    color-scheme:dark;\n    --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n    --accent:#E0B25C; --accent-soft:#3D3016; --good:#5BC486; --good-soft:#163527;\n    --bad:#F08A76; --bad-soft:#3E211C;\n  }\n}\n:root[data-theme=\"dark\"]{\n  color-scheme:dark;\n  --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n  --accent:#E0B25C; --accent-soft:#3D3016; --good:#5BC486; --good-soft:#163527;\n  --bad:#F08A76; --bad-soft:#3E211C;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}\n.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}\nheader{display:flex;flex-direction:column;gap:6px}\n.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0}\nh1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}\nh2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;text-wrap:balance}\n.how{color:var(--muted);margin:0;max-width:62ch}\n.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}\n.step{font:inherit;font-size:13px;text-align:left;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}\n.step b{font-family:var(--display);font-size:14px;color:var(--ink);line-height:1.15}\n.step span{font-variant-numeric:tabular-nums}\n.step.on{border-color:var(--accent);background:var(--accent-soft)}\n@media (max-width:560px){.step b{font-size:12px}.step{padding:6px 7px;font-size:11px}}\n.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}\n.part{display:flex;flex-direction:column;gap:14px}\n.sub{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}\n.meter{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}\n.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}\n.sub span{font-size:14px;color:var(--muted);white-space:nowrap}\n.terms{display:flex;flex-wrap:wrap;gap:8px}\n.term{font-family:var(--display);font-weight:600;font-size:16px;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}\n.term:hover,.def:hover,.opt:hover:not(:disabled){border-color:var(--accent)}\n.defs{display:flex;flex-direction:column;gap:10px}\n.def{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}\n.def .ans{font-family:var(--display);font-weight:600;font-size:14px;color:var(--good)}\n.sel{background:var(--accent-soft)!important;border-color:var(--accent)!important}\n.done{background:var(--good-soft);border-color:var(--good);cursor:default}\n.term.done{color:var(--good)}\n.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;animation:shake .35s}\n@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\n.q{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}\n.qhead{display:flex;gap:10px;align-items:baseline}\n.qn{font-family:var(--display);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}\n.qt{margin:0;font-weight:700}\n.pg{font-size:13px;color:var(--muted);font-weight:400;white-space:nowrap}\n.opts{display:flex;flex-direction:column;gap:8px}\n.opts.row2{flex-direction:row;flex-wrap:wrap}\n.opt{font:inherit;text-align:left;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}\n.opts.row2 .opt{flex:1;min-width:120px;justify-content:center;font-family:var(--display);font-weight:600}\n.opt .box{flex:none;width:18px;height:18px;margin-top:2px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;line-height:1}\n.opt.sel .box{background:var(--accent);border-color:var(--accent);color:var(--surface)}\n.opt:disabled{cursor:default}\n.opt.right{background:var(--good-soft);border-color:var(--good)}\n.opt.miss{background:var(--surface);border-color:var(--good);border-style:dashed}\n.opt.no{background:var(--bad-soft);border-color:var(--bad)}\n.fb{margin:0;padding:10px 12px;border-radius:10px;font-size:15px}\n.fb.ok{background:var(--good-soft)}\n.fb.bad{background:var(--bad-soft)}\n.fb b{font-family:var(--display)}\n.note{font-size:14px;color:var(--muted);margin:0}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.btn{font-family:var(--display);font-weight:600;font-size:16px;padding:11px 18px;border-radius:10px;border:none;background:var(--accent);color:var(--surface);cursor:pointer;align-self:flex-start}\n.btn:disabled{opacity:.45;cursor:default}\n.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}\n.row{display:flex;flex-wrap:wrap;gap:10px}\n.big{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}\n.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.tally div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}\n.tally b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}\n.missed{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}\n.missed b{font-family:var(--display)}\n.q:focus{outline:none}\n.key h3{font-family:var(--display);font-weight:800;font-size:18px;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}\n.key p{margin:0}\n.key ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}\n.tag{font-family:var(--body);font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 8px}\n.typed{display:flex;flex-wrap:wrap;gap:8px}\n.typed input,.q textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}\n.typed input{flex:1;min-width:160px}\n.typed .btn{align-self:stretch}\n.q textarea{width:100%;resize:vertical}\n.typed input:disabled,.q textarea:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);background:var(--surface)}\ninput:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.tblwrap{overflow-x:auto}\n.tbl{border-collapse:collapse;width:100%;background:var(--surface);font-size:15px}\n.tbl th,.tbl td{border:1.5px solid var(--line);padding:10px;text-align:center;font-variant-numeric:tabular-nums}\n.tbl thead th{background:var(--accent-soft);font-family:var(--display);font-weight:600}\n.tbl thead th:first-child,.tbl tbody th{text-align:left}\n@media (max-width:560px){.tbl{font-size:13px}.tbl th,.tbl td{padding:6px}}\n.model{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:10px;padding:12px}\n.model p{margin:0}\n.model ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n[hidden]{display:none!important}\nhtml{color-scheme:light}\nbody{margin:0}\n<\/style>\n<script>\naddEventListener('message',e=>{const d=e.data||{};if(d.type==='theme'){if(d.theme)document.documentElement.dataset.theme=d.theme;else delete document.documentElement.dataset.theme}});\n<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <header>\n    <p class=\"eyebrow\">Health \u00b7 Chapter 9 \u00b7 Review<\/p>\n    <h1>Body Image Chapter Review<\/h1>\n    <p class=\"how\">Read the key ideas first, then try the practice test. It has the same six sections as your class worksheet, with new questions. Most answers are checked right away, and the questions reshuffle when you start over.<\/p>\n  <\/header>\n  <div class=\"row\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"reshuffle\" type=\"button\">Shuffle questions and answers<\/button><span class=\"note\" id=\"shufnote\">Starts over with a new random order.<\/span><\/div>\n  <nav class=\"steps\" id=\"steps\"><\/nav>\n  <main id=\"main\"><\/main>\n<\/div>\n\n<script>\nconst READY=\"Perfect score. You're ready for the Chapter 9 test.\";\nconst KEY=[\n{\"h\": \"What body image is\", \"p\": \"Body image is the picture of your body you carry in your head. It comes from how you see yourself and how other people react to you.\", \"b\": [\"It can be very different from how your body actually looks.\", \"Feeling self-conscious about your body is very common in the teen years, for people of any gender.\"]},\n{\"h\": \"What shapes body image\", \"b\": [\"<b>Social environment:<\/b> your relationships and your community, including family, friends, and classmates.\", \"<b>Media:<\/b> ads, movies, and social media. Many images are <b>airbrushed<\/b> or edited, so they aren't realistic. The media's preference for very thin women is also fairly recent, not a timeless rule.\", \"<b>Sports and activities:<\/b> some, like gymnastics, figure skating, and ballet, put extra attention on being thin.\", \"<b>Weight stigma:<\/b> the mistaken belief that thinner is always better.\"]},\n{\"h\": \"Three healthier mindsets\", \"star\": true, \"b\": [\"<b>Body positivity = all bodies.<\/b> Appreciating every body type and understanding that your body will change.\", \"<b>Body neutrality = what it can do.<\/b> Focusing on what your body can do, not how it looks.\", \"<b>Body compassion = kindness.<\/b> Accepting your body, caring for it, and being kind to it.\"]},\n{\"h\": \"Eating and body image problems\", \"star\": true, \"b\": [\"<b>Disordered eating:<\/b> a range of irregular eating habits. It may or may not lead to a diagnosis.\", \"<b>Eating disorder:<\/b> a mental illness that involves abnormal eating habits.\", \"<b>Orthorexia:<\/b> a disordered eating pattern. It's an obsession with eating \\\"healthy\\\" that ends up harming a person's health.\", \"<b>Muscle dysmorphia:<\/b> extreme concern with becoming more muscular.\", \"<b>Purging:<\/b> trying to get rid of food from the body.\"]},\n{\"h\": \"Warning signs and getting help\", \"b\": [\"<b>Risk factors<\/b> include expectations and pressure from family and society.\", \"<b>Signs in the body:<\/b> feeling cold all the time, constipation, acid reflux, and lanugo (fine hair that grows because of starvation).\", \"<b>Signs in thoughts, feelings, and actions:<\/b> intense fear of gaining weight, frequent dieting, discomfort eating around others, and pulling away from friends and family.\", \"<b>Eating disorders don't usually go away on their own.<\/b> If you're worried about yourself or a friend, tell a trusted adult, such as a parent, school counselor, or doctor.\"]},\n{\"h\": \"Reading a data table\", \"b\": [\"<b>How many people?<\/b> Turn the percent into a decimal and multiply: 20% of 200 is 0.20 \u00d7 200 = 40.\", \"<b>What percent did NOT?<\/b> Subtract from 100. If 30% did something, 100 \u2212 30 = 70% did not.\", \"<b>How much higher?<\/b> Subtract the smaller number from the bigger one.\"]}\n];\nconst FILL=[\n{\"q\": \"When a photo is edited on a computer to smooth skin and hide wrinkles before it's published, that's called _____.\", \"a\": \"airbrushing\", \"alt\": [\"airbrushed\", \"airbrush\"], \"why\": \"Airbrushed images aren't realistic, so they aren't a fair comparison.\"},\n{\"q\": \"Your family, friends, classmates, and community are all part of your _____ environment, which affects your body image.\", \"a\": \"social\", \"why\": \"Your relationships and community make up your social environment.\"},\n{\"q\": \"Someone who becomes so fixated on eating only \\\"healthy\\\" foods that it starts to harm their health may have _____.\", \"a\": \"orthorexia\", \"why\": \"Ortho means correct. It's an obsession with eating only the \\\"correct\\\" foods.\"},\n{\"q\": \"A person starving because of anorexia nervosa may grow a coat of fine body hair called _____.\", \"a\": \"lanugo\", \"why\": \"Lanugo grows as a result of starvation.\"},\n{\"q\": \"Paying attention to what your body can do, instead of how it looks, is called body _____.\", \"a\": \"neutrality\", \"alt\": [\"body neutrality\"], \"why\": \"Neutrality = what your body can DO.\"},\n{\"q\": \"A person who is already very muscular but keeps worrying that they aren't muscular enough may have muscle _____.\", \"a\": \"dysmorphia\", \"alt\": [\"muscle dysmorphia\"], \"why\": \"Dys means bad and morph means shape. They see their own shape wrong.\"}\n];\nconst TF=[\n{\"q\": \"The way you picture your body always matches how your body really looks.\", \"a\": false, \"why\": \"Body image is a mental picture shaped by your thoughts and by other people, so it can be very different from reality.\"},\n{\"q\": \"Very thin women haven't always been the beauty standard. In the past, fuller figures were often the ideal.\", \"a\": true, \"why\": \"The preference for thinness in the media is fairly recent, which shows that beauty standards change over time.\"},\n{\"q\": \"Feeling self-conscious about your body is very common among teens.\", \"a\": true, \"why\": \"Most teens feel this way at some point, partly because their bodies are changing quickly.\"},\n{\"q\": \"A person with an eating disorder can usually just wait, because it tends to fade as they get older.\", \"a\": false, \"why\": \"Eating disorders usually don't go away on their own. They're serious illnesses that need treatment.\"},\n{\"q\": \"Pressure from family or society can make disordered eating more likely.\", \"a\": true, \"why\": \"Expectations from other people are risk factors for both disordered eating and eating disorders.\"},\n{\"q\": \"People of any gender can struggle with body image.\", \"a\": true, \"why\": \"Body image affects everyone. Muscle dysmorphia, for example, often affects boys and men.\"},\n{\"q\": \"Body positivity and body neutrality mean the same thing.\", \"a\": false, \"why\": \"Positivity is appreciating all body types. Neutrality is focusing on what your body can do instead of how it looks.\"},\n{\"q\": \"You can tell whether someone has an eating disorder just by looking at their weight.\", \"a\": false, \"why\": \"Eating disorders affect people of all shapes and sizes.\"}\n];\nconst MC=[\n{\"q\": \"Which of these can affect how a person feels about their body?\", \"a\": \"All of these\", \"o\": [\"Comments from family and friends\", \"Photos on social media\", \"The sports they play\"], \"last\": true, \"why\": \"Body image is shaped by the people around you, the media, and your activities.\"},\n{\"q\": \"Athletes in which sport are most likely to feel pressure to stay thin?\", \"a\": \"Figure skating\", \"o\": [\"Football\", \"Baseball\", \"Basketball\"], \"why\": \"Activities that focus on appearance or being light, like figure skating, gymnastics, and ballet, put extra attention on being thin.\"},\n{\"q\": \"Which warning sign of an eating disorder shows up in a person's thoughts and feelings?\", \"a\": \"Intense fear of gaining weight\", \"o\": [\"Feeling cold all the time\", \"Fine hair growing on the body\", \"Constipation\"], \"why\": \"A fear is mental and emotional. The other choices are physical signs.\"},\n{\"q\": \"Jada says, \\\"I'm grateful my legs get me through soccer practice,\\\" and doesn't think about how they look. Which idea is this?\", \"a\": \"Body neutrality\", \"o\": [\"Body positivity\", \"Body compassion\", \"Weight stigma\"], \"why\": \"Neutrality focuses on what your body can do, not how it looks.\"},\n{\"q\": \"Sam doesn't like how they look today, but decides to be kind to their body and take care of it anyway. Which idea is this?\", \"a\": \"Body compassion\", \"o\": [\"Body neutrality\", \"Body positivity\", \"Body image\"], \"why\": \"Compassion = kindness. Sam is accepting and le><\/div><p class=\\\"note\\\">These numbers are made up for practice. They aren't real survey results.<\/p>\", \"q\": [{\"q\": \"If 300 boys took this survey, how many feel pressure about their looks from social media?\", \"a\": 99, \"show\": \"99\", \"why\": \"33% of 300 is 0.33 \u00d7 300 = 99.\"}, {\"q\": \"What percent of girls have not talked to a trusted adult about body image?\", \"a\": 82, \"show\": \"82%\", \"why\": \"\\\"Not\\\" means subtract from 100: 100 \u2212 18 = 82.\"}, {\"q\": \"For comparing their looks to photos online, how many percentage points higher is the girls' number than the boys' number?\", \"a\": 23, \"show\": \"23\", \"why\": \"Subtract the smaller number from the bigger one: 64 \u2212 41 = 23.\"}]};\nconst SHORT=[\n{\"q\": \"Your friend says, \\\"I'd finally be happy if I looked like the people on social media.\\\" What would you tell them, and why?\", \"model\": [\"Looks don't decide whether someone is happy. People who are considered good-looking can still be unhappy, and people of every shape can be happy. Happiness comes more from good relationships, doing things you enjoy, and being kind to yourself. A lot of those photos are edited too, so they aren't a fair comparison.\"], \"check\": [\"Give a clear answer to your friend\", \"Explain why looks alone don't decide happiness\", \"Give an example or name something that does help\"]},\n{\"q\": \"Some people think brands should have to show many different body types in their ads. Do you agree? Explain why or why not.\", \"model\": [\"One good answer: Yes. Seeing only one body type can make people feel that's the only way to look right, which hurts body image. Showing many body types is more realistic.\", \"Another good answer: No. Companies should choose for themselves, and rules about bodies could make people feel judged. It would be better to teach people that ads are often edited.\"], \"check\": [\"Take a clear side (either one can be right)\", \"Give at least one reason connected to body image or the media\", \"Explain your reason, not just your opinion\"]}\n];\nconst $=id=>document.getElementById(id);\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst mcOpts=m=>m.last?[...shuffle(m.o),m.a]:shuffle([m.a,...m.o]);\nconst idx=a=>a.map((_,i)=>i);\n\nconst PARTS=[\n {key:'key',name:'Key ideas'},\n {key:'fill',name:'Completion',total:FILL.length},\n {key:'tf',name:'True/False',total:TF.length},\n {key:'mc',name:'Multiple choice',total:MC.length},\n {key:'match',name:'Matching',total:MATCH.length},\n {key:'data',name:'Analyzing data',total:DATA.q.length},\n {key:'short',name:'Short answer',total:SHORT.length},\n {key:'results',name:'Results'}\n];\nconst QPARTS=PARTS.filter(p=>p.total);\nconst DRAW={key:drawKey,fill:drawFill,tf:drawTF,mc:drawMC,match:drawMatch,data:drawData,short:drawShort,results:drawResults};\nlet S,cur=0;\n\nfunction newTest(start){\n  S={\n    fill:{order:shuffle(idx(FILL)),text:{},ans:{}},\n    tf:{order:shuffle(idx(TF)),chosen:{},ans:{}},\n    mc:{order:shuffle(idx(MC)),opts:MC.map(mcOpts),chosen:{},ans:{}},\n    match:{terms:shuffle(idx(MATCH)),defs:shuffle(idx(MATCH)),matched:new Set(),missed:new Set()},\n    data:{order:idx(DATA.q),text:{},ans:{}},\n    short:{order:idx(SHORT),text:{},shown:{},ans:{}}\n  };\n  go(start);\n}\nconst answered=k=>k==='match'?S.match.matched.size:Object.keys(S[k].ans).length;\nconst score=k=>k==='match'?[...S.match.matched].filter(i=>!S.match.missed.has(i)).length:Object.values(S[k].ans).filter(Boolean).length;\n\nfunction drawSteps(){\n  $('steps').innerHTML='';\n  PARTS.forEach((p,i)=>{\n    const b=document.createElement('button');b.type='button';b.className='step'+(i===cur?' on':'');\n    if(i===cur)b.setAttribute('aria-current','step');\n    const sub=p.key==='key'?'Read first':p.key==='results'
