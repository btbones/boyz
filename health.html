length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?0:j}\n  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){\n    const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);\n    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);\n  }\n  return d[a.length][b.length];\n}\nconst accepted=it=>[it.a,...(it.alt||[])].map(norm);\nconst isExact=(it,v)=>accepted(it).includes(norm(v));\nconst isWord=(it,v)=>isExact(it,v)||accepted(it).some(c=>typoDist(norm(v),c)<=(c.length>=8?2:c.length>=4?1:0));\nconst numOf=s=>{const m=s.replace(/,/g,'').match(/-?\\d+(\\.\\d+)?/);return m?parseFloat(m[0]):NaN};\nconst isNum=(it,v)=>Math.abs(numOf(v)-it.a)<.01;\n\nfunction typed(k,qi,n,it,isRight,place){\n  const st=S[k],q=card(k,qi,n,it.q),done=qi in st.ans;\n  const r=document.createElement('div');r.className='typed';\n  const inp=document.createElement('input');\n  inp.type='text';inp.id=`inp-${k}-${qi}`;inp.value=st.text[qi]||'';inp.placeholder=place;inp.disabled=done;\n  inp.setAttribute('aria-label',`Your answer to question ${n}`);\n  inp.autocomplete='off';inp.spellcheck=false;\n  inp.setAttribute('autocapitalize','off');inp.setAttribute('autocorrect','off');\n  if(k==='data')inp.inputMode='decimal';\n  r.append(inp);\n  if(!done){\n    const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent='Check';b.disabled=!inp.value.trim();\n    const submit=()=>{\n      const v=inp.value.trim();if(!v)return;\n      st.text[qi]=v;st.ans[qi]=isRight(it,v);\n      const later=st.order.slice(st.order.indexOf(qi)+1).find(i=>!(i in st.ans));\n      redraw(later===undefined?q.id:`inp-${k}-${later}`);\n    };\n    inp.oninput=()=>{st.text[qi]=inp.value;b.disabled=!inp.value.trim()};\n    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit()}};\n    b.onclick=submit;\n    r.append(b);\n  }\n  q.append(r);\n  return q;\n}\n\n/* ---------- Completion ---------- */\nfunction drawFill(){\n  const s=partShell('Completion','Type the word that fills in the blank. Close misspellings still count, and you will see the correct spelling.');\n  S.fill.order.forEach((qi,n)=>{\n    const it=FILL[qi],q=typed('fill',qi,n+1,it,isWord,'Type the word');\n    if(qi in S.fill.ans){\n      const ok=S.fill.ans[qi];\n      fb(q,ok,ok?`<b>Correct.<\/b> ${isExact(it,S.fill.text[qi])?'':`Spelling: <b>${esc(it.a)}<\/b>. `}${esc(it.why)}`:`<b>Not quite.<\/b> The answer is <b>${esc(it.a)}<\/b>. ${esc(it.why)}`);\n    }\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- True/false ---------- */\nfunction drawTF(){\n  const s=partShell('True or false','Remember: if any part of the statement is false, the whole statement is false.');\n  const st=S.tf;\n  st.order.forEach((qi,n)=>{\n    const it=TF[qi],q=card('tf',qi,n+1,it.q),done=qi in st.ans,o=document.createElement('div');o.className='opts row2';\n    [true,false].forEach(val=>{\n      const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=val?'True':'False';\n      if(done){b.disabled=true;if(val===it.a)b.classList.add('right');else if(st.chosen[qi]===val)b.classList.add('no')}\n      b.onclick=()=>{st.ans[qi]=val===it.a;st.chosen[qi]=val;redraw(q.id)};\n      o.append(b);\n    });\n    q.append(o);\n    if(done)fb(q,st.ans[qi],`<b>${st.ans[qi]?'Correct.':'Not quite.'}<\/b> The answer is <b>${it.a?'True':'False'}<\/b>. ${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Multiple choice ---------- */\nfunction drawMC(){\n  const s=partShell('Multiple choice','Choose the best answer.');\n  const st=S.mc;\n  st.order.forEach((qi,n)=>{\n    const it=MC[qi],q=card('mc',qi,n+1,it.q),done=qi in st.ans,o=document.createElement('div');o.className='opts';\n    st.opts[qi].forEach(txt=>{\n      const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=txt;\n      if(done){b.disabled=true;if(txt===it.a)b.classList.add('right');else if(st.chosen[qi]===txt)b.classList.add('no')}\n      b.onclick=()=>{st.ans[qi]=txt===it.a;st.chosen[qi]=txt;redraw(q.id)};\n      o.append(b);\n    });\n    q.append(o);\n    if(done)fb(q,st.ans[qi],`<b>${st.ans[qi]?'Correct.':'Not quite.'}<\/b> ${st.ans[qi]?'':`The answer is <b>${esc(it.a)}<\/b>. `}${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Matching ---------- */\nlet selT=null,selD=null;\nfunction drawMatch(){\n  const m=S.match,s=partShell('Matching','Tap a word, then tap the description it goes with. Your score counts matches you get on the first try.');\n  const box=document.createElement('div');box.className='part';\n  box.innerHTML=`<div class=\"sub\"><div class=\"meter\"><i id=\"mbar\" style=\"width:${m.matched.size/MATCH.length*100}%\"><\/i><\/div><span id=\"mcount\">${m.matched.size} of ${MATCH.length} matched<\/span><\/div>\n   <p class=\"label\">Words<\/p><div class=\"terms\" id=\"terms\"><\/div>\n   <p class=\"label\">Descriptions<\/p><div class=\"defs\" id=\"defs\"><\/div>`;\n  s.append(box);\n  selT=selD=null;\n  m.terms.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='term'+(m.matched.has(i)?' done':'');b.textContent=MATCH[i][0];b.dataset.i=i;b.onclick=()=>pickM('t',b);$('terms').append(b)});\n  m.defs.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='def'+(m.matched.has(i)?' done':'');b.dataset.i=i;\n    if(m.matched.has(i)){const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+MATCH[i][0];b.append(a)}\n    const d=document.createElement('span');d.textContent=MATCH[i][1];b.append(d);b.onclick=()=>pickM('d',b);$('defs').append(b)});\n  s.append(nextBtn());\n}\nfunction pickM(kind,el){\n  if(el.classList.contains('done'))return;\n  if(kind==='t'){if(selT)selT.classList.remove('sel');selT=selT===el?null:el}else{if(selD)selD.classList.remove('sel');selD=selD===el?null:el}\n  if(el===selT||el===selD)el.classList.add('sel');\n  if(selT&&selD){\n    const t=selT,d=selD,m=S.match;t.classList.remove('sel');d.classList.remove('sel');selT=selD=null;\n    if(t.dataset.i===d.dataset.i){\n      m.matched.add(+t.dataset.i);t.classList.add('done');d.classList.add('done');\n      const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+t.textContent;d.prepend(a);\n      $('mbar').style.width=(m.matched.size/MATCH.length*100)+'%';\n      $('mcount').textContent=`${m.matched.size} of ${MATCH.length} matched`;\n      drawSteps();\n    }else{\n      m.missed.add(+t.dataset.i);m.missed.add(+d.dataset.i);\n      [t,d].forEach(e=>{e.classList.add('wrong');setTimeout(()=>e.classList.remove('wrong'),450)});\n    }\n  }\n}\n\n/* ---------- Analyzing data ---------- */\nfunction drawData(){\n  const s=partShell('Analyzing data',DATA.note);\n  const t=document.createElement('div');t.className='part';t.innerHTML=DATA.html;s.append(t);\n  S.data.order.forEach((qi,n)=>{\n    const it=DATA.q[qi],q=typed('data',qi,n+1,it,isNum,'Type the number');\n    if(qi in S.data.ans)fb(q,S.data.ans[qi],`<b>${S.data.ans[qi]?'Correct.':'Not quite.'}<\/b> The answer is <b>${esc(it.show)}<\/b>. ${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Short answer ---------- */\nfunction drawShort(){\n  const s=partShell('Short answer','Write a sentence or two, then compare it with the sample answer and score yourself.');\n  const st=S.short;\n  st.order.forEach((qi,n)=>{\n    const it=SHORT[qi],q=card('short',qi,n+1,it.q),done=qi in st.ans;\n    const ta=document.createElement('textarea');ta.rows=4;ta.value=st.text[qi]||'';ta.disabled=done;\n    ta.setAttribute('aria-label',`Your answer to question ${n+1}`);\n    q.append(ta);\n    if(!st.shown[qi]){\n      const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent='Show sample answer';b.disabled=!ta.value.trim();\n      ta.oninput=()=>{st.text[qi]=ta.value;b.disabled=!ta.value.trim()};\n      b.onclick=()=>{st.shown[qi]=true;redraw(q.id)};\n      q.append(b);\n    }else{\n      ta.oninput=()=>{st.text[qi]=ta.value};\n      const m=document.createElement('div');m.className='model';\n      m.innerHTML=`<p class=\"label\">Sample answer<\/p>${it.model.map(x=>`<p>${esc(x)}<\/p>`).join('')}<p class=\"label\">Did you...<\/p><ul>${it.check.map(x=>`<li>${esc(x)}<\/li>`).join('')}<\/ul>`;\n      q.append(m);\n      if(done)fb(q,st.ans[qi],st.ans[qi]?'<b>Nice work.<\/b> You scored this one as covered.':'<b>Keep practicing.<\/b> Read the sample answer again, then try it in your own words.');\n      else{\n        const r=document.createElement('div');r.className='row';\n        [['I covered these',true,'btn'],['I need more practice',false,'btn ghost']].forEach(([label,val,cls])=>{\n          const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;b.onclick=()=>{st.ans[qi]=val;redraw(q.id)};r.append(b);\n        });\n        q.append(r);\n      }\n    }\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Results ---------- */\nfunction missedCount(){return QPARTS.reduce((n,p)=>n+(p.key==='match'?S.match.missed.size:Object.values(S[p.key].ans).filter(v=>v===false).length),0)}\nfunction retryMissed(){\n  ['fill','tf','mc','data','short'].forEach(k=>{\n    const st=S[k];\n    Object.keys(st.ans).forEach(i=>{\n      if(st.ans[i]!==false)return;\n      delete st.ans[i];\n      if(st.chosen)delete st.chosen[i];\n      if(st.shown)delete st.shown[i];\n      if(st.text&&k!=='short')delete st.text[i];\n      if(k==='mc')st.opts[i]=mcOpts(MC[i]);\n    });\n  });\n  const m=S.match;[...m.missed].forEach(i=>m.matched.delete(i));m.missed=new Set();\n  go(PARTS.findIndex(p=>p.total&&answered(p.key)<p.total));\n}\nfunction drawResults(){\n  const total=QPARTS.reduce((n,p)=>n+p.total,0),right=QPARTS.reduce((n,p)=>n+score(p.key),0);\n  const unanswered=QPARTS.reduce((n,p)=>n+p.total-answered(p.key),0),miss=missedCount();\n  const s=partShell('Results',unanswered?`${unanswered} question${unanswered>1?'s are':' is'} still unanswered. Unanswered questions count as wrong.`:'Every question answered. Matching counts first-try matches, and you scored the short answers yourself.');\n  const box=document.createElement('div');box.className='part';\n  box.innerHTML=`<div><p class=\"label\">Total score<\/p><div class=\"big\">${right}/${total} <span style=\"font-size:22px;color:var(--muted)\">${Math.round(right/total*100)}%<\/span><\/div><\/div>\n   <div class=\"tally\">${QPARTS.map(p=>`<div><span class=\"label\">${esc(p.name)}<\/span><b>${score(p.key)}/${p.total}<\/b><\/div>`).join('')}<\/div>`;\n  s.append(box);\n  const items=[];\n  FILL.forEach((it,i)=>{if(S.fill.ans[i]===false)items.push(`<li>${esc(it.q)} <b>${esc(it.a)}<\/b><\/li>`)});\n  TF.forEach((it,i)=>{if(S.tf.ans[i]===false)items.push(`<li><b>${it.a?'True':'False'}:<\/b> ${esc(it.q)} ${esc(it.why)}<\/li>`)});\n  MC.forEach((it,i)=>{if(S.mc.ans[i]===false)items.push(`<li>${esc(it.q)} <b>${esc(it.a)}<\/b><\/li>`)});\n  [...S.match.missed].forEach(i=>items.push(`<li><b>${esc(MATCH[i][0])}:<\/b> ${esc(MATCH[i][1])}<\/li>`));\n  DATA.q.forEach((it,i)=>{if(S.data.ans[i]===false)items.push(`<li>${esc(it.q)} <b>${esc(it.show)}<\/b>. ${esc(it.why)}<\/li>`)});\n  SHORT.forEach((it,i)=>{if(S.short.ans[i]===false)items.push(`<li>${esc(it.q)} Reread the sample answer.<\/li>`)});\n  if(items.length){\n    const h=document.createElement('p');h.className='label';h.textContent='Review these';s.append(h);\n    const ul=document.createElement('ul');ul.className='missed';ul.innerHTML=items.join('');s.append(ul);\n  }else if(!unanswered){\n    const p=document.createElement('p');p.textContent=READY;p.style.margin='0';s.append(p);\n  }\n  const r=document.createElement('div');r.className='row';\n  if(miss){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent='Retry missed questions';b.onclick=retryMissed;r.append(b)}\n  const again=document.createElement('button');again.type='button';again.className=miss?'btn ghost':'btn';again.textContent='Retake with new shuffle';again.onclick=()=>newTest(1);r.append(again);\n  s.append(r);\n}\n$('reshuffle').onclick=()=>{newTest(1);const n=$('shufnote');n.textContent='Shuffled. New order loaded.';setTimeout(()=>n.textContent='Starts over with a new random order.',2500)};\nnewTest(0);\n<\/script>\n\n<\/body>\n<\/html>\n", "ch10r": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch 10 Physical Activity Review<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\">\n<style>\n:root{\n  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#18292D; --muted:#5A6D70; --line:#CFDAD7;\n  --accent:#A33A4A; --accent-soft:#F4DCE0; --good:#2E7D4F; --good-soft:#DDF0E3;\n  --bad:#B3412E; --bad-soft:#F6DFDA;\n  --display:\"Bricolage Grotesque\", \"Segoe UI\", system-ui, sans-serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    color-scheme:dark;\n    --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n    --accent:#F0909E; --accent-soft:#40202A; --good:#5BC486; --good-soft:#163527;\n    --bad:#F08A76; --bad-soft:#3E211C;\n  }\n}\n:root[data-theme=\"dark\"]{\n  color-scheme:dark;\n  --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n  --accent:#F0909E; --accent-soft:#40202A; --good:#5BC486; --good-soft:#163527;\n  --bad:#F08A76; --bad-soft:#3E211C;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}\n.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}\nheader{display:flex;flex-direction:column;gap:6px}\n.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0}\nh1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}\nh2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;text-wrap:balance}\n.how{color:var(--muted);margin:0;max-width:62ch}\n.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}\n.step{font:inherit;font-size:13px;text-align:left;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}\n.step b{font-family:var(--display);font-size:14px;color:var(--ink);line-height:1.15}\n.step span{font-variant-numeric:tabular-nums}\n.step.on{border-color:var(--accent);background:var(--accent-soft)}\n@media (max-width:560px){.step b{font-size:12px}.step{padding:6px 7px;font-size:11px}}\n.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}\n.part{display:flex;flex-direction:column;gap:14px}\n.sub{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}\n.meter{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}\n.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}\n.sub span{font-size:14px;color:var(--muted);white-space:nowrap}\n.terms{display:flex;flex-wrap:wrap;gap:8px}\n.term{font-family:var(--display);font-weight:600;font-size:16px;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}\n.term:hover,.def:hover,.opt:hover:not(:disabled){border-color:var(--accent)}\n.defs{display:flex;flex-direction:column;gap:10px}\n.def{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}\n.def .ans{font-family:var(--display);font-weight:600;font-size:14px;color:var(--good)}\n.sel{background:var(--accent-soft)!important;border-color:var(--accent)!important}\n.done{background:var(--good-soft);border-color:var(--good);cursor:default}\n.term.done{color:var(--good)}\n.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;animation:shake .35s}\n@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\n.q{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}\n.qhead{display:flex;gap:10px;align-items:baseline}\n.qn{font-family:var(--display);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}\n.qt{margin:0;font-weight:700}\n.pg{font-size:13px;color:var(--muted);font-weight:400;white-space:nowrap}\n.opts{display:flex;flex-direction:column;gap:8px}\n.opts.row2{flex-direction:row;flex-wrap:wrap}\n.opt{font:inherit;text-align:left;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}\n.opts.row2 .opt{flex:1;min-width:120px;justify-content:center;font-family:var(--display);font-weight:600}\n.opt .box{flex:none;width:18px;height:18px;margin-top:2px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;line-height:1}\n.opt.sel .box{background:var(--accent);border-color:var(--accent);color:var(--surface)}\n.opt:disabled{cursor:default}\n.opt.right{background:var(--good-soft);border-color:var(--good)}\n.opt.miss{background:var(--surface);border-color:var(--good);border-style:dashed}\n.opt.no{background:var(--bad-soft);border-color:var(--bad)}\n.fb{margin:0;padding:10px 12px;border-radius:10px;font-size:15px}\n.fb.ok{background:var(--good-soft)}\n.fb.bad{background:var(--bad-soft)}\n.fb b{font-family:var(--display)}\n.note{font-size:14px;color:var(--muted);margin:0}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.btn{font-family:var(--display);font-weight:600;font-size:16px;padding:11px 18px;border-radius:10px;border:none;background:var(--accent);color:var(--surface);cursor:pointer;align-self:flex-start}\n.btn:disabled{opacity:.45;cursor:default}\n.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}\n.row{display:flex;flex-wrap:wrap;gap:10px}\n.big{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}\n.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.tally div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}\n.tally b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}\n.missed{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}\n.missed b{font-family:var(--display)}\n.q:focus{outline:none}\n.key h3{font-family:var(--display);font-weight:800;font-size:18px;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}\n.key p{margin:0}\n.key ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}\n.tag{font-family:var(--body);font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 8px}\n.typed{display:flex;flex-wrap:wrap;gap:8px}\n.typed input,.q textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}\n.typed input{flex:1;min-width:160px}\n.typed .btn{align-self:stretch}\n.q textarea{width:100%;resize:vertical}\n.typed input:disabled,.q textarea:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);background:var(--surface)}\ninput:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.chart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}\n.chart h3{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.2;margin:0;text-wrap:balance}\n.grp{display:flex;flex-direction:column;gap:5px}\n.grp p{margin:0;font-weight:700;font-size:14px}\n.hbar,.axis{display:grid;grid-template-columns:44px 1fr 42px;align-items:center;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}\n.hbar span{color:var(--muted)}\n.hbar b{text-align:right}\n.track{height:14px;border-radius:4px;background:var(--bg);overflow:hidden}\n.track i{display:block;height:100%;border-radius:4px}\n.track i.g{background:var(--accent)}\n.track i.b{background:var(--muted)}\n.axis{font-size:12px;color:var(--muted)}\n.axis>span:nth-child(2){display:flex;justify-content:space-between}\n.model{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:10px;padding:12px}\n.model p{margin:0}\n.model ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n[hidden]{display:none!important}\nhtml{color-scheme:light}\nbody{margin:0}\n<\/style>\n<script>\naddEventListener('message',e=>{const d=e.data||{};if(d.type==='theme'){if(d.theme)document.documentElement.dataset.theme=d.theme;else delete document.documentElement.dataset.theme}});\n<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <header>\n    <p class=\"eyebrow\">Health \u00b7 Chapter 10 \u00b7 Review<\/p>\n    <h1>Physical Activity Chapter Review<\/h1>\n    <p class=\"how\">Read the key ideas first, then try the practice test. It has the same six sections as your class worksheet, with new questions. Most answers are checked right away, and the questions reshuffle when you start over.<\/p>\n  <\/header>\n  <div class=\"row\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"reshuffle\" type=\"button\">Shuffle questions and answers<\/button><span class=\"note\" id=\"shufnote\">Starts over with a new random order.<\/span><\/div>\n  <nav class=\"steps\" id=\"steps\"><\/nav>\n  <main id=\"main\"><\/main>\n<\/div>\n\n<script>\nconst READY=\"Perfect score. You're ready for the Chapter 10 test.\";\nconst KEY=[\n{\"h\": \"Physical activity vs. exercise\", \"star\": true, \"b\": [\"<b>Physical activity<\/b> is any movement that uses energy: walking the dog, doing chores, dancing, or playing outside. It doesn't have to be planned to count.\", \"<b>Exercise<\/b> is one kind of physical activity. It's planned, structured, and done to improve your fitness, like a workout or team practice.\", \"<b>Sedentary behaviors<\/b> are things you do sitting or lying down that use very little energy, like watching TV, gaming, or scrolling on your phone.\"]},\n{\"h\": \"Why being active is worth it\", \"b\": [\"It makes your heart, lungs, muscles, and bones stronger.\", \"It helps you sleep better.\", \"Your brain releases <b>endorphins<\/b>, chemicals that boost your mood and help with stress.\", \"It lowers your risk of diseases like heart disease and type 2 diabetes.\"]},\n{\"h\": \"Kinds of fitness\", \"star\": true, \"p\": \"<b>Physical fitness<\/b> means your body can handle daily activities and surprise demands, with energy left over. It has two parts.\", \"b\": [\"<b>Health-related fitness = everyday life.<\/b> Doing daily activities with ease and energy. It includes <b>cardiorespiratory fitness<\/b> (how well your heart and lungs get oxygen to your muscles), <b>muscular strength<\/b> (how much force your muscles can exert), <b>muscular endurance<\/b> (how long your muscles can keep working), <b>flexibility<\/b> (moving your joints fully and easily), and <b>body composition<\/b> (how much of your body is fat compared to muscle, bone, and other tissue).\", \"<b>Skill-related fitness = sports.<\/b> Performing well in a particular sport or activity. It includes <b>agility<\/b> (changing direction quickly), <b>balance<\/b>, <b>coordination<\/b>, <b>power<\/b> (strength + speed), <b>reaction time<\/b>, and <b>speed<\/b>.\"]},\n{\"h\": \"Aerobic vs. anaerobic\", \"star\": true, \"b\": [\"<b>Aerobic = with oxygen.<\/b> Steady activity you can keep up for a while, like jogging, swimming, or biking. It builds cardiorespiratory fitness.\", \"<b>Anaerobic = without oxygen.<\/b> Short, all-out bursts, like sprinting or lifting something heavy.\"]},\n{\"h\": \"Planning a fitness program\", \"b\": [\"<b>FITT:<\/b> <b>F<\/b>requency (how often), <b>I<\/b>ntensity (how hard), <b>T<\/b>ime (how long), and <b>T<\/b>ype (what kind of activity).\", \"<b>Overload principle:<\/b> to improve, ask your body to do a little more than it's used to. Increase slowly so you don't get hurt.\", \"<b>Physical Activity Guidelines for Americans:<\/b> recommendations from the US Department of Health and Human Services. Kids and teens need <b>at least 60 minutes every day<\/b>, mostly aerobic. Adults need at least 150 minutes a week.\", \"<b>A plan that sticks<\/b> fits your interests, your schedule, and your current fitness level. Mixing in different activities (<b>cross training<\/b>) and getting friends or family involved helps too.\"]},\n{\"h\": \"Checking your heart rate\", \"star\": true, \"b\": [\"<b>Intensity<\/b> is how much energy your body uses each minute. The easiest way to check it is to take your <b>pulse<\/b>.\", \"<b>Maximum heart rate:<\/b> the fastest your heart can beat when it's working its hardest. A common estimate is 220 minus your age, so about 206 for a 14-year-old.\", \"<b>Target heart rate:<\/b> a range below your maximum that's safe and effective for how hard you want to work.\"]},\n{\"h\": \"Staying safe while you're active\", \"b\": [\"<b>Warm-up (before):<\/b> gets blood pumping to your muscles and stretches them, which helps prevent injuries.\", \"<b>Cooldown (after):<\/b> lets your heart rate come back down to normal gradually.\", \"<b>Drink water before, during, and after.<\/b> Losing fluid through sweat can cause <b>dehydration<\/b>. Don't wait until you're very thirsty. Water and sports drinks help you stay hydrated, and chocolate milk also gives your muscles carbohydrates and protein to recover.\", \"<b>Female athlete triad:<\/b> three health conditions linked to intense activity in females: disordered eating, <b>amenorrhea<\/b> (missing periods), and <b>osteoporosis<\/b> (weak bones).\"]},\n{\"h\": \"Weather and injuries\", \"star\": true, \"b\": [\"<b>Too hot, from mild to deadly:<\/b> <b>heat cramps<\/b> are painful muscle spasms. <b>Heat exhaustion<\/b> brings nausea, dizziness, weakness, headache, a weak pulse, and fainting. <b>Heatstroke<\/b> is a medical emergency that can lead to shock, coma, or death, so call 911.\", \"<b>Too cold:<\/b> <b>frostbite<\/b> is when skin and the tissue under it freeze. <b>Hypothermia<\/b> is a medical emergency where your body temperature drops too low.\", \"<b>Injuries:<\/b> a <b>sprain<\/b> hurts a ligament. A <b>fracture<\/b> is a broken bone. A <b>dislocation<\/b> is a bone pushed out of its normal position. A <b>concussion<\/b> is a brain injury from a hit or jolt to the head or upper body.\"]},\n{\"h\": \"Reading a chart about NOT being active\", \"star\": true, \"b\": [\"<b>Read the title first.<\/b> If the chart shows people who do <b>not<\/b> get enough activity, a longer bar means <b>less<\/b> active, not more.\", \"<b>Who DOES get enough?<\/b> Subtract from 100. If 80% don't, then 100 \u2212 80 = 20% do.\", \"<b>How many people?<\/b> Turn the percent into a decimal and multiply: 20% of 500 is 0.20 \u00d7 500 = 100.\", \"<b>How much higher?<\/b> Subtract the smaller number from the bigger one. That gap is in percentage points.\"]}\n];\nconst FILL=[\n{\"q\": \"Jogging, swimming laps, and biking for a long time are _____ activities, because they use oxygen to fuel your muscles.\", \"a\": \"aerobic\", \"why\": \"Aerobic means \\\"with oxygen.\\\" Long, steady activities like these build cardiorespiratory fitness.\"},\n{\"q\": \"How hard your body is working during an activity, measured by how much energy it uses each minute, is called _____.\", \"a\": \"intensity\", \"why\": \"Intensity is the I in FITT. Taking your pulse is an easy way to check it.\"},\n{\"q\": \"To keep getting fitter, you have to ask your body to do a little more than it's used to. This is called the _____ principle.\", \"a\": \"overload\", \"why\": \"Your body adapts to the extra demand and gets stronger. Increase slowly so you don't get hurt.\"},\n{\"q\": \"Watching TV, scrolling on your phone, and playing video games while sitting are all _____ behaviors.\", \"a\": \"sedentary\", \"why\": \"Sedentary behaviors involve sitting or lying down and use very little energy.\"},\n{\"q\": \"People often feel happier after a hard workout. That's partly because the brain releases mood-boosting chemicals called _____.\", \"a\": \"endorphins\", \"alt\": [\"endorphin\"], \"why\": \"Endorphins are released during physical activity and improve your mood.\"},\n{\"q\": \"A brain injury caused by a hit or jolt to the head or upper body is called a _____.\", \"a\": \"concussion\", \"why\": \"Anyone who might have a concussion should stop playing and get checked by a doctor.\"},\n{\"q\": \"After a hard run, walking slowly for a few minutes so your heart rate can come back down gradually is called a _____.\", \"a\": \"cooldown\", \"alt\": [\"cool down\"], \"why\": \"A warm-up comes before activity. A cooldown comes after.\"}\n];\nconst TF=[\n{\"q\": \"Exercise and physical activity mean exactly the same thing.\", \"a\": false, \"why\": \"Physical activity is any movement that uses energy, like walking the dog. Exercise is the kind that's planned, structured, and meant to improve your fitness.\"},\n{\"q\": \"Being active on a regular basis can help you sleep better.\", \"a\": true, \"why\": \"Better sleep is one of the benefits of regular physical activity.\"},\n{\"q\": \"Skill-related fitness is mainly about having energy for everyday tasks, like carrying groceries up the stairs.\", \"a\": false, \"why\": \"That describes health-related fitness. Skill-related fitness is about doing well in a sport or activity, using things like agility, balance, and speed.\"},\n{\"q\": \"It's fine to skip the cooldown, because your heart rate drops back to normal the moment you stop moving.\", \"a\": false, \"why\": \"A cooldown lets your heart rate come back down gradually instead of all at once.\"},\n{\"q\": \"Heatstroke is a medical emergency.\", \"a\": true, \"why\": \"Heatstroke can lead to shock, coma, and even death. Call 911.\"},\n{\"q\": \"A runner who also swims and bikes can get better at running.\", \"a\": true, \"why\": \"This is called cross training. Doing different activities can help improve your skill in your main one.\"},\n{\"q\": \"During a game, it's best to wait until you're very thirsty before you drink water.\", \"a\": false, \"why\": \"Drink water before, during, and after activity. By the time you feel very thirsty, you may already be getting dehydrated.\"},\n{\"q\": \"Cardiorespiratory fitness is about how well your heart and lungs get oxygen to your muscles.\", \"a\": true, \"why\": \"Cardio means heart and respiratory means breathing. Aerobic activities like jogging and swimming build it.\"}\n];\nconst MC=[\n{\"q\": \"In the FITT formula, what does the last T stand for?\", \"a\": \"Type\", \"o\": [\"Training\", \"Target\", \"Technique\"], \"why\": \"FITT stands for frequency, intensity, time, and type. Type is the kind of activity you choose.\"},\n{\"q\": \"The Physical Activity Guidelines for Americans recommend how much activity for teens?\", \"a\": \"At least 60 minutes every day\", \"o\": [\"At least 2 hours every day\", \"At least 30 minutes, 3 days a week\", \"At least 150 minutes a week\"], \"why\": \"Kids and teens need at least an hour a day. 150 minutes a week is the recommendation for adults.\"},\n{\"q\": \"A basketball player explodes off the floor for a rebound. Which part of skill-related fitness combines strength and speed like this?\", \"a\": \"Power\", \"o\": [\"Agility\", \"Balance\", \"Coordination\"], \"why\": \"Power = strength + speed. Agility is about changing direction quickly.\"},\n{\"q\": \"Lifting the heaviest weight you can, just one time, mostly tests which part of fitness?\", \"a\": \"Muscular strength\", \"o\": [\"Muscular endurance\", \"Flexibility\", \"Cardiorespiratory fitness\"], \"why\": \"Strength is how much force your muscles can exert. Lifting a lighter weight many times would test endurance.\"},\n{\"q\": \"A common estimate of maximum heart rate is 220 minus your age. What is it for a 14-year-old?\", \"a\": \"206 beats per minute\", \"o\": [\"234 beats per minute\", \"196 beats per minute\", \"180 beats per minute\"], \"why\": \"220 \u2212 14 = 206. You get 234 if you add instead of subtract.\"},\n{\"q\": \"At a hot practice, a teammate has a headache, feels dizzy and sick to their stomach, and looks weak. Which condition do these signs point to?\", \"a\": \"Heat exhaustion\", \"o\": [\"Heat cramps\", \"Frostbite\", \"Hypothermia\"], \"why\": \"Nausea, dizziness, weakness, and headache are signs of heat exhaustion. Get them somewhere cool, give them water, and tell a coach. If it gets worse, it can become heatstroke, which is an emergency.\"},\n{\"q\": \"Which three conditions make up the female athlete triad?\", \"a\": \"Disordered eating, amenorrhea, and osteoporosis\", \"o\": [\"Dehydration, heat cramps, and heatstroke\", \"Sprains, fractures, and dislocations\", \"Asthma, allergies, and anemia\"], \"why\": \"The triad links not eating enough, missed periods, and weak bones in very active females.\"},\n{\"q\": \"Which workout plan is a person most likely to stick with?\", \"a\": \"One built around activities they enjoy that fits their schedule\", \"o\": [\"One copied from a pro athlete's training plan\", \"One that's much harder than they can do now, for faster results\", \"The exact same workout every day, so there's nothing to plan\"], \"why\": \"Plans that match your interests, schedule, and current fitness are the ones people keep doing.\"}\n];\nconst MATCH=[\n[\"Amenorrhea\", \"Menstrual periods that stop, or don't come when they normally should\"],\n[\"Dislocation\", \"A bone pushed out of its normal position at a joint\"],\n[\"Fracture\", \"A broken bone\"],\n[\"Frostbite\", \"Skin and the tissue under it freezing in very cold weather\"],\n[\"Hypothermia\", \"An emergency where your whole body's temperature drops too low\"],\n[\"Maximum heart rate\", \"The fastest your heart can beat, when it's working as hard as it possibly can\"],\n[\"Sprain\", \"A stretched or torn ligament, the tissue that connects bones at a joint\"],\n[\"Target heart rate\", \"A heart rate range that's safe and effective for how hard you want to work\"]\n];\nconst DATA={\"note\": \"Use the chart to answer each question. Read the title carefully, then type just the number.\", \"html\": \"<div class=\\\"chart\\\"><p class=\\\"label\\\">Made-up school district survey<\/p><h3>Students who do <u>NOT<\/u> get 60 minutes of physical activity a day<\/h3><div class=\\\"grp\\\"><p>6th grade<\/p><div class=\\\"hbar\\\"><span>Girls<\/span><span class=\\\"track\\\"><i class=\\\"g\\\" style=\\\"width:66%\\\"><\/i><\/span><b>66%<\/b><\/div><div class=\\\"hbar\\\"><span>Boys<\/span><span class=\\\"track\\\"><i class=\\\"b\\\" style=\\\"width:58%\\\"><\/i><\/span><b>58%<\/b><\/div><\/div><div class=\\\"grp\\\"><p>7th grade<\/p><div class=\\\"hbar\\\"><span>Girls<\/span><span class=\\\"track\\\"><i class=\\\"g\\\" style=\\\"width:72%\\\"><\/i><\/span><b>72%<\/b><\/div><div class=\\\"hbar\\\"><span>Boys<\/span><span class=\\\"track\\\"><i class=\\\"b\\\" style=\\\"width:61%\\\"><\/i><\/span><b>61%<\/b><\/div><\/div><div class=\\\"grp\\\"><p>8th grade<\/p><div class=\\\"hbar\\\"><span>Girls<\/span><span class=\\\"track\\\"><i class=\\\"g\\\" style=\\\"width:78%\\\"><\/i><\/span><b>78%<\/b><\/div><div class=\\\"hbar\\\"><span>Boys<\/span><span class=\\\"track\\\"><i class=\\\"b\\\" style=\\\"width:64%\\\"><\/i><\/span><b>64%<\/b><\/div><\/div><div class=\\\"grp\\\"><p>9th grade<\/p><div class=\\\"hbar\\\"><span>Girls<\/span><span class=\\\"track\\\"><i class=\\\"g\\\" style=\\\"width:85%\\\"><\/i><\/span><b>85%<\/b><\/div><div class=\\\"hbar\\\"><span>Boys<\/span><span class=\\\"track\\\"><i class=\\\"b\\\" style=\\\"width:72%\\\"><\/i><\/span><b>72%<\/b><\/div><\/div><div class=\\\"axis\\\"><span><\/span><span><span>0%<\/span><span>50%<\/span><span>100%<\/span><\/span><span><\/span><\/div><\/div><p class=\\\"note\\\">These numbers are made up for practice. They aren't real survey results.<\/p>\", \"q\": [{\"q\": \"What percent of 8th-grade girls DO get at least 60 minutes of activity a day?\", \"a\": 22, \"show\": \"22%\", \"why\": \"The chart shows students who do NOT. Subtract from 100: 100 \u2212 78 = 22.\"}, {\"q\": \"If 300 boys are in 7th grade, how many of them get at least 60 minutes of activity a day?\", \"a\": 117, \"show\": \"117\", \"why\": \"61% don't, so 100 \u2212 61 = 39% do. Then 0.39 \u00d7 300 = 117.\"}, {\"q\": \"How many percentage points higher is the bar for 9th-grade girls than the bar for 6th-grade girls?\", \"a\": 19, \"show\": \"19\", \"why\": \"Subtract the smaller number from the bigger one: 85 \u2212 66 = 19. More older girls are inactive.\"}, {\"q\": \"In 8th grade, how many percentage points more boys than girls get enough activity?\", \"a\": 14, \"show\": \"14\", \"why\": \"Boys: 100 \u2212 64 = 36% get enough. Girls: 100 \u2212 78 = 22%. 36 \u2212 22 = 14. The longer bar for girls means fewer girls are active.\"}]};\nconst SHORT=[\n{\"q\": \"Name three ways you could add more physical activity to a normal day without joining a team or going to a gym.\", \"model\": [\"Walk or bike to school or to a friend's house instead of getting a ride. Take the stairs instead of the elevator. Walk the dog, do yard work, or dance while doing chores. Get up and move during breaks instead of sitting for hours.\"], \"check\": [\"Name at least three different activities\", \"Choose everyday activities, not only sports or gym workouts\", \"Bonus: replace something you'd normally do sitting down\"]},\n{\"q\": \"A friend who hasn't been exercising plans to start running 5 miles every day, starting tomorrow. Use FITT and the overload principle to give them better advice.\", \"model\": [\"Start at your current fitness level, like jogging 15 to 20 minutes three days a week (frequency and time) at a pace where you can still talk (intensity). Each week, add a little more time or another day. That's the overload principle: ask your body to do a bit more than it's used to, but increase slowly so you don't get hurt. Warm up before, cool down after, and drink water.\"], \"check\": [\"Use at least two parts of FITT\", \"Explain starting easier and building up gradually (overload)\", \"Include at least one safety tip, such as a warm-up, cooldown, or water\"]},\n{\"q\": \"It's 95\u00b0F and you have soccer practice outside. How would you stay safe, and what should you do if a teammate gets confused or collapses?\", \"model\": [\"Drink water before, during, and after practice, wear light clothing, and take breaks in the shade. Confusion or collapsing in the heat could be heatstroke, which is a medical emergency. Tell the coach right away and call 911. Move them somewhere cool and help cool them down with water or ice packs while you wait for help.\"], \"check\": [\"Give at least two ways to prevent heat illness\", \"Recognize that this could be heatstroke, an emergency\", \"Say to get an adult and call 911\"]}\n];\nconst $=id=>document.getElementById(id);\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst mcOpts=m=>m.last?[...shuffle(m.o),m.a]:shuffle([m.a,...m.o]);\nconst idx=a=>a.map((_,i)=>i);\n\nconst PARTS=[\n {key:'key',name:'Key ideas'},\n {key:'fill',name:'Completion',total:FILL.length},\n {key:'tf',name:'True/False',total:TF.length},\n {key:'mc',name:'Multiple choice',total:MC.length},\n {key:'match',name:'Matching',total:MATCH.length},\n {key:'data',name:'Analyzing data',total:DATA.q.length},\n {key:'short',name:'Short answer',total:SHORT.length},\n {key:'results',name:'Results'}\n];\nconst QPARTS=PARTS.filter(p=>p.total);\nconst DRAW={key:drawKey,fill:drawFill,tf:drawTF,mc:drawMC,match:drawMatch,data:drawData,short:drawShort,results:drawResults};\nlet S,cur=0;\n\nfunction newTest(start){\n  S={\n    fill:{order:shuffle(idx(FILL)),text:{},ans:{}},\n    tf:{order:shuffle(idx(TF)),chosen:{},ans:{}},\n    mc:{order:shuffle(idx(MC)),opts:MC.map(mcOpts),chosen:{},ans:{}},\n    match:{terms:shuffle(idx(MATCH)),defs:shuffle(idx(MATCH)),matched:new Set(),missed:new Set()},\n    data:{order:idx(DATA.q),text:{},ans:{}},\n    short:{order:idx(SHORT),text:{},shown:{},ans:{}}\n  };\n  go(start);\n}\nconst answered=k=>k==='match'?S.match.matched.size:Object.keys(S[k].ans).length;\nconst score=k=>k==='match'?[...S.match.matched].filter(i=>!S.match.missed.has(i)).length:Object.values(S[k].ans).filter(Boolean).length;\n\nfunction drawSteps(){\n  $('steps').innerHTML='';\n  PARTS.forEach((p,i)=>{\n    const b=document.createElement('button');b.type='button';b.className='step'+(i===cur?' on':'');\n    if(i===cur)b.setAttribute('aria-current','step');\n    const sub=p.key==='key'?'Read first':p.key==='results'?'Score':`${answered(p.key)}/${p.total} done`;\n    b.innerHTML=`<b>${esc(p.name)}<\/b><span>${sub}<\/span>`;\n    b.onclick=()=>go(i);\n    $('steps').append(b);\n  });\n}\nfunction go(i){cur=i;drawSteps();DRAW[PARTS[i].key]();window.scrollTo({top:0,behavior:'smooth'})}\nfunction redraw(focusId){\n  const y=window.scrollY;DRAW[PARTS[cur].key]();drawSteps();window.scrollTo(0,y);\n  const f=focusId&&$(focusId);if(f)f.focus({preventScroll:f.tagName!=='INPUT'});\n}\nfunction nextBtn(){\n  const n=PARTS[cur+1],b=document.createElement('button');b.type='button';b.className='btn';\n  b.textContent=cur===0?'Start the practice test':n.key==='results'?'See results':'Next: '+n.name;\n  b.onclick=()=>go(cur+1);return b;\n}\nfunction partShell(title,note){\n  const m=$('main');m.innerHTML='';\n  const s=document.createElement('section');s.className='part';\n  s.innerHTML=`<h2>${title}<\/h2><p class=\"note\">${note}<\/p>`;m.append(s);return s;\n}\nfunction card(k,qi,n,text){\n  const q=document.createElement('div');q.className='q';q.id=`${k}-${qi}`;q.tabIndex=-1;\n  q.innerHTML=`<div class=\"qhead\"><span class=\"qn\">${n}.<\/span><p class=\"qt\">${esc(text)}<\/p><\/div>`;\n  return q;\n}\nfunction fb(q,ok,html){const p=document.createElement('p');p.className='fb '+(ok?'ok':'bad');p.innerHTML=html;q.append(p)}\n\n/* ---------- Key ideas ---------- */\nfunction drawKey(){\n  const s=partShell('Key ideas','Read these first. Spots marked \"Often mixed up\" are worth extra attention.');\n  KEY.forEach(k=>{\n    const c=document.createElement('div');c.className='q key';\n    c.innerHTML=`<h3>${esc(k.h)}${k.star?' <span class=\"tag\">Often mixed up<\/span>':''}<\/h3>${k.p?`<p>${k.p}<\/p>`:''}${k.b?`<ul>${k.b.map(x=>`<li>${x}<\/li>`).join('')}<\/ul>`:''}`;\n    s.append(c);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- typed answers (completion and data) ---------- */\nconst norm=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'');\nfunction typoDist(a,b){\n  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?0:j}\n  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){\n    const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);\n    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);\n  }\n  return d[a.length][b.length];\n}\nconst accepted=it=>[it.a,...(it.alt||[])].map(norm);\nconst isExact=(it,v)=>accepted(it).includes(norm(v));\nconst isWord=(it,v)=>isExact(it,v)||accepted(it).some(c=>typoDist(norm(v),c)<=(c.length>=8?2:c.length>=4?1:0));\nconst numOf=s=>{const m=s.replace(/,/g,'').match(/-?\\d+(\\.\\d+)?/);return m?parseFloat(m[0]):NaN};\nconst isNum=(it,v)=>Math.abs(numOf(v)-it.a)<.01;\n\nfunction typed(k,qi,n,it,isRight,place){\n  const st=S[k],q=card(k,qi,n,it.q),done=qi in st.ans;\n  const r=document.createElement('div');r.className='typed';\n  const inp=document.createElement('input');\n  inp.type='text';inp.id=`inp-${k}-${qi}`;inp.value=st.text[qi]||'';inp.placeholder=place;inp.disabled=done;\n  inp.setAttribute('aria-label',`Your answer to question ${n}`);\n  inp.autocomplete='off';inp.spellcheck=false;\n  inp.setAttribute('autocapitalize','off');inp.setAttribute('autocorrect','off');\n  if(k==='data')inp.inputMode='decimal';\n  r.append(inp);\n  if(!done){\n    const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent='Check';b.disabled=!inp.value.trim();\n    const submit=()=>{\n      const v=inp.value.trim();if(!v)return;\n      st.text[qi]=v;st.ans[qi]=isRight(it,v);\n      const later=st.order.slice(st.order.indexOf(qi)+1).find(i=>!(i in st.ans));\n      redraw(later===undefined?q.id:`inp-${k}-${later}`);\n    };\n    inp.oninput=()=>{st.text[qi]=inp.value;b.disabled=!inp.value.trim()};\n    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit()}};\n    b.onclick=submit;\n    r.append(b);\n  }\n  q.append(r);\n  return q;\n}\n\n/* ---------- Completion ---------- */\nfunction drawFill(){\n  const s=partShell('Completion','Type the word that fills in the blank. Close misspellings still count, and you will see the correct spelling.');\n  S.fill.order.forEach((qi,n)=>{\n    const it=FILL[qi],q=typed('fill',qi,n+1,it,isWord,'Type the word');\n    if(qi in S.fill.ans){\n      const ok=S.fill.ans[qi];\n      fb(q,ok,ok?`<b>Correct.<\/b> ${isExact(it,S.fill.text[qi])?'':`Spelling: <b>${esc(it.a)}<\/b>. `}${esc(it.why)}`:`<b>Not quite.<\/b> The answer is <b>${esc(it.a)}<\/b>. ${esc(it.why)}`);\n    }\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- True/false ---------- */\nfunction drawTF(){\n  const s=partShell('True or false','Remember: if any part of the statement is false, the whole statement is false.');\n  const st=S.tf;\n  st.order.forEach((qi,n)=>{\n    const it=TF[qi],q=card('tf',qi,n+1,it.q),done=qi in st.ans,o=document.createElement('div');o.className='opts row2';\n    [true,false].forEach(val=>{\n      const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=val?'True':'False';\n      if(done){b.disabled=true;if(val===it.a)b.classList.add('right');else if(st.chosen[qi]===val)b.classList.add('no')}\n      b.onclick=()=>{st.ans[qi]=val===it.a;st.chosen[qi]=val;redraw(q.id)};\n      o.append(b);\n    });\n    q.append(o);\n    if(done)fb(q,st.ans[qi],`<b>${st.ans[qi]?'Correct.':'Not quite.'}<\/b> The answer is <b>${it.a?'True':'False'}<\/b>. ${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Multiple choice ---------- */\nfunction drawMC(){\n  const s=partShell('Multiple choice','Choose the best answer.');\n  const st=S.mc;\n  st.order.forEach((qi,n)=>{\n    const it=MC[qi],q=card('mc',qi,n+1,it.q),done=qi in st.ans,o=document.createElement('div');o.className='opts';\n    st.opts[qi].forEach(txt=>{\n      const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=txt;\n      if(done){b.disabled=true;if(txt===it.a)b.classList.add('right');else if(st.chosen[qi]===txt)b.classList.add('no')}\n      b.onclick=()=>{st.ans[qi]=txt===it.a;st.chosen[qi]=txt;redraw(q.id)};\n      o.append(b);\n    });\n    q.append(o);\n    if(done)fb(q,st.ans[qi],`<b>${st.ans[qi]?'Correct.':'Not quite.'}<\/b> ${st.ans[qi]?'':`The answer is <b>${esc(it.a)}<\/b>. `}${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Matching ---------- */\nlet selT=null,selD=null;\nfunction drawMatch(){\n  const m=S.match,s=partShell('Matching','Tap a word, then tap the description it goes with. Your score counts matches you get on the first try.');\n  const box=document.createElement('div');box.className='part';\n  box.innerHTML=`<div class=\"sub\"><div class=\"meter\"><i id=\"mbar\" style=\"width:${m.matched.size/MATCH.length*100}%\"><\/i><\/div><span id=\"mcount\">${m.matched.size} of ${MATCH.length} matched<\/span><\/div>\n   <p class=\"label\">Words<\/p><div class=\"terms\" id=\"terms\"><\/div>\n   <p class=\"label\">Descriptions<\/p><div class=\"defs\" id=\"defs\"><\/div>`;\n  s.append(box);\n  selT=selD=null;\n  m.terms.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='term'+(m.matched.has(i)?' done':'');b.textContent=MATCH[i][0];b.dataset.i=i;b.onclick=()=>pickM('t',b);$('terms').append(b)});\n  m.defs.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='def'+(m.matched.has(i)?' done':'');b.dataset.i=i;\n    if(m.matched.has(i)){const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+MATCH[i][0];b.append(a)}\n    const d=document.createElement('span');d.textContent=MATCH[i][1];b.append(d);b.onclick=()=>pickM('d',b);$('defs').append(b)});\n  s.append(nextBtn());\n}\nfunction pickM(kind,el){\n  if(el.classList.contains('done'))return;\n  if(kind==='t'){if(selT)selT.classList.remove('sel');selT=selT===el?null:el}else{if(selD)selD.classList.remove('sel');selD=selD===el?null:el}\n  if(el===selT||el===selD)el.classList.add('sel');\n  if(selT&&selD){\n    const t=selT,d=selD,m=S.match;t.classList.remove('sel');d.classList.remove('sel');selT=selD=null;\n    if(t.dataset.i===d.dataset.i){\n      m.matched.add(+t.dataset.i);t.classList.add('done');d.classList.add('done');\n      const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+t.textContent;d.prepend(a);\n      $('mbar').style.width=(m.matched.size/MATCH.length*100)+'%';\n      $('mcount').textContent=`${m.matched.size} of ${MATCH.length} matched`;\n      drawSteps();\n    }else{\n      m.missed.add(+t.dataset.i);m.missed.add(+d.dataset.i);\n      [t,d].forEach(e=>{e.classList.add('wrong');setTimeout(()=>e.classList.remove('wrong'),450)});\n    }\n  }\n}\n\n/* ---------- Analyzing data ---------- */\nfunction drawData(){\n  const s=partShell('Analyzing data',DATA.note);\n  const t=document.createElement('div');t.className='part';t.innerHTML=DATA.html;s.append(t);\n  S.data.order.forEach((qi,n)=>{\n    const it=DATA.q[qi],q=typed('data',qi,n+1,it,isNum,'Type the number');\n    if(qi in S.data.ans)fb(q,S.data.ans[qi],`<b>${S.data.ans[qi]?'Correct.':'Not quite.'}<\/b> The answer is <b>${esc(it.show)}<\/b>. ${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Short answer ---------- */\nfunction drawShort(){\n  const s=partShell('Short answer','Write a sentence or two, then compare it with the sample answer and score yourself.');\n  const st=S.short;\n  st.order.forEach((qi,n)=>{\n    const it=SHORT[qi],q=card('short',qi,n+1,it.q),done=qi in st.ans;\n    const ta=document.createElement('textarea');ta.rows=4;ta.value=st.text[qi]||'';ta.disabled=done;\n    ta.setAttribute('aria-label',`Your answer to question ${n+1}`);\n    q.append(ta);\n    if(!st.shown[qi]){\n      const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent='Show sample answer';b.disabled=!ta.value.trim();\n      ta.oninput=()=>{st.text[qi]=ta.value;b.disabled=!ta.value.trim()};\n      b.onclick=()=>{st.shown[qi]=true;redraw(q.id)};\n      q.append(b);\n    }else{\n      ta.oninput=()=>{st.text[qi]=ta.value};\n      const m=document.createElement('div');m.className='model';\n      m.innerHTML=`<p class=\"label\">Sample answer<\/p>${it.model.map(x=>`<p>${esc(x)}<\/p>`).join('')}<p class=\"label\">Did you...<\/p><ul>${it.check.map(x=>`<li>${esc(x)}<\/li>`).join('')}<\/ul>`;\n      q.append(m);\n      if(done)fb(q,st.ans[qi],st.ans[qi]?'<b>Nice work.<\/b> You scored this one as covered.':'<b>Keep practicing.<\/b> Read the sample answer again, then try it in your own words.');\n      else{\n        const r=document.createElement('div');r.className='row';\n        [['I covered these',true,'btn'],['I need more practice',false,'btn ghost']].forEach(([label,val,cls])=>{\n          const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;b.onclick=()=>{st.ans[qi]=val;redraw(q.id)};r.append(b);\n        });\n        q.append(r);\n      }\n    }\n    s.append(q);\n  });\n  s.append(nextBtn());\n}\n\n/* ---------- Results ---------- */\nfunction missedCount(){return QPARTS.reduce((n,p)=>n+(p.key==='match'?S.match.missed.size:Object.values(S[p.key].ans).filter(v=>v===false).length),0)}\nfunction retryMissed(){\n  ['fill','tf','mc','data','short'].forEach(k=>{\n    const st=S[k];\n    Object.keys(st.ans).forEach(i=>{\n      if(st.ans[i]!==false)return;\n      delete st.ans[i];\n      if(st.chosen)delete st.chosen[i];\n      if(st.shown)delete st.shown[i];\n      if(st.text&&k!=='short')delete st.text[i];\n      if(k==='mc')st.opts[i]=mcOpts(MC[i]);\n    });\n  });\n  const m=S.match;[...m.missed].forEach(i=>m.matched.delete(i));m.missed=new Set();\n  go(PARTS.findIndex(p=>p.total&&answered(p.key)<p.total));\n}\nfunction drawResults(){\n  const total=QPARTS.reduce((n,p)=>n+p.total,0),right=QPARTS.reduce((n,p)=>n+score(p.key),0);\n  const unanswered=QPARTS.reduce((n,p)=>n+p.total-answered(p.key),0),miss=missedCount();\n  const s=partShell('Results',unanswered?`${unanswered} question${unanswered>1?'s are':' is'} still unanswered. Unanswered questions count as wrong.`:'Every question answered. Matching counts first-try matches, and you scored the short answers yourself.');\n  const box=document.createElement('div');box.className='part';\n  box.innerHTML=`<div><p class=\"label\">Total score<\/p><div class=\"big\">${right}/${total} <span style=\"font-size:22px;color:var(--muted)\">${Math.round(right/total*100)}%<\/span><\/div><\/div>\n   <div class=\"tally\">${QPARTS.map(p=>`<div><span class=\"label\">${esc(p.name)}<\/span><b>${score(p.key)}/${p.total}<\/b><\/div>`).join('')}<\/div>`;\n  s.append(box);\n  const items=[];\n  FILL.forEach((it,i)=>{if(S.fill.ans[i]===false)items.push(`<li>${esc(it.q)} <b>${esc(it.a)}<\/b><\/li>`)});\n  TF.forEach((it,i)=>{if(S.tf.ans[i]===false)items.push(`<li><b>${it.a?'True':'False'}:<\/b> ${esc(it.q)} ${esc(it.why)}<\/li>`)});\n  MC.forEach((it,i)=>{if(S.mc.ans[i]===false)items.push(`<li>${esc(it.q)} <b>${esc(it.a)}<\/b><\/li>`)});\n  [...S.match.missed].forEach(i=>items.push(`<li><b>${esc(MATCH[i][0])}:<\/b> ${esc(MATCH[i][1])}<\/li>`));\n  DATA.q.forEach((it,i)=>{if(S.data.ans[i]===false)items.push(`<li>${esc(it.q)} <b>${esc(it.show)}<\/b>. ${esc(it.why)}<\/li>`)});\n  SHORT.forEach((it,i)=>{if(S.short.ans[i]===false)items.push(`<li>${esc(it.q)} Reread the sample answer.<\/li>`)});\n  if(items.length){\n    const h=document.createElement('p');h.className='label';h.textContent='Review these';s.append(h);\n    const ul=document.createElement('ul');ul.className='missed';ul.innerHTML=items.join('');s.append(ul);\n  }else if(!unanswered){\n    const p=document.createElement('p');p.textContent=READY;p.style.margin='0';s.append(p);\n  }\n  const r=document.createElement('div');r.className='row';\n  if(miss){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent='Retry missed questions';b.onclick=retryMissed;r.append(b)}\n  const again=document.createElement('button');again.type='button';again.className=miss?'btn ghost':'btn';again.textContent='Retake with new shuffle';again.onclick=()=>newTest(1);r.append(again);\n  s.append(r);\n}\n$('reshuffle').onclick=()=>{newTest(1);const n=$('shufnote');n.textContent='Shuffled. New order loaded.';setTimeout(()=>n.textContent='Starts over with a new random order.',2500)};\nnewTest(0);\n<\/script>\n\n<\/body>\n<\/html>\n"};
const META={ch6:{t:'Ch 6 · Stress',k:'k6'},ch7:{t:'Ch 7 · Mental Health',k:'k7'},ch8:{t:'Ch 8 · Nutrition',k:'k8'},ch9:{t:'Ch 9 · Body Image',k:'k9'},ch10:{t:'Ch 10 · Physical Activity',k:'k10'},ch8r:{t:'Ch 8 Review',k:'k8'},ch9r:{t:'Ch 9 Review',k:'k9'},ch10r:{t:'Ch 10 Review',k:'k10'},unit2:{t:'Unit 2 Practice Test',k:'ku2'}};
const home=document.getElementById('home'),view=document.getElementById('view'),frame=document.getElementById('frame');
function sendTheme(){try{frame.contentWindow&&frame.contentWindow.postMessage({type:'theme',theme:document.documentElement.dataset.theme||''},'*')}catch(e){}}
frame.addEventListener('load',sendTheme);
new MutationObserver(sendTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function openQuiz(q){
  if(!QUIZ[q])return;
  const m=META[q];
  document.getElementById('vtitle').innerHTML=`<span class="dot ${m.k}"></span>`;
  document.getElementById('vtitle').append(m.t);
  frame.srcdoc=QUIZ[q];
  home.hidden=true;view.hidden=false;document.getElementById('back').focus();
  if(location.hash!=='#'+q)location.hash=q;
}
function closeQuiz(){
  view.hidden=true;home.hidden=false;frame.removeAttribute('srcdoc');frame.src='about:blank';
  if(location.hash)history.replaceState?history.replaceState(null,'',location.pathname+location.search):location.hash='';
}
document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>openQuiz(b.dataset.q));
document.getElementById('back').onclick=closeQuiz;
addEventListener('hashchange',()=>{const q=location.hash.slice(1);if(QUIZ[q])openQuiz(q);else if(!view.hidden)closeQuiz()});
const start=location.hash.slice(1);if(QUIZ[start])openQuiz(start);
</script>
