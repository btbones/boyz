-family:var(--display);font-weight:600;font-size:16px;padding:12px 20px;border-radius:10px;border:none;background:var(--accent);color:var(--bg);cursor:pointer}\n.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}\n.row{display:flex;flex-wrap:wrap;gap:10px}\n.results{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}\n.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}\n.missed{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}\n.missed b{font-family:var(--display)}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n.top{display:flex;align-items:center;justify-content:space-between;gap:12px}\n.top .eyebrow{margin:0}\n.btn.sm{padding:8px 14px;font-size:15px;white-space:nowrap}\n.plan{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}\n.plan summary{font-family:var(--display);font-weight:600;cursor:pointer}\n.plan ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}\n.tabs{display:flex;flex-wrap:wrap;gap:8px}\n.tab{font-family:var(--display);font-weight:600;font-size:16px;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}\n.tab:hover{border-color:var(--accent)}\n.tab[aria-selected=\"true\"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}\n.pset select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}\n.pane{display:flex;flex-direction:column;gap:18px}\n.group{display:flex;flex-direction:column;gap:10px}\n.group h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0}\n.tip{margin:0;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:15px}\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-items:start}\n.card{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}\n.card:hover{border-color:var(--accent)}\n.card b{font-family:var(--display);font-size:17px}\n.card .hint{font-size:13px;color:var(--muted)}\n.card .back{display:none;flex-direction:column;gap:8px}\n.card.open{border-color:var(--accent)}\n.card.open .hint{display:none}\n.card.open .back{display:flex}\n.hook{color:var(--accent);font-size:14px}\n.card .hook b{font-family:inherit;font-size:inherit}\n.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}\n.q{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.3;margin:0}\n.sub{color:var(--muted);font-size:14px}\n.opts{display:flex;flex-direction:column;gap:8px}\n.opts .def{font-family:var(--display);font-weight:600}\n.opts .def.miss{background:var(--bad-soft);border-color:var(--bad)}\n.why{margin:0}\n.why b{font-family:var(--display)}\n.answer{font-family:var(--display);font-weight:800;font-size:26px;margin:0;color:var(--accent)}\n\n[hidden]{display:none!important}\nhtml{color-scheme:light}\nbody{margin:0}\n<\/style>\n<script>\naddEventListener('message',e=>{const d=e.data||{};if(d.type==='theme'){if(d.theme)document.documentElement.dataset.theme=d.theme;else delete document.documentElement.dataset.theme}});\n<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <header>\n    <div class=\"top\"><p class=\"eyebrow\">Health \u00b7 Chapter 10 \u00b7 Physical Activity<\/p><button class=\"btn ghost sm\" id=\"mode\" type=\"button\">Study Guide<\/button><\/div>\n    <h1 id=\"title\">Physical Activity Match<\/h1>\n    <p class=\"how\" id=\"how\">Tap a term, then tap the definition it goes with. 32 terms across 3 pages (11, 11, then 10), shuffled fresh every time. Use <b>Shuffle page<\/b> to reorder the current page or <b>Shuffle all<\/b> on page 1 to mix words across pages. Your score counts matches you got on the first try.<\/p>\n  <\/header>\n  <div id=\"match\" style=\"display:flex;flex-direction:column;gap:18px\">\n  <div class=\"status\"><div class=\"meter\"><i id=\"bar\"><\/i><\/div><span id=\"count\">Page 1 of 3<\/span><\/div>\n  <section id=\"game\" style=\"display:flex;flex-direction:column;gap:14px\">\n    <div class=\"row\" id=\"shufallrow\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"shufall\" type=\"button\">Shuffle all<\/button><span class=\"note\" id=\"shufallnote\">Mixes all words across every page and starts over.<\/span><\/div>\n    <p class=\"label\">Terms<\/p>\n    <div class=\"terms\" id=\"terms\"><\/div>\n    <p class=\"label\">Definitions<\/p>\n    <div class=\"defs\" id=\"defs\"><\/div>\n    <div class=\"row\"><button class=\"btn ghost\" id=\"shufpage\" type=\"button\">Shuffle page<\/button><button class=\"btn\" id=\"next\" hidden>Next page<\/button><\/div>\n  <\/section>\n  <section class=\"results\" id=\"results\" hidden><\/section>\n  <\/div>\n  <section id=\"guide\" hidden style=\"display:flex;flex-direction:column;gap:16px\">\n    <p class=\"how\">Learn the 32 words in 5 groups, then practice remembering them without looking. Short sessions on 3 or 4 different days work better than one long session. With 32 words, learn one or two groups at a time. Use the Practice menu to drill just those groups.<\/p>\n    <details class=\"plan\"><summary>4-day study plan<\/summary><ol>\n      <li><b>Day 1:<\/b> Go through the <b>Word cards<\/b>. Explain each word in your own words and say its hook. Then play the match quiz once.<\/li>\n      <li><b>Day 2:<\/b> <b>Say the word.<\/b> Spend your time on the ones you miss.<\/li>\n      <li><b>Day 3:<\/b> <b>Which one?<\/b> Then <b>Say the word<\/b> again.<\/li>\n      <li><b>Day before the test:<\/b> Match quiz with <b>Shuffle all<\/b>, then practice the words you missed.<\/li>\n    <\/ol><\/details>\n    <div class=\"tabs\" role=\"tablist\">\n      <button class=\"tab\" role=\"tab\" id=\"t-cards\" type=\"button\">Word cards<\/button>\n      <button class=\"tab\" role=\"tab\" id=\"t-which\" type=\"button\">Which one?<\/button>\n      <button class=\"tab\" role=\"tab\" id=\"t-say\" type=\"button\">Say the word<\/button>\n    <\/div>\n    <div class=\"row pset\" id=\"psetrow\" style=\"align-items:center\"><label class=\"sub\" for=\"pset\">Practice<\/label><select id=\"pset\"><\/select><\/div>\n    <div class=\"pane\" id=\"p-cards\" role=\"tabpanel\">\n      <div class=\"row\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"allcards\" type=\"button\">Show all definitions<\/button><span class=\"sub\">Or tap one card at a time.<\/span><\/div>\n      <div class=\"pane\" id=\"groups\"><\/div>\n    <\/div>\n    <div class=\"panel\" id=\"p-which\" role=\"tabpanel\" hidden>\n      <p class=\"label\" id=\"wc\"><\/p>\n      <p class=\"q\" id=\"wq\"><\/p>\n      <div class=\"opts\" id=\"wo\"><\/div>\n      <p class=\"why\" id=\"wwhy\" hidden><\/p>\n      <div class=\"row\"><button class=\"btn\" id=\"wnext\" type=\"button\" hidden>Next<\/button><\/div>\n    <\/div>\n    <div class=\"panel\" id=\"p-say\" role=\"tabpanel\" hidden>\n      <p class=\"label\" id=\"sc\"><\/p>\n      <p class=\"q\" id=\"sq\"><\/p>\n      <p class=\"sub\" id=\"shint\">Say the word out loud, then check.<\/p>\n      <div class=\"row\"><button class=\"btn\" id=\"sshow\" type=\"button\">Show answer<\/button><\/div>\n      <div id=\"sans\" hidden style=\"display:flex;flex-direction:column;gap:12px\">\n        <p class=\"answer\" id=\"sterm\"><\/p>\n        <p class=\"hook\" id=\"shook\" style=\"margin:0\"><\/p>\n        <div class=\"row\"><button class=\"btn\" id=\"sok\" type=\"button\">I got it<\/button><button class=\"btn ghost\" id=\"sno\" type=\"button\">Not yet<\/button><\/div>\n      <\/div>\n      <div id=\"send\" hidden style=\"display:flex;flex-direction:column;gap:12px\"><\/div>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\nconst CARDS=[\n[\"Aerobic\", \"Using oxygen to break down energy for use in the muscles\"],\n[\"Agility\", \"Ability to rapidly change the body\u2019s momentum and direction\"],\n[\"Amenorrhea\", \"Abnormal absence of menstrual period\"],\n[\"Anaerobic\", \"Powering the body without the use of oxygen\"],\n[\"Cardiorespiratory fitness\", \"Ability of the cardiovascular and respiratory systems to deliver oxygen and nutrients to muscles and cells\"],\n[\"Concussion\", \"Brain injury that results from a blow or jolt to the head or upper body\"],\n[\"Cooldown\", \"Activity that helps the body wind down after physical activity; helps heart rate return to normal level\"],\n[\"Cross training\", \"Act of participating in various types of physical activity to help improve skill in another type\"],\n[\"Dehydration\", \"Condition in which the body does not have enough fluid to perform basic functions\"],\n[\"Dislocation\", \"Condition in which bones move out of their normal positions\"],\n[\"Endorphins\", \"Brain chemicals that improve mood; released during physical activity\"],\n[\"Endurance\", \"Ability to continue performing a physical activity over time\"],\n[\"Exercise\", \"Physical activity that is structured, planned, and has the purpose of increasing physical fitness\"],\n[\"Female athlete triad\", \"Three health conditions related to intense physical activity in females: disordered eating, amenorrhea, and osteoporosis\"],\n[\"Flexibility\", \"Ability to fully and easily move the joints\"],\n[\"Fracture\", \"Break in a bone\"],\n[\"Frostbite\", \"Condition in which the skin and the body tissues beneath it freeze\"],\n[\"Health-related fitness\", \"Body\u2019s ability to perform daily activities with ease and energy\"],\n[\"Heat cramps\", \"Painful muscle spasms caused by overheating of the body\"],\n[\"Heat exhaustion\", \"Health condition caused by overheating of the body; characterized by nausea, dizziness, weakness, headache, weak pulse, disorientation, and fainting\"],\n[\"Heatstroke\", \"Medical emergency caused by overheating of the body; can lead to shock, coma, and even death\"],\n[\"Hypothermia\", \"Medical emergency in which body temperature is too low; can lead to shock, coma, and death\"],\n[\"Intensity\", \"Amount of energy the body uses per minute during an activity\"],\n[\"Maximum heart rate\", \"Number of heartbeats per minute when the heart is working its hardest\"],\n[\"Physical activity\", \"Any action in which the body uses energy\"],\n[\"Physical Activity Guidelines for Americans\", \"Recommendations published by the US Department of Health and Human Services about how much physical activity children, teens, and adults should get\"],\n[\"Physical fitness\", \"Body\u2019s ability to perform daily activities and meet unexpected demands with energy to spare\"],\n[\"Sedentary behaviors\", \"Activities that consist of sitting or lying down and using very little energy\"],\n[\"Skill-related fitness\", \"Ability to perform successfully in a particular sport or leisure activity\"],\n[\"Sprain\", \"Injury to a ligament\"],\n[\"Target heart rate\", \"Number of heartbeats per minute that is safe and effective for a given intensity\"],\n[\"Warm-up\", \"Activity that prepares the body for physical activity; gets blood pumping to the muscles and stretches muscles\"]\n];\nconst $=id=>document.getElementById(id);\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nlet pool,rounds,r,missed,selTerm,selDef,left,total,matched=new Set();\n\nfunction start(indices){\n  pool=shuffle(indices); total=pool.length; missed=new Set();\n  const n=Math.ceil(total/12); rounds=[]; let k=0; for(let i=0;i<n;i++){const size=Math.floor(total/n)+(i<total%n?1:0); rounds.push(pool.slice(k,k+size)); k+=size;}\n  r=0; $('results').hidden=true; $('game').hidden=false; render();\n}\nfunction render(keep){\n  const ids=rounds[r]; selTerm=selDef=null; if(!keep)matched=new Set(); left=ids.length-matched.size; $('next').hidden=left!==0||r>=rounds.length-1;\n  $('shufallrow').hidden=r!==0;\n  $('count').textContent=`Page ${r+1} of ${rounds.length}`;\n  $('bar').style.width=(rounds.slice(0,r).flat().length/total*100)+'%';\n  $('terms').innerHTML=''; $('defs').innerHTML='';\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='term'+(matched.has(i)?' done':'');b.textContent=CARDS[i][0];b.dataset.i=i;b.onclick=()=>pick('t',b);$('terms').append(b)});\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='def'+(matched.has(i)?' done':'');b.dataset.i=i;b.innerHTML=`<span class=\"d\"><\/span>`;b.querySelector('.d').textContent=CARDS[i][1];\n    if(matched.has(i)){const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+CARDS[i][0];b.prepend(a)}\n    b.onclick=()=>pick('d',b);$('defs').append(b)});\n}\nfunction pick(kind,el){\n  if(el.classList.contains('done'))return;\n  if(kind==='t'){ if(selTerm)selTerm.classList.remove('sel'); selTerm=selTerm===el?null:el; }\n  else { if(selDef)selDef.classList.remove('sel'); selDef=selDef===el?null:el; }\n  if(el===selTerm||el===selDef) el.classList.add('sel');\n  if(selTerm&&selDef) check();\n}\nfunction check(){\n  const t=selTerm,d=selDef; t.classList.remove('sel'); d.classList.remove('sel'); selTerm=selDef=null;\n  if(t.dataset.i===d.dataset.i){\n    matched.add(+t.dataset.i); t.classList.add('done'); d.classList.add('done');\n    const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+t.textContent;d.prepend(a);\n    if(--left===0){\n      $('bar').style.width=(rounds.slice(0,r+1).flat().length/total*100)+'%';\n      if(r<rounds.length-1){$('next').hidden=false;$('next').focus();} else finish();\n    }\n  } else {\n    missed.add(+t.dataset.i); missed.add(+d.dataset.i);\n    [t,d].forEach(e=>{e.classList.add('wrong');setTimeout(()=>e.classList.remove('wrong'),450)});\n  }\n}\nfunction finish(){\n  $('game').hidden=true; const res=$('results'); res.hidden=false;\n  const right=total-missed.size; const pct=Math.round(right/total*100);\n  $('count').textContent='Finished';\n  let html=`<p class=\"label\">First-try score<\/p><div class=\"big\">${right}/${total} <span style=\"font-size:20px;color:var(--muted)\">${pct}%<\/span><\/div>`;\n  if(missed.size){\n    html+=`<p class=\"label\">Review these<\/p><ul class=\"missed\">`+[...missed].map(i=>`<li><b>${CARDS[i][0]}<\/b>: ${CARDS[i][1]}<\/li>`).join('')+`<\/ul>`;\n    html+=`<div class=\"row\"><button class=\"btn\" id=\"retry\">Practice missed (${missed.size})<\/button><button class=\"btn ghost\" id=\"again\">Start over<\/button><\/div>`;\n  } else html+=`<p style=\"margin:0\">Perfect score. You know this chapter.<\/p><div class=\"row\"><button class=\"btn\" id=\"again\">Start over<\/button><\/div>`;\n  res.innerHTML=html;\n  const m=[...missed]; if($('retry'))$('retry').onclick=()=>start(m);\n  $('again').onclick=()=>start(CARDS.map((_,i)=>i));\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n$('next').onclick=()=>{r++;render();window.scrollTo({top:0,behavior:'smooth'})};\n$('shufpage').onclick=()=>{render();$('terms').scrollIntoView({behavior:'smooth',block:'start'})};\n$('shufall').onclick=()=>{start(pool.slice());const n=$('shufallnote');n.textContent='Shuffled. All words have new pages.';setTimeout(()=>n.textContent='Mixes all words across every page and starts over.',2500)};\nstart(CARDS.map((_,i)=>i));\n\n// ---- Study guide ----\nconst MATCH_TITLE=\"Physical Activity Match\",GUIDE_TITLE=\"Physical Activity Study Guide\";\nconst HOOK={\n\"Physical activity\": \"ANY movement that uses energy, even walking the dog or doing chores.\",\n\"Exercise\": \"Activity you PLAN on purpose to get fitter, like a workout or practice.\",\n\"Sedentary behaviors\": \"Latin sedere = to sit. Sitting or lying around and barely moving.\",\n\"Physical Activity Guidelines for Americans\": \"Guidelines = official advice. The US government's advice on how much to move (for teens, 60 minutes a day).\",\n\"Physical fitness\": \"Fit enough for your day, with energy to spare for surprises like sprinting to catch the bus.\",\n\"Health-related fitness\": \"Health = everyday life. Fit enough to get through daily activities with ease.\",\n\"Skill-related fitness\": \"Skill = sports. Being good at a particular sport or game.\",\n\"Cardiorespiratory fitness\": \"Cardio = heart, respiratory = breathing. How well your heart and lungs deliver oxygen.\",\n\"Endurance\": \"Endure = last. How long you can keep going.\",\n\"Flexibility\": \"Flex your joints. How far and easily you can bend and stretch.\",\n\"Agility\": \"Agile like a soccer player cutting left and right. Quick changes of direction.\",\n\"Cross training\": \"Cross over to other activities, like swimming to get better at soccer.\",\n\"Aerobic\": \"Aero = air. Uses oxygen, like a long, steady jog.\",\n\"Anaerobic\": \"An = without. No oxygen, for short all-out bursts like a sprint.\",\n\"Intensity\": \"How HARD you're working: the energy you use each minute.\",\n\"Maximum heart rate\": \"Max = the most. Your heart beating as fast as it can.\",\n\"Target heart rate\": \"Aim for the target: the safe and effective zone, below your max.\",\n\"Warm-up\": \"Warm up your engine BEFORE activity.\",\n\"Cooldown\": \"Cool down AFTER activity so your heart rate drops back to normal.\",\n\"Endorphins\": \"Your brain's own feel-good chemicals, the good mood after a workout.\",\n\"Concussion\": \"Latin concutere = to shake hard. The brain gets shaken by a hit to the head or body.\",\n\"Fracture\": \"Fracture = break, like a fraction is a broken piece of a number.\",\n\"Dislocation\": \"Dis + location: the bone is out of its normal location.\",\n\"Sprain\": \"Sprain = ligament, the tough bands that hold bones together at a joint.\",\n\"Female athlete triad\": \"Tri = three, like a triangle: disordered eating, amenorrhea, and osteoporosis.\",\n\"Amenorrhea\": \"A = without, men = month, rrhea = flow. No monthly period.\",\n\"Dehydration\": \"De = remove, hydro = water. The body is low on water.\",\n\"Heat cramps\": \"First and mildest heat problem: painful muscle cramps.\",\n\"Heat exhaustion\": \"Next step up: exhausted, dizzy, sick to your stomach, maybe fainting.\",\n\"Heatstroke\": \"Worst heat problem: a medical emergency. Call 911.\",\n\"Hypothermia\": \"Hypo = under, therm = heat. Body temperature drops below normal.\",\n\"Frostbite\": \"Frost bites the skin: skin and the tissue under it freeze, often fingers, toes, ears, and nose.\"\n};\nconst GROUPS=[{\"n\": \"Activity and fitness\", \"tip\": \"Physical activity = ANY movement. Exercise = PLANNED to get fitter. Sedentary = sitting still. Health-related fitness = everyday life; skill-related fitness = sports.\", \"w\": [\"Physical activity\", \"Exercise\", \"Sedentary behaviors\", \"Physical Activity Guidelines for Americans\", \"Physical fitness\", \"Health-related fitness\", \"Skill-related fitness\"]}, {\"n\": \"Fitness abilities\", \"tip\": \"Cardiorespiratory = heart + lungs \u00b7 Endurance = keep going \u00b7 Flexibility = bend \u00b7 Agility = change direction fast\", \"w\": [\"Cardiorespiratory fitness\", \"Endurance\", \"Flexibility\", \"Agility\", \"Cross training\"]}, {\"n\": \"How hard you work\", \"tip\": \"Aerobic = with air (oxygen); anaerobic = without. Maximum heart rate = hardest; target heart rate = safe and effective. Warm-up before, cooldown after.\", \"w\": [\"Aerobic\", \"Anaerobic\", \"Intensity\", \"Maximum heart rate\", \"Target heart rate\", \"Warm-up\", \"Cooldown\", \"Endorphins\"]}, {\"n\": \"Injuries and health risks\", \"tip\": \"Fracture = bone breaks \u00b7 Dislocation = bone moves out of place \u00b7 Sprain = ligament \u00b7 Concussion = brain\", \"w\": [\"Concussion\", \"Fracture\", \"Dislocation\", \"Sprain\", \"Female athlete triad\", \"Amenorrhea\"]}, {\"n\": \"Heat, cold, and water\", \"tip\": \"Heat problems get worse in order: cramps \u2192 exhaustion \u2192 heatstroke (emergency). Cold: frostbite = skin freezes; hypothermia = whole body too cold.\", \"w\": [\"Dehydration\", \"Heat cramps\", \"Heat exhaustion\", \"Heatstroke\", \"Frostbite\", \"Hypothermia\"]}];\nconst WHICH=[\n[\"Walking to school and helping clean the garage\", \"Physical activity\", [\"Physical activity\", \"Exercise\", \"Sedentary behaviors\"]],\n[\"Following a planned running workout three days a week to get faster\", \"Exercise\", [\"Physical activity\", \"Exercise\", \"Sedentary behaviors\"]],\n[\"Playing video games on the couch for three hours\", \"Sedentary behaviors\", [\"Physical activity\", \"Exercise\", \"Sedentary behaviors\"]],\n[\"Being able to carry groceries and climb the stairs at home with ease\", \"Health-related fitness\", [\"Physical fitness\", \"Health-related fitness\", \"Skill-related fitness\", \"Physical Activity Guidelines for Americans\"]],\n[\"Being good enough at basketball to make the school team\", \"Skill-related fitness\", [\"Physical fitness\", \"Health-related fitness\", \"Skill-related fitness\", \"Physical Activity Guidelines for Americans\"]],\n[\"After a full day of school, you still have energy to help a neighbor move a couch\", \"Physical fitness\", [\"Physical fitness\", \"Health-related fitness\", \"Skill-related fitness\", \"Physical Activity Guidelines for Americans\"]],\n[\"A government report says teens should get 60 minutes of activity every day\", \"Physical Activity Guidelines for Americans\", [\"Physical fitness\", \"Health-related fitness\", \"Skill-related fitness\", \"Physical Activity Guidelines for Americans\"]],\n[\"Touching your toes and bending easily at the hips and knees\", \"Flexibility\", [\"Cardiorespiratory fitness\", \"Endurance\", \"Flexibility\", \"Agility\"]],\n[\"A soccer player quickly cutting left and right to get past a defender\", \"Agility\", [\"Cardiorespiratory fitness\", \"Endurance\", \"Flexibility\", \"Agility\"]],\n[\"Swimming laps for 30 minutes without needing to stop\", \"Endurance\", [\"Cardiorespiratory fitness\", \"Endurance\", \"Flexibility\", \"Agility\"]],\n[\"How well your heart and lungs get oxygen to your working muscles\", \"Cardiorespiratory fitness\", [\"Cardiorespiratory fitness\", \"Endurance\", \"Flexibility\", \"Agility\"]],\n[\"A soccer player swims and lifts weights in the off-season to get better at soccer\", \"Cross training\", [\"Cross training\", \"Exercise\", \"Agility\"]],\n[\"A long, steady bike ride where you breathe hard but can keep going\", \"Aerobic\", [\"Aerobic\", \"Anaerobic\", \"Intensity\"]],\n[\"A 100-meter sprint at full speed\", \"Anaerobic\", [\"Aerobic\", \"Anaerobic\", \"Intensity\"]],\n[\"Walking uses a little energy each minute; sprinting uses a lot\", \"Intensity\", [\"Aerobic\", \"Anaerobic\", \"Intensity\"]],\n[\"Your heart is beating as fast as it possibly can\", \"Maximum heart rate\", [\"Maximum heart rate\", \"Target heart rate\", \"Intensity\"]],\n[\"The heart-rate zone a coach tells you to stay in so the workout is safe and effective\", \"Target heart rate\", [\"Maximum heart rate\", \"Target heart rate\", \"Intensity\"]],\n[\"Jogging slowly and stretching before the game starts\", \"Warm-up\", [\"Warm-up\", \"Cooldown\", \"Endorphins\"]],\n[\"Walking a lap after the race so your heart rate can slow back down\", \"Cooldown\", [\"Warm-up\", \"Cooldown\", \"Endorphins\"]],\n[\"Feeling happier and calmer after a good workout because of chemicals in your brain\", \"Endorphins\", [\"Warm-up\", \"Cooldown\", \"Endorphins\"]],\n[\"A player takes a hit to the head, then has a headache and feels confused\", \"Concussion\", [\"Concussion\", \"Fracture\", \"Dislocation\", \"Sprain\"]],\n[\"An X-ray shows a crack in the arm bone\", \"Fracture\", [\"Concussion\", \"Fracture\", \"Dislocation\", \"Sprain\"]],\n[\"A shoulder pops out of its socket\", \"Dislocation\", [\"Concussion\", \"Fracture\", \"Dislocation\", \"Sprain\"]],\n[\"Rolling your ankle and injuring the ligament that holds the joint together\", \"Sprain\", [\"Concussion\", \"Fracture\", \"Dislocation\", \"Sprain\"]],\n[\"A female runner who trains very hard stops getting her period\", \"Amenorrhea\", [\"Female athlete triad\", \"Amenorrhea\", \"Dehydration\"]],\n[\"A female athlete has disordered eating, missed periods, and weak bones\", \"Female athlete triad\", [\"Female athlete triad\", \"Amenorrhea\", \"Dehydration\"]],\n[\"Very thirsty with a dry mouth after practice on a hot day without drinking water\", \"Dehydration\", [\"Dehydration\", \"Heat cramps\", \"Heat exhaustion\", \"Heatstroke\"]],\n[\"Painful muscle spasms in your legs while running in the heat\", \"Heat cramps\", [\"Dehydration\", \"Heat cramps\", \"Heat exhaustion\", \"Heatstroke\"]],\n[\"Feeling dizzy, weak, sick to your stomach, and close to fainting after playing in the heat\", \"Heat exhaustion\", [\"Dehydration\", \"Heat cramps\", \"Heat exhaustion\", \"Heatstroke\"]],\n[\"The body overheats so badly it's an emergency that can lead to shock or coma\", \"Heatstroke\", [\"Dehydration\", \"Heat cramps\", \"Heat exhaustion\", \"Heatstroke\"]],\n[\"After falling into icy water, the whole body's temperature drops dangerously low\", \"Hypothermia\", [\"Hypothermia\", \"Frostbite\", \"Heatstroke\"]],\n[\"Fingers turn white and numb because the skin froze while skiing\", \"Frostbite\", [\"Hypothermia\", \"Frostbite\", \"Heatstroke\"]]\n];\nconst DEF=Object.fromEntries(CARDS);\nconst setHook=(el,w)=>{el.innerHTML='<b>Hook:<\/b> ';el.append(HOOK[w])};\n\nlet guide=false;\n$('mode').onclick=()=>{\n  guide=!guide;\n  $('match').hidden=guide; $('how').hidden=guide; $('guide').hidden=!guide;\n  $('title').textContent=guide?GUIDE_TITLE:MATCH_TITLE;\n  $('mode').textContent=guide?'Match quiz':'Study Guide';\n  window.scrollTo({top:0});\n};\n\nfunction tab(name){\n  ['cards','which','say'].forEach(x=>{$('t-'+x).setAttribute('aria-selected',x===name);$('p-'+x).hidden=x!==name});\n  $('psetrow').hidden=name==='cards';\n}\n['cards','which','say'].forEach(x=>$('t-'+x).onclick=()=>tab(x));\ntab('cards');\n\nGROUPS.forEach(g=>{\n  const s=document.createElement('section');s.className='group';\n  const h=document.createElement('h2');h.textContent=g.n;s.append(h);\n  if(g.tip){const p=document.createElement('p');p.className='tip';p.textContent=g.tip;s.append(p)}\n  const c=document.createElement('div');c.className='cards';s.append(c);\n  g.w.forEach(w=>{\n    const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-expanded','false');\n    b.innerHTML='<b><\/b><span class=\"hint\">Tap to see the definition<\/span><span class=\"back\"><span class=\"d\"><\/span><span class=\"hook\"><\/span><\/span>';\n    b.querySelector('b').textContent=w;b.querySelector('.d').textContent=DEF[w];setHook(b.querySelector('.hook'),w);\n    b.onclick=()=>b.setAttribute('aria-expanded',b.classList.toggle('open'));\n    c.append(b);\n  });\n  $('groups').append(s);\n});\n$('allcards').onclick=()=>{\n  const open=$('allcards').textContent.startsWith('Show');\n  document.querySelectorAll('.card').forEach(b=>{b.classList.toggle('open',open);b.setAttribute('aria-expanded',open)});\n  $('allcards').textContent=open?'Hide all definitions':'Show all definitions';\n};\n\n// Practice set: all words or one group, shared by Which one? and Say the word\nconst SETS=[{n:`All ${CARDS.length} words`,w:CARDS.map(c=>c[0])},...GROUPS.map(g=>({n:`${g.n} (${g.w.length})`,w:g.w}))];\nSETS.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.n;$('pset').append(o)});\nlet cur=SETS[0].w;\n$('pset').onchange=()=>{cur=SETS[$('pset').value].w;whichStart();sayStart()};\n\nconst WHICH_ROUND=15;\nlet wq,wi,wright,wanswered;\nfunction whichStart(){wq=shuffle(WHICH.filter(x=>cur.includes(x[1]))).slice(0,WHICH_ROUND);wi=0;wright=0;whichShow()}\nfunction whichShow(){\n  wanswered=false; $('wwhy').hidden=true; $('wnext').hidden=true; $('wo').innerHTML='';\n  if(wi>=wq.length){\n    $('wc').textContent='Finished';\n    $('wq').textContent=`You got ${wright} of ${wq.length} on the first try.`;\n    $('wnext').textContent=WHICH.filter(x=>cur.includes(x[1])).length>WHICH_ROUND?'New questions':'Try again'; $('wnext').hidden=false; return;\n  }\n  const [q,a,opts]=wq[wi];\n  $('wc').textContent=`Question ${wi+1} of ${wq.length} \u00b7 Which word fits?`;\n  $('wq').textContent=q;\n  shuffle([a,...shuffle(opts.filter(o=>o!==a)).slice(0,3)]).forEach(o=>{\n    const b=document.createElement('button');b.type='button';b.className='def';b.textContent=o;\n    b.onclick=()=>whichPick(b,o);$('wo').append(b);\n  });\n}\nfunction whichPick(b,o){\n  if(wanswered)return; wanswered=true;\n  const a=wq[wi][1];\n  if(o===a){wright++;b.classList.add('done')}\n  else{b.classList.add('miss');[...$('wo').children].find(x=>x.textContent===a).classList.add('done')}\n  $('wwhy').innerHTML='<b><\/b> ';$('wwhy').querySelector('b').textContent=(o===a?'Right! ':'It\u2019s ')+a+'.';$('wwhy').append(HOOK[a]);$('wwhy').hidden=false;\n  $('wnext').textContent=wi<wq.length-1?'Next':'See score'; $('wnext').hidden=false; $('wnext').focus();\n}\n$('wnext').onclick=()=>{if(wi>=wq.length)whichStart();else{wi++;whichShow()}};\nwhichStart();\n\nlet sq,smissed,sknown,stotal;\nfunction sayStart(){sq=shuffle(CARDS.map((_,i)=>i).filter(i=>cur.includes(CARDS[i][0])));stotal=sq.length;smissed=new Set();sknown=0;$('send').hidden=true;sayShow()}\nfunction sayShow(){\n  $('sans').hidden=true;\n  const end=!sq.length;\n  ['sq','shint','sshow'].forEach(id=>$(id).hidden=end);\n  $('sc').textContent=end?'Finished':`${sknown} of ${stotal} known \u00b7 What's the word?`;\n  if(end){\n    const right=stotal-smissed.size;\n    let html=`<p class=\"q\">First-try score: ${right}/${stotal}<\/p>`;\n    if(smissed.size)html+=`<p class=\"label\">Keep practicing these<\/p><ul class=\"missed\">`+[...smissed].map(i=>`<li><b>${CARDS[i][0]}<\/b>: ${HOOK[CARDS[i][0]]}<\/li>`).join('')+`<\/ul>`;\n    html+=`<div class=\"row\"><button class=\"btn\" id=\"sagain\" type=\"button\">Go again<\/button><\/div>`;\n    $('send').innerHTML=html;$('send').hidden=false;$('sagain').onclick=sayStart;return;\n  }\n  $('sq').textContent=CARDS[sq[0]][1];\n}\n$('sshow').onclick=()=>{\n  const w=CARDS[sq[0]][0];$('sterm').textContent=w;setHook($('shook'),w);\n  $('sshow').hidden=true;$('shint').hidden=true;$('sans').hidden=false;$('sok').focus();\n};\n$('sok').onclick=()=>{sq.shift();sknown++;sayShow()};\n$('sno').onclick=()=>{const i=sq.shift();smissed.add(i);sq.splice(Math.min(3,sq.length),0,i);sayShow()};\nsayStart();\n<\/script>\n\n<\/body>\n<\/html>\n", "unit2": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Unit 2 Health Test<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\">\n<style>\n:root{\n  --bg:#F2EFF3; --surface:#FFFFFF; --ink:#24192A; --muted:#66586C; --line:#DDD3E0;\n  --accent:#73367A; --accent-soft:#EEDFF0; --good:#2E7D4F; --good-soft:#DDF0E3;\n  --bad:#B3412E; --bad-soft:#F6DFDA;\n  --display:\"Bricolage Grotesque\", \"Segoe UI\", system-ui, sans-serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    color-scheme:dark;\n    --bg:#17111A; --surface:#211A25; --ink:#EEE6F0; --muted:#A797AD; --line:#3A2F40;\n    --accent:#D49ADB; --accent-soft:#3A2440; --good:#5BC486; --good-soft:#163527;\n    --bad:#F08A76; --bad-soft:#3E211C;\n  }\n}\n:root[data-theme=\"dark\"]{\n  color-scheme:dark;\n  --bg:#17111A; --surface:#211A25; --ink:#EEE6F0; --muted:#A797AD; --line:#3A2F40;\n  --accent:#D49ADB; --accent-soft:#3A2440; --good:#5BC486; --good-soft:#163527;\n  --bad:#F08A76; --bad-soft:#3E211C;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}\n.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}\nheader{display:flex;flex-direction:column;gap:6px}\n.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0}\nh1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}\nh2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;text-wrap:balance}\n.how{color:var(--muted);margin:0;max-width:62ch}\n.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}\n.step{font:inherit;font-size:13px;text-align:left;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}\n.step b{font-family:var(--display);font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.step span{font-variant-numeric:tabular-nums}\n.step.on{border-color:var(--accent);background:var(--accent-soft)}\n@media (max-width:560px){.step b{font-size:12px}.step{padding:6px 7px;font-size:11px}}\n.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}\n.part{display:flex;flex-direction:column;gap:14px}\n.sub{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}\n.meter{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}\n.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}\n.sub span{font-size:14px;color:var(--muted);white-space:nowrap}\n.terms{display:flex;flex-wrap:wrap;gap:8px}\n.term{font-family:var(--display);font-weight:600;font-size:16px;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}\n.term:hover,.def:hover,.opt:hover:not(:disabled){border-color:var(--accent)}\n.defs{display:flex;flex-direction:column;gap:10px}\n.def{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}\n.def .ans{font-family:var(--display);font-weight:600;font-size:14px;color:var(--good)}\n.sel{background:var(--accent-soft)!important;border-color:var(--accent)!important}\n.done{background:var(--good-soft);border-color:var(--good);cursor:default}\n.term.done{color:var(--good)}\n.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;animation:shake .35s}\n@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\n.q{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}\n.qhead{display:flex;gap:10px;align-items:baseline}\n.qn{font-family:var(--display);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}\n.qt{margin:0;font-weight:700}\n.pg{font-size:13px;color:var(--muted);font-weight:400;white-space:nowrap}\n.opts{display:flex;flex-direction:column;gap:8px}\n.opts.row2{flex-direction:row;flex-wrap:wrap}\n.opt{font:inherit;text-align:left;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}\n.opts.row2 .opt{flex:1;min-width:120px;justify-content:center;font-family:var(--display);font-weight:600}\n.opt .box{flex:none;width:18px;height:18px;margin-top:2px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;line-height:1}\n.opt.sel .box{background:var(--accent);border-color:var(--accent);color:var(--surface)}\n.opt:disabled{cursor:default}\n.opt.right{background:var(--good-soft);border-color:var(--good)}\n.opt.miss{background:var(--surface);border-color:var(--good);border-style:dashed}\n.opt.no{background:var(--bad-soft);border-color:var(--bad)}\n.fb{margin:0;padding:10px 12px;border-radius:10px;font-size:15px}\n.fb.ok{background:var(--good-soft)}\n.fb.bad{background:var(--bad-soft)}\n.fb b{font-family:var(--display)}\n.note{font-size:14px;color:var(--muted);margin:0}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.btn{font-family:var(--display);font-weight:600;font-size:16px;padding:11px 18px;border-radius:10px;border:none;background:var(--accent);color:var(--surface);cursor:pointer;align-self:flex-start}\n.btn:disabled{opacity:.45;cursor:default}\n.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}\n.row{display:flex;flex-wrap:wrap;gap:10px}\n.big{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}\n.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.tally div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}\n.tally b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}\n.missed{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}\n.missed b{font-family:var(--display)}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n[hidden]{display:none!important}\nhtml{color-scheme:light}\nbody{margin:0}\n<\/style>\n<script>\naddEventListener('message',e=>{const d=e.data||{};if(d.type==='theme'){if(d.theme)document.documentElement.dataset.theme=d.theme;else delete document.documentElement.dataset.theme}});\n<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <header>\n    <p class=\"eyebrow\">Health \u00b7 Unit 2 Test Review<\/p>\n    <h1>Unit 2 Practice Test<\/h1>\n    <p class=\"how\">Four parts: vocabulary matching, true or false, multiple choice, and select-all-that-apply. Each answer is checked right away, with the textbook page to review. Questions and choices reshuffle every time you retake it.<\/p>\n  <\/header>\n  <div class=\"row\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"reshuffle\" type=\"button\">Shuffle questions and answers<\/button><span class=\"note\" id=\"shufnote\">Starts over with a new random order.<\/span><\/div>\n  <nav class=\"steps\" id=\"steps\"><\/nav>\n  <main id=\"main\"><\/main>\n<\/div>\n\n<script>\nconst VOCAB=[\n[\"Rumination\",\"Repeatedly dwelling on the same negative thoughts, problems, or feelings\"],\n[\"Self-compassion\",\"Treating yourself with kindness and understanding when you fail, make mistakes, or are struggling\"],\n[\"Resilience\",\"Ability to recover, adapt, and bounce back after difficult events or adversity\"],\n[\"Empathy\",\"Ability to understand and share the feelings of another person\"],\n[\"Burnout\",\"State of emotional, physical, and mental exhaustion caused by prolonged stress\"],\n[\"Self-respect\",\"Valuing yourself and believing you deserve to be treated with dignity, including by yourself\"],\n[\"Relaxation response\",\"Physiological reaction in which the body returns to its resting state after a stressful event\"],\n[\"Emotional empathy\",\"Ability to actually feel or share the emotions another person is experiencing\"],\n[\"Core values\",\"Deeply held beliefs about what is most important, which guide a person's decisions and behavior\"],\n[\"Self-talk\",\"The inner voice and messages you tell yourself, which can be positive or negative\"],\n[\"Body scan\",\"Relaxation technique of paying careful attention to the body, finding signs of tension, and releasing that tension\"],\n[\"Biological sex\",\"Classification as male or female based on physical traits such as chromosomes, hormones, and reproductive organs\"],\n[\"Cognitive empathy\",\"Ability to understand another person's point of view and know what they are thinking or feeling\"],\n[\"Tolerance\",\"Body's need for an increased amount of a substance to experience the effects once felt with smaller amounts\"],\n[\"Toxic stress\",\"Stress from repeated, long-lasting exposure to severe stressors such as neglect, abuse, violence, or loss of a loved one\"],\n[\"Diversity\",\"The differences among people, such as culture, race, ethnicity, religion, abilities, and beliefs\"],\n[\"Outlook\",\"A person's general attitude or way of viewing life and the future\"]\n];\n\nconst TF_ALL=[\n{f:{q:\"People with healthy self-esteem often worry about what other people think of them.\",\n    why:\"People with healthy self-esteem feel secure in who they are, so they don't constantly worry about others' opinions.\"},\n t:{q:\"People with healthy self-esteem do not spend a lot of time worrying about what other people think of them.\",\n    why:\"Healthy self-esteem means feeling secure in who you are, so others' opinions don't control you.\"}},\n{f:{q:\"People with low emotional intelligence control their feelings and impulses and act with thought and integrity.\",\n    why:\"That describes people with high emotional intelligence. Low emotional intelligence makes feelings and impulses harder to control.\"},\n t:{q:\"People with high emotional intelligence control their feelings and impulses and act with thought and integrity.\",\n    why:\"Controlling feelings and impulses and acting with thought and integrity are signs of high emotional intelligence.\"}},\n{f:{q:\"Feeling happy is easier for people who do not have a mental illness because happiness means you have only positive emotions all the time.\",\n    why:\"Happiness does not mean having only positive emotions. Everyone feels negative emotions sometimes, and people with mental illnesses can also experience happiness.\"},\n t:{q:\"Happiness does not mean having only positive emotions all the time, and people with a mental illness can also experience happiness.\",\n    why:\"Everyone feels negative emotions sometimes. Being happy doesn't require only positive emotions, and people with mental illnesses can feel happy too.\"}},\n{f:{q:\"Experiencing adversity decreases a person's resilience, making it harder to recover from future difficult events.\",\n    why:\"Working through adversity often builds resilience, making it easier to recover from future difficult events.\"},\n t:{q:\"Experiencing adversity can increase a person's resilience, making it easier to recover from future difficult events.\",\n    why:\"Working through hard times builds resilience, which helps people recover from later difficulties.\"}},\n{f:{q:\"If a person confides in you about considering suicide, or if you think someone is considering suicide, you should keep it secret.\",\n    why:\"Never keep it secret. Tell a trusted adult right away. You can also call or text 988, the Suicide & Crisis Lifeline.\"},\n t:{q:\"If a person confides in you about considering suicide, or if you think someone is considering suicide, you should tell a trusted adult right away instead of keeping it secret.\",\n    why:\"Getting help quickly matters more than keeping a secret. You can also call or text 988, the Suicide & Crisis Lifeline.\"}}\n];\nlet TF=[];\nfunction pickTF(){\n  const idx=shuffle(TF_ALL.map((_,i)=>i)), nTrue=2+Math.floor(Math.random()*2), tset=new Set(idx.slice(0,nTrue));\n  TF=TF_ALL.map((x,i)=>tset.has(i)?{q:x.t.q,a:true,why:x.t.why}:{q:x.f.q,a:false,why:x.f.why});\n}\n\nconst MC=[\n{\"q\":\"Which personality disorder involves an exaggerated sense of one's own importance, a deep need for excessive attention, and a lack of empathy?\",\"pg\":217,\"a\":\"Narcissistic personality disorder\",\"o\":[\"Borderline personality disorder\",\"Paranoid personality disorder\",\"Obsessive-compulsive personality disorder\",\"Antisocial personality disorder\",\"Schizoid personality disorder\"],\"why\":\"An exaggerated sense of importance, a need for excessive attention, and a lack of empathy define narcissistic personality disorder.\"},\n{\"q\":\"Which stage of the Mental Health Continuum are you in if you are experiencing sadness and low energy?\",\"pg\":104,\"a\":\"Reacting\",\"o\":[\"Healthy\",\"Ill\",\"Injured\"],\"why\":\"The continuum goes Healthy \u2192 Reacting \u2192 Injured \u2192 Ill. Sadness and low energy are signs of the Reacting stage.\"},\n{\"q\":\"Which defense mechanism is the transfer of feelings to another person or object?\",\"pg\":130,\"a\":\"Displacement\",\"o\":[\"Reaction formation\",\"Projection\",\"Intellectualization\",\"Denial\",\"Rationalization\",\"Regression\",\"Repression\"],\"why\":\"Displacement moves feelings onto another person or object, like yelling at a sibling when you're actually angry at a coach.\"},\n{\"q\":\"Are your responses to different stressors in or out of your field of control?\",\"pg\":151,\"a\":\"In your field of control\",\"o\":[\"Out of your field of control\"],\"why\":\"You can't always control the stressor, but your response to it is in your control.\"},\n{\"q\":\"In Maslow's Hierarchy of Human Needs, which needs must be met before anything else?\",\"pg\":107,\"a\":\"Physical needs\",\"o\":[\"Self-actualization\",\"Love and acceptance needs\",\"Security needs\",\"Esteem needs\"],\"why\":\"The order is physical needs \u2192 security \u2192 love and acceptance \u2192 esteem \u2192 self-actualization. Physical needs come first.\"},\n{\"q\":\"Is \\\"Change is impossible\\\" a good example of positive self-talk?\",\"pg\":196,\"a\":\"No\",\"o\":[\"Yes\"],\"why\":\"\\\"Change is impossible\\\" is negative self-talk.\"},\n{\"q\":\"Do people with resilience have negative or positive views of themselves?\",\"pg\":165,\"a\":\"Positive views of themselves\",\"o\":[\"Negative views of themselves\"],\"why\":\"Resilient people have positive views of themselves and confidence in their strengths and abilities.\"},\n{\"q\":\"What is the order of the 5 stages of grief?\",\"pg\":238,\"a\":\"Denial \u2192 Anger \u2192 Bargaining \u2192 Depression \u2192 Acceptance\",\"o\":[\"Denial \u2192 Bargaining \u2192 Anger \u2192 Acceptance \u2192 Depression\",\"Anger \u2192 Denial \u2192 Depression \u2192 Bargaining \u2192 Acceptance\",\"Depression \u2192 Denial \u2192 Anger \u2192 Bargaining \u2192 Acceptance\"],\"why\":\"Memory trick: DABDA (Denial, Anger, Bargaining, Depression, Acceptance). Likely to be on the test.\"},\n{\"q\":\"In which stage of grief do people often feel out of control and helpless in the face of death?\",\"pg\":238,\"a\":\"Bargaining\",\"o\":[\"Denial\",\"Depression\",\"Anger\",\"Acceptance\"],\"why\":\"In bargaining, people feel out of control and helpless and try to regain control.\"},\n{\"q\":\"Which illness involves difficulty paying attention, overly active behavior, and impulsiveness?\",\"pg\":214,\"a\":\"ADHD (attention-deficit/hyperactivity disorder)\",\"o\":[\"Autism spectrum disorder\",\"Obsessive-compulsive disorder (OCD)\",\"Bipolar disorder\"],\"why\":\"Trouble paying attention, overly active behavior, and impulsiveness are the signs of ADHD.\"}\n];\n\nconst MULTI=[\n{\"q\":\"Which are impacts that stress has on the cardiovascular system?\",\"pg\":186,\"a\":[\"Heart rate and blood pressure increase\",\"Chronic wear and tear increases the risk of heart attack, stroke, and other cardiovascular diseases\",\"Fatty deposits and glucose build up on blood vessel walls over time, narrowing them\",\"The heart must work harder to pump blood\"],\"o\":[\"Blood vessels permanently widen\",\"Heart rate and blood pressure decrease\"],\"why\":\"If stress is resolved, the body should relax and return to normal. Chronic stress causes lasting damage.\"},\n{\"q\":\"Which are healthy, positive ways to accept and express your emotions?\",\"pg\":133,\"a\":[\"Documenting a positive moment\",\"Crying\",\"Sharing with friends, family, or a trusted adult\",\"Doing an activity you enjoy\",\"Finding a reason to laugh\",\"Taking a walk or run\",\"Taking a long bath or shower\",\"Writing in a journal\"],\"o\":[\"Lashing out at others\",\"Bottling feelings up so no one sees them\"],\"why\":\"The book also lists reducing stress. Healthy expression lets feelings out without hurting yourself or others.\"},\n{\"q\":\"Which are tendencies of teens who focus on finding meaning and purpose in life?\",\"pg\":145,\"a\":[\"Hold beliefs in causes or ideas bigger than themselves\",\"Learn from failure, which teaches resilience and persistence\",\"Find inspiring mentors, such as parents, teachers, and coaches\",\"Spend time in the community through a part-time job, volunteering, or causes\",\"Work with other people instead of competing against them\",\"Do what they love instead of what they think others want them to do\"],\"o\":[\"Avoid failure at all costs\",\"Do whatever others expect of them\"],\"why\":\"Teens focused on purpose follow what they love, collaborate, find mentors, get involved, learn from failure, and believe in something bigger than themselves.\"},\n{\"q\":\"Which describe a positive environment that can build self-esteem?\",\"pg\":125,\"a\":[\"Being supported for your successes\",\"Being supported when situations don't go your way\"],\"o\":[\"Being criticized for any shortcomings\",\"Being held to impossibly high standards\"],\"why\":\"In a positive environment, people are supported both when they succeed and when things go wrong.\"},\n{\"q\":\"Which are characteristics of a person who has a \\\"sense of balance\\\"?\",\"pg\":103,\"a\":[\"Feels comfortable spending time alone\",\"Enjoys spending time with others\"],\"o\":[\"Avoids being alone whenever possible\",\"Avoids spending time with others\"],\"why\":\"A person with a sense of balance enjoys time with others and is also comfortable alone.\"},\n{\"q\":\"Which are healthy practices for self-compassion?\",\"pg\":168,\"a\":[\"Treat yourself the way you would treat a close friend or sibling\",\"Remind yourself that your experiences are normal, human experiences\",\"Be mindful of negative self-talk\"],\"o\":[\"Assume no one else has ever struggled the way you do\",\"Criticize yourself harshly so you'll do better\"],\"why\":\"Self-compassion means kindness toward yourself, watching your self-talk, and remembering that everyone struggles.\"},\n{\"q\":\"Which are examples of how stigma affects people with mental illness?\",\"pg\":228,\"a\":[\"They feel shame and embarrassment\",\"They deny they have a condition\"],\"o\":[\"They talk openly about their condition\",\"They feel more comfortable seeking treatment\"],\"why\":\"Stigma can lead people to deny their condition or feel ashamed and embarrassed, which keeps them from getting help.\"},\n{\"q\":\"Which are characteristics of people with empathy?\",\"pg\":162,\"a\":[\"Acknowledge how others feel instead of brushing off their concerns\",\"Imitate people's behavior to build a connection, such as matching eye contact\",\"Give emotional support and reassurance\",\"Stay with people during challenges instead of rushing to find solutions\",\"Avoid judging and blaming people for their struggles\",\"Show care and concern about other people's feelings\",\"Put themselves in other people's shoes and see the world from their perspective\",\"Ask questions to clarify what others are experiencing\"],\"o\":[\"Dismiss feelings that seem overblown\",\"Rush to fix the problem so the conversation can end\"],\"why\":\"People with empathy can take another person's perspective and even feel the same emotions.\"},\n{\"q\":\"Which describe a negative environment that can harm self-esteem?\",\"pg\":125,\"a\":[\"Being criticized for any shortcomings\",\"Being held to impossibly high standards\",\"Being blamed for failures and disappointments\"],\"o\":[\"Being supported when situations don't go your way\",\"Being supported for your successes\"],\"why\":\"Negative environments criticize shortcomings, blame people for failures, and set impossibly high standards.\"},\n{\"q\":\"Which are benefits of happiness?\",\"pg\":143,\"a\":[\"Reduced risk of health conditions\",\"Lower levels of stress and anxiety\",\"Better mental and emotional health\",\"Better health habits\",\"Longer life\",\"Faster recovery from health conditions\",\"Stronger support system\"],\"o\":[\"Never getting sick\",\"Never feeling sadness again\"],\"why\":\"Happiness brings many health benefits, but it does not remove negative emotions or illness entirely.\"}\n];\n\nconst $=id=>document.getElementById(id);\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst esc=s=>s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n\nconst PARTS=[\n {key:'vocab',name:'Vocabulary',total:VOCAB.length},\n {key:'tf',name:'True/False',total:TF.length},\n {key:'mc',name:'Multiple choice',total:MC.length},\n {key:'multi',name:'Select all',total:MULTI.length},\n {key:'results',name:'Results'}\n];\nlet S, cur=0;\n\nfunction newTest(){\n  pickTF();\n  S={\n    vocab:{order:null,page:0,missed:new Set(),done:0,finished:false},\n    tf:{order:shuffle(TF.map((_,i)=>i)),ans:{}},\n    mc:{order:shuffle(MC.map((_,i)=>i)),opts:MC.map(m=>shuffle([m.a,...m.o])),ans:{}},\n    multi:{order:shuffle(MULTI.map((_,i)=>i)),opts:MULTI.map(m=>shuffle([...m.a,...m.o])),pick:{},ans:{}}\n  };\n  const p=shuffle(VOCAB.map((_,i)=>i)); S.vocab.order=[p.slice(0,9),p.slice(9)];\n  go(0);\n}\nfunction partScore(k){\n  if(k==='vocab'){const v=S.vocab;return {done:v.done,right:v.done-[...v.missed].filter(i=>v.matched?.has(i)).length,total:VOCAB.length}}\n  const st=S[k];const vals=Object.values(st.ans);return {done:vals.length,right:vals.filter(Boolean).length,total:PARTS.find(p=>p.key===k).total};\n}\nfunction vocabRight(){return VOCAB.length-S.vocab.missed.size}\nfunction drawSteps(){\n  $('steps').innerHTML='';\n  PARTS.forEach((p,i)=>{\n    const b=document.createElement('button');b.className='step'+(i===cur?' on':'');\n    let sub='';\n    if(p.key==='results') sub='Score';\n    else if(p.key==='vocab') sub=`${S.vocab.done}/${p.total} done`;\n    else sub=`${Object.keys(S[p.key].ans).length}/${p.total} done`;\n    b.innerHTML=`<b>${esc(p.name)}<\/b><span>${sub}<\/span>`;\n    b.onclick=()=>go(i);\n    $('steps').append(b);\n  });\n}\nfunction go(i){cur=i;drawSteps();const k=PARTS[i].key;\n  ({vocab:drawVocab,tf:drawTF,mc:drawMC,multi:drawMulti,results:drawResults})[k]();\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction nextBtn(label){const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=()=>go(cur+1);return b}\n\n/* ---------- Part 1: matching ---------- */\nlet selT=null,selD=null;\nfunction drawVocab(){\n  const v=S.vocab, ids=v.order[v.page];\n  const m=$('main'); m.innerHTML='';\n  const part=document.createElement('section');part.className='part';\n  part.innerHTML=`<h2>Part 1: Vocabulary matching<\/h2>\n   <p class=\"note\">Tap a term, then tap its definition. Page ${v.page+1} of 2 (${v.order[0].length} terms, then ${v.order[1].length}).<\/p>\n   <div class=\"sub\"><div class=\"meter\"><i style=\"width:${v.done/VOCAB.length*100}%\"><\/i><\/div><span>${v.done} of ${VOCAB.length} matched<\/span><\/div>\n   <p class=\"label\">Terms<\/p><div class=\"terms\" id=\"terms\"><\/div>\n   <p class=\"label\">Definitions<\/p><div class=\"defs\" id=\"defs\"><\/div>\n   <div class=\"row\" id=\"vnav\"><\/div>`;\n  m.append(part);\n  v.matched=v.matched||new Set();\n  selT=selD=null;\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='term'+(v.matched.has(i)?' done':'');b.textContent=VOCAB[i][0];b.dataset.i=i;b.onclick=()=>pickV('t',b);$('terms').append(b)});\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='def'+(v.matched.has(i)?' done':'');b.dataset.i=i;\n    if(v.matched.has(i)){const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+VOCAB[i][0];b.append(a)}\n    const d=document.createElement('span');d.textContent=VOCAB[i][1];b.append(d);b.onclick=()=>pickV('d',b);$('defs').append(b)});\n  vnav();\n}\nfunction vnav(){\n  const v=S.vocab,n=$('vnav');n.innerHTML='';\n  const pageDone=v.order[v.page].every(i=>v.matched.has(i));\n  if(v.page===0){const b=document.createElement('button');b.className='btn';b.textContent='Next page';b.disabled=!pageDone;b.onclick=()=>{v.page=1;drawVocab();window.scrollTo({top:0,behavior:'smooth'})};n.append(b)}\n  else{\n    const back=document.createElement('button');back.className='btn ghost';back.textContent='Previous page';back.onclick=()=>{v.page=0;drawVocab()};n.append(back);\n    const b=nextBtn('Go to Part 2');b.disabled=!pageDone;n.append(b);\n  }\n}\nfunction pickV(kind,el){\n  if(el.classList.contains('done'))return;\n  if(kind==='t'){if(selT)selT.classList.remove('sel');selT=selT===el?null:el}else{if(selD)selD.classList.remove('sel');selD=selD===el?null:el}\n  if(el===selT||el===selD)el.classList.add('sel');\n  if(selT&&selD){\n    const t=selT,d=selD;t.classList.remove('sel');d.classList.remove('sel');selT=selD=null;\n    const v=S.vocab;\n    if(t.dataset.i===d.dataset.i){\n      const i=+t.dataset.i;v.matched.add(i);v.done++;\n      t.classList.add('done');d.classList.add('done');\n      const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+t.textContent;d.prepend(a);\n      document.querySelector('.meter i').style.width=(v.done/VOCAB.length*100)+'%';\n      document.querySelector('.sub span').textContent=`${v.done} of ${VOCAB.length} matched`;\n      drawSteps();vnav();\n    }else{\n      v.missed.add(+t.dataset.i);v.missed.add(+d.dataset.i);\n      [t,d].forEach(e=>{e.classList.add('wrong');setTimeout(()=>e.classList.remove('wrong'),450)});\n    }\n  }\n}\n\n/* ---------- shared question card ---------- */\nfunction card(n,text,pg){\n  const q=document.createElement('div');q.className='q';\n  q.innerHTML=`<div class=\"qhead\"><span class=\"qn\">${n}.<\/span><p class=\"qt\">${esc(text)}${pg?` <span class=\"pg\">(pg. ${pg})<\/span>`:''}<\/p><\/div>`;\n  return q;\n}\nfunction fb(q,ok,html){const p=document.createElement('p');p.className='fb '+(ok?'ok':'bad');p.innerHTML=html;q.append(p)}\nfunction partShell(title,note){\n  const m=$('main');m.innerHTML='';\n  const s=document.createElement('section');s.className='part';\n  s.innerHTML=`<h2>${title}<\/h2><p class=\"note\">${note}<\/p>`;m.append(s);return s;\n}\n\n/* ---------- Part 2: true/false ---------- */\nfunction drawTF(){\n  const s=partShell('Part 2: True or false','Remember: if any part of the statement is false, the whole statement is false.');\n  S.tf.order.forEach((qi,n)=>{\n    const it=TF[qi],q=card(n+1,it.q);const o=document.createElement('div');o.className='opts row2';\n    [true,false].forEach(val=>{\n      const b=document.createElement('button');b.className='opt';b.textContent=val?'True':'False';\n      const answered=qi in S.tf.ans;\n      if(answered){b.disabled=true;if(val===it.a)b.classList.add('right');else if(S.tf.chosen?.[qi]===val)b.classList.add('no')}\n      b.onclick=()=>{S.tf.ans[qi]=(val===it.a);(S.tf.chosen=S.tf.chosen||{})[qi]=val;drawTF();drawSteps()};\n      o.append(b);\n    });\n    q.append(o);\n    if(qi in S.tf.ans)fb(q,S.tf.ans[qi],`<b>${S.tf.ans[qi]?'Correct.':'Not quite.'}<\/b> The answer is <b>${it.a?'True':'False'}<\/b>. ${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn('Go to Part 3'));\n}\n\n/* ---------- Part 3: multiple choice ---------- */\nfunction drawMC(){\n  const s=partShell('Part 3: Multiple choice','Choose the best answer.');\n  S.mc.order.forEach((qi,n)=>{\n    const it=MC[qi],q=card(n+1,it.q,it.pg);const o=document.createElement('div');o.className='opts';\n    const answered=qi in S.mc.ans;\n    S.mc.opts[qi].forEach(txt=>{\n      const b=document.createElement('button');b.className='opt';b.textContent=txt;\n      if(answered){b.disabled=true;if(txt===it.a)b.classList.add('right');else if(S.mc.chosen?.[qi]===txt)b.classList.add('no')}\n      b.onclick=()=>{S.mc.ans[qi]=(txt===it.a);(S.mc.chosen=S.mc.chosen||{})[qi]=txt;drawMC();drawSteps()};\n      o.append(b);\n    });\n    q.append(o);\n    if(answered)fb(q,S.mc.ans[qi],`<b>${S.mc.ans[qi]?'Correct.':'Not quite.'}<\/b> ${esc(it.why)}`);\n    s.append(q);\n  });\n  s.append(nextBtn('Go to Part 4'));\n}\n\n/* ---------- Part 4: select all ---------- */\nfunction drawMulti(){\n  const s=partShell('Part 4: Select all that apply','Pick every correct answer, then tap Check. You need all the right ones and none of the wrong ones to get credit.');\n  S.multi.order.forEach((qi,n)=>{\n    const it=MULTI[qi],q=card(n+1,it.q,it.pg);const o=document.createElement('div');o.className='opts';\n    const answered=qi in S.multi.ans;const picked=S.multi.pick[qi]=S.multi.pick[qi]||new Set();\n    S.multi.opts[qi].forEach(txt=>{\n      const b=document.createElement('button');b.className='opt'+(picked.has(txt)?' sel':'');\n      const isRight=it.a.includes(txt);\n      b.innerHTML=`<span class=\"box\">${picked.has(txt)?'\u2713':''}<\/span><span><\/span>`;b.lastChild.textContent=txt;\n      if(answered){b.disabled=true;b.classList.remove('sel');\n        if(isRight&&picked.has(txt))b.classList.add('right');\n        else if(isRight)b.classList.add('miss');\n        else if(picked.has(txt))b.classList.add('no');\n        b.firstChild.textContent=isRight?'\u2713':(picked.has(txt)?'\u2717':'');\n      }\n      b.onclick=()=>{picked.has(txt)?picked.delete(txt):picked.add(txt);drawMultiKeep()};\n      o.append(b);\n    });\n    q.append(o);\n    if(answered){\n      fb(q,S.multi.ans[qi],`<b>${S.multi.ans[qi]?'Correct.':'Not quite.'}<\/b> ${S.multi.ans[qi]?'':'Dashed boxes are correct answers you missed. '}${esc(it.why)}`);\n    }else{\n      const c=document.createElement('button');c.className='btn ghost';c.textContent='Check';c.disabled=picked.size===0;\n      c.onclick=()=>{S.multi.ans[qi]=it.a.length===picked.size&&it.a.every(x=>picked.has(x));drawMultiKeep();drawSteps()};\n      q.append(c);\n    }\n    s.append(q);\n  });\n  s.append(nextBtn('See results'));\n}\nfunction drawMultiKeep(){const y=window.scrollY;drawMulti();window.scrollTo(0,y)}\n\n/* ---------- Results ---------- */\nfunction drawResults(){\n  const vr=S.vocab.done?vocabRight():0;\n  const tf=Object.values(S.tf.ans).filter(Boolean).length,mc=Object.values(S.mc.ans).filter(Boolean).length,mu=Object.values(S.multi.ans).filter(Boolean).length;\n  const total=VOCAB.length+TF.length+MC.length+MULTI.length,right=(S.vocab.done===VOCAB.length?vr:0)+tf+mc+mu;\n  const unanswered=(VOCAB.length-S.vocab.done)+(TF.length-Object.keys(S.tf.ans).length)+(MC.length-Object.keys(S.mc.ans).length)+(MULTI.length-Object.keys(S.multi.ans).length);\n  const s=partShell('Results',unanswered?`${unanswered} question${unanswered>1?'s are':' is'} still unanswered. Unanswered questions count as wrong.`:'Every question answered. Vocabulary counts terms you matched on the first try.');\n  const box=document.createElement('div');box.style.cssText='display:flex;flex-direction:column;gap:14px';\n  box.innerHTML=`<div><p class=\"label\">Total score<\/p><div class=\"big\">${right}/${total} <span style=\"font-size:22px;color:var(--muted)\">${Math.round(right/total*100)}%<\/span><\/div><\/div>\n   <div class=\"tally\">\n    <div><span class=\"label\">Vocabulary<\/span><b>${S.vocab.done===VOCAB.length?vr:0}/${VOCAB.length}<\/b><\/div>\n    <div><span class=\"label\">True/False<\/span><b>${tf}/${TF.length}<\/b><\/div>\n    <div><span class=\"label\">Multiple choice<\/span><b>${mc}/${MC.length}<\/b><\/div>\n    <div><span class=\"label\">Select all<\/span><b>${mu}/${MULTI.length}<\/b><\/div>\n   <\/div>`;\n  s.append(box);\n  const items=[];\n  if(S.vocab.done===VOCAB.length)[...S.vocab.missed].forEach(i=>items.push(`<li><b>${esc(VOCAB[i][0])}<\/b>: ${esc(VOCAB[i][1])}<\/li>`));\n  TF.forEach((t,i)=>{if(S.tf.ans[i]===false)items.push(`<li><b>${t.a?'True':'False'}:<\/b> ${esc(t.q)} ${esc(t.why)}<\/li>`)});\n  MC.forEach((m,i)=>{if(S.mc.ans[i]===false)items.push(`<li>${esc(m.q)} <b>${esc(m.a)}<\/b> <span class=\"pg\">(pg. ${m.pg})<\/span><\/li>`)});\n  MULTI.forEach((m,i)=>{if(S.multi.ans[i]===false)items.push(`<li>${esc(m.q)} <b>${m.a.map(esc).join('; ')}<\/b> <span class=\"pg\">(pg. ${m.pg})<\/span><\/li>`)});\n  if(items.length){const h=document.createElement('p');h.className='label';h.textContent='Review these';s.append(h);const ul=document.createElement('ul');ul.className='missed';ul.innerHTML=items.join('');s.append(ul)}\n  else if(!unanswered){const p=document.createElement('p');p.textContent='Perfect score. You are ready for the Unit 2 test.';p.style.margin='0';s.append(p)}\n  const r=document.createElement('div');r.className='row';\n  const again=document.createElement('button');again.className='btn';again.textContent='Retake with new shuffle';again.onclick=newTest;r.append(again);\n  s.append(r);\n}\n$('reshuffle').onclick=()=>{newTest();const n=$('shufnote');n.textContent='Shuffled. New order loaded.';setTimeout(()=>n.textContent='Starts over with a new random order.',2500)};\nnewTest();\n<\/script>\n\n<\/body>\n<\/html>\n", "ch8r": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch 8 Nutrition Review<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\">\n<style>\n:root{\n  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#18292D; --muted:#5A6D70; --line:#CFDAD7;\n  --accent:#55690F; --accent-soft:#E4EBCD; --good:#2E7D4F; --good-soft:#DDF0E3;\n  --bad:#B3412E; --bad-soft:#F6DFDA;\n  --display:\"Bricolage Grotesque\", \"Segoe UI\", system-ui, sans-serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    color-scheme:dark;\n    --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n    --accent:#B7CC6B; --accent-soft:#2E3A1C; --good:#5BC486; --good-soft:#163527;\n    --bad:#F08A76; --bad-soft:#3E211C;\n  }\n}\n:root[data-theme=\"dark\"]{\n  color-scheme:dark;\n  --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n  --accent:#B7CC6B; --accent-soft:#2E3A1C; --good:#5BC486; --good-soft:#163527;\n  --bad:#F08A76; --bad-soft:#3E211C;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}\n.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}\nheader{display:flex;flex-direction:column;gap:6px}\n.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0}\nh1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}\nh2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;text-wrap:balance}\n.how{color:var(--muted);margin:0;max-width:62ch}\n.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}\n.step{font:inherit;font-size:13px;text-align:left;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}\n.step b{font-family:var(--display);font-size:14px;color:var(--ink);line-height:1.15}\
