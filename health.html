herit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}\n.pane{display:flex;flex-direction:column;gap:18px}\n.group{display:flex;flex-direction:column;gap:10px}\n.group h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0}\n.tip{margin:0;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:15px}\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-items:start}\n.card{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}\n.card:hover{border-color:var(--accent)}\n.card b{font-family:var(--display);font-size:17px}\n.card .hint{font-size:13px;color:var(--muted)}\n.card .back{display:none;flex-direction:column;gap:8px}\n.card.open{border-color:var(--accent)}\n.card.open .hint{display:none}\n.card.open .back{display:flex}\n.hook{color:var(--accent);font-size:14px}\n.card .hook b{font-family:inherit;font-size:inherit}\n.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}\n.q{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.3;margin:0}\n.sub{color:var(--muted);font-size:14px}\n.opts{display:flex;flex-direction:column;gap:8px}\n.opts .def{font-family:var(--display);font-weight:600}\n.opts .def.miss{background:var(--bad-soft);border-color:var(--bad)}\n.why{margin:0}\n.why b{font-family:var(--display)}\n.answer{font-family:var(--display);font-weight:800;font-size:26px;margin:0;color:var(--accent)}\n\n[hidden]{display:none!important}\nhtml{color-scheme:light}\nbody{margin:0}\n<\/style>\n<script>\naddEventListener('message',e=>{const d=e.data||{};if(d.type==='theme'){if(d.theme)document.documentElement.dataset.theme=d.theme;else delete document.documentElement.dataset.theme}});\n<\/script>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n  <header>\n    <div class=\"top\"><p class=\"eyebrow\">Health \u00b7 Chapter 8 \u00b7 Nutrition<\/p><button class=\"btn ghost sm\" id=\"mode\" type=\"button\">Study Guide<\/button><\/div>\n    <h1 id=\"title\">Nutrition Match<\/h1>\n    <p class=\"how\" id=\"how\">Tap a term, then tap the definition it goes with. 46 terms across 4 pages (12, 12, 11, then 11), shuffled fresh every time. Use <b>Shuffle page<\/b> to reorder the current page or <b>Shuffle all<\/b> on page 1 to mix words across pages. Your score counts matches you got on the first try.<\/p>\n  <\/header>\n  <div id=\"match\" style=\"display:flex;flex-direction:column;gap:18px\">\n  <div class=\"status\"><div class=\"meter\"><i id=\"bar\"><\/i><\/div><span id=\"count\">Page 1 of 4<\/span><\/div>\n  <section id=\"game\" style=\"display:flex;flex-direction:column;gap:14px\">\n    <div class=\"row\" id=\"shufallrow\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"shufall\" type=\"button\">Shuffle all<\/button><span class=\"note\" id=\"shufallnote\">Mixes all words across every page and starts over.<\/span><\/div>\n    <p class=\"label\">Terms<\/p>\n    <div class=\"terms\" id=\"terms\"><\/div>\n    <p class=\"label\">Definitions<\/p>\n    <div class=\"defs\" id=\"defs\"><\/div>\n    <div class=\"row\"><button class=\"btn ghost\" id=\"shufpage\" type=\"button\">Shuffle page<\/button><button class=\"btn\" id=\"next\" hidden>Next page<\/button><\/div>\n  <\/section>\n  <section class=\"results\" id=\"results\" hidden><\/section>\n  <\/div>\n  <section id=\"guide\" hidden style=\"display:flex;flex-direction:column;gap:16px\">\n    <p class=\"how\">Learn the 46 words in 8 groups, then practice remembering them without looking. Short sessions on 3 or 4 different days work better than one long session. With 46 words, learn one or two groups at a time. Use the Practice menu to drill just those groups.<\/p>\n    <details class=\"plan\"><summary>4-day study plan<\/summary><ol>\n      <li><b>Day 1:<\/b> Go through the <b>Word cards<\/b>. Explain each word in your own words and say its hook. Then play the match quiz once.<\/li>\n      <li><b>Day 2:<\/b> <b>Say the word.<\/b> Spend your time on the ones you miss.<\/li>\n      <li><b>Day 3:<\/b> <b>Which one?<\/b> Then <b>Say the word<\/b> again.<\/li>\n      <li><b>Day before the test:<\/b> Match quiz with <b>Shuffle all<\/b>, then practice the words you missed.<\/li>\n    <\/ol><\/details>\n    <div class=\"tabs\" role=\"tablist\">\n      <button class=\"tab\" role=\"tab\" id=\"t-cards\" type=\"button\">Word cards<\/button>\n      <button class=\"tab\" role=\"tab\" id=\"t-which\" type=\"button\">Which one?<\/button>\n      <button class=\"tab\" role=\"tab\" id=\"t-say\" type=\"button\">Say the word<\/button>\n    <\/div>\n    <div class=\"row pset\" id=\"psetrow\" style=\"align-items:center\"><label class=\"sub\" for=\"pset\">Practice<\/label><select id=\"pset\"><\/select><\/div>\n    <div class=\"pane\" id=\"p-cards\" role=\"tabpanel\">\n      <div class=\"row\" style=\"align-items:center\"><button class=\"btn ghost\" id=\"allcards\" type=\"button\">Show all definitions<\/button><span class=\"sub\">Or tap one card at a time.<\/span><\/div>\n      <div class=\"pane\" id=\"groups\"><\/div>\n    <\/div>\n    <div class=\"panel\" id=\"p-which\" role=\"tabpanel\" hidden>\n      <p class=\"label\" id=\"wc\"><\/p>\n      <p class=\"q\" id=\"wq\"><\/p>\n      <div class=\"opts\" id=\"wo\"><\/div>\n      <p class=\"why\" id=\"wwhy\" hidden><\/p>\n      <div class=\"row\"><button class=\"btn\" id=\"wnext\" type=\"button\" hidden>Next<\/button><\/div>\n    <\/div>\n    <div class=\"panel\" id=\"p-say\" role=\"tabpanel\" hidden>\n      <p class=\"label\" id=\"sc\"><\/p>\n      <p class=\"q\" id=\"sq\"><\/p>\n      <p class=\"sub\" id=\"shint\">Say the word out loud, then check.<\/p>\n      <div class=\"row\"><button class=\"btn\" id=\"sshow\" type=\"button\">Show answer<\/button><\/div>\n      <div id=\"sans\" hidden style=\"display:flex;flex-direction:column;gap:12px\">\n        <p class=\"answer\" id=\"sterm\"><\/p>\n        <p class=\"hook\" id=\"shook\" style=\"margin:0\"><\/p>\n        <div class=\"row\"><button class=\"btn\" id=\"sok\" type=\"button\">I got it<\/button><button class=\"btn ghost\" id=\"sno\" type=\"button\">Not yet<\/button><\/div>\n      <\/div>\n      <div id=\"send\" hidden style=\"display:flex;flex-direction:column;gap:12px\"><\/div>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\nconst CARDS=[\n[\"All-or-nothing mindset\",\"Way of thinking that classifies behaviors as either total successes or total failures\"],\n[\"Added sugars\",\"Sugars that do not occur naturally in foods\"],\n[\"Body composition\",\"Ratio of the various components (fat, bone, and muscle) that make up the body; influenced by genetics, eating patterns, and physical activity\"],\n[\"Body mass index (BMI)\",\"Tool used to determine whether a person's weight is healthy for that person's height; BMI = weight (lbs.) \u00f7 height (in.)\u00b2 \u00d7 703\"],\n[\"Body fat distribution\",\"Locations of fat deposits on a person's body\"],\n[\"Calories\",\"Units of energy in food\"],\n[\"Carbohydrates\",\"Nutrients that are the major source of energy for the body; found in fruits, vegetables, grains, and dairy products\"],\n[\"Daily value\",\"Recommended daily intake amounts for specific nutrients based on a 2,000-calorie eating plan\"],\n[\"Dietary fiber\",\"Complex carbohydrate found only in plant-based foods; cannot be completely digested, but has many health benefits\"],\n[\"Dietary Guidelines for Americans\",\"Guidelines published by the USDA and HHS that provide recommendations for establishing eating patterns to promote health\"],\n[\"Diuretics\",\"Substances that help the body eliminate sodium and water, mostly through increased urination; can cause a drop in weight and dangerous side effects; also called water pills\"],\n[\"Empty calories\",\"Units of energy that supply few or no nutrients to the body\"],\n[\"Fad diets\",\"Stylish weight-loss plans that promise significant weight loss in short periods of time, often by cutting out food groups or buying premade meals\"],\n[\"Fat-soluble vitamins\",\"Type of vitamin that dissolves in the body's fats and can be stored for later use\"],\n[\"Fats\",\"Nutrients, largely made up of fatty acids, that provide a valuable source of energy for muscles and help absorb and transport vitamins and nutrients\"],\n[\"Food additives\",\"Substances added to food products to cause desired changes to flavor, shelf life, or other qualities\"],\n[\"Food allergy\",\"Condition in which the body's immune system reacts to a food as if it is harmful; tiny amounts of the food can cause sudden symptoms\"],\n[\"Food diary\",\"Daily record of what a person eats; used to track eating patterns and calorie intake\"],\n[\"Food intolerances\",\"Conditions in which a person's body cannot properly digest particular types of food; can develop gradually when a person eats large amounts of a certain food often\"],\n[\"Food preferences\",\"Opinions about different types of food; influenced by genetics, age, feelings and thoughts, cultural background, and social environment\"],\n[\"Foodborne illnesses\",\"Illnesses that are transmitted by food; also called food poisoning\"],\n[\"Foodborne infection\",\"Foodborne illness that occurs when food is handled or prepared improperly; caused by bacteria, viruses, or parasites\"],\n[\"Foodborne intoxication\",\"Foodborne illness caused by toxins, which are produced by organisms present in a food\"],\n[\"Generally recognized as safe (GRAS)\",\"Proven by the Food and Drug Administration (FDA) to be safe for consumption\"],\n[\"Genetically modified organism (GMO)\",\"Living thing with genetic material that has been altered through genetic engineering\"],\n[\"Glucose\",\"Simple carbohydrate and the preferred source of energy for the brain and central nervous system\"],\n[\"Malnutrition\",\"Form of poor nutrition in which a person does not get or properly absorb the recommended amounts of essential nutrients\"],\n[\"Metabolism\",\"Rate at which the body uses energy to carry out basic physiological processes\"],\n[\"Minerals\",\"Inorganic nutrients absorbed from plants, water, and animal food sources\"],\n[\"MyPlate\",\"Food guidance system created by the USDA; reminds people about the proportions of the five food groups they should eat at a meal\"],\n[\"Nutrient-dense foods\",\"Foods that provide vitamins, minerals, and other substances with positive health effects; contain little or no saturated fats, added sugars, and sodium\"],\n[\"Nutrients\",\"Chemical substances that provide the nutrition essential for growth, energy, and function\"],\n[\"Nutrition Facts label\",\"FDA-required label on all packaged foods; lists serving size, servings, calories, amounts of nutrients, and daily values\"],\n[\"Obesity\",\"Condition of excess body fat or excessive overweight\"],\n[\"Organic\",\"Produced without the use of chemical fertilizers, pesticides, or other artificial chemicals\"],\n[\"Overnutrition\",\"Form of malnutrition caused by consuming too many of some nutrients\"],\n[\"Overweight\",\"Condition of excess body weight from fat, bone, muscle, water, or a combination of these factors\"],\n[\"Protein\",\"Nutrient the body uses to build and maintain cells and tissues and provide energy; may also act as hormones or enzymes\"],\n[\"Saturated fats\",\"Type of fat found primarily in animal-based foods; typically solid at room temperature\"],\n[\"Trans fat\",\"Type of fat historically found in many processed foods; can also occur naturally in animal-based foods\"],\n[\"Undernutrition\",\"Form of malnutrition caused by the body not receiving or absorbing needed nutrients\"],\n[\"Underweight\",\"Condition of a body weight that is too low compared with others of the same sex and age\"],\n[\"Unsaturated fats\",\"Type of fat found in plant-based foods; liquid at room temperature\"],\n[\"Vitamins\",\"Organic nutrients that promote growth and development, help regulate body processes, maintain healthy skin, and help the body release energy\"],\n[\"Water-soluble vitamins\",\"Type of vitamin that dissolves in water; used immediately by the body or removed during urination\"],\n[\"Nutrition\",\"Process of choosing and consuming food necessary for health and growth\"]\n];\nconst $=id=>document.getElementById(id);\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nlet pool,rounds,r,missed,selTerm,selDef,left,total,matched=new Set();\n\nfunction start(indices){\n  pool=shuffle(indices); total=pool.length; missed=new Set();\n  const n=Math.ceil(total/12); rounds=[]; let k=0; for(let i=0;i<n;i++){const size=Math.floor(total/n)+(i<total%n?1:0); rounds.push(pool.slice(k,k+size)); k+=size;}\n  r=0; $('results').hidden=true; $('game').hidden=false; render();\n}\nfunction render(keep){\n  const ids=rounds[r]; selTerm=selDef=null; if(!keep)matched=new Set(); left=ids.length-matched.size; $('next').hidden=left!==0||r>=rounds.length-1;\n  $('shufallrow').hidden=r!==0;\n  $('count').textContent=`Page ${r+1} of ${rounds.length}`;\n  $('bar').style.width=(rounds.slice(0,r).flat().length/total*100)+'%';\n  $('terms').innerHTML=''; $('defs').innerHTML='';\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='term'+(matched.has(i)?' done':'');b.textContent=CARDS[i][0];b.dataset.i=i;b.onclick=()=>pick('t',b);$('terms').append(b)});\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='def'+(matched.has(i)?' done':'');b.dataset.i=i;b.innerHTML=`<span class=\"d\"><\/span>`;b.querySelector('.d').textContent=CARDS[i][1];\n    if(matched.has(i)){const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+CARDS[i][0];b.prepend(a)}\n    b.onclick=()=>pick('d',b);$('defs').append(b)});\n}\nfunction pick(kind,el){\n  if(el.classList.contains('done'))return;\n  if(kind==='t'){ if(selTerm)selTerm.classList.remove('sel'); selTerm=selTerm===el?null:el; }\n  else { if(selDef)selDef.classList.remove('sel'); selDef=selDef===el?null:el; }\n  if(el===selTerm||el===selDef) el.classList.add('sel');\n  if(selTerm&&selDef) check();\n}\nfunction check(){\n  const t=selTerm,d=selDef; t.classList.remove('sel'); d.classList.remove('sel'); selTerm=selDef=null;\n  if(t.dataset.i===d.dataset.i){\n    matched.add(+t.dataset.i); t.classList.add('done'); d.classList.add('done');\n    const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+t.textContent;d.prepend(a);\n    if(--left===0){\n      $('bar').style.width=(rounds.slice(0,r+1).flat().length/total*100)+'%';\n      if(r<rounds.length-1){$('next').hidden=false;$('next').focus();} else finish();\n    }\n  } else {\n    missed.add(+t.dataset.i); missed.add(+d.dataset.i);\n    [t,d].forEach(e=>{e.classList.add('wrong');setTimeout(()=>e.classList.remove('wrong'),450)});\n  }\n}\nfunction finish(){\n  $('game').hidden=true; const res=$('results'); res.hidden=false;\n  const right=total-missed.size; const pct=Math.round(right/total*100);\n  $('count').textContent='Finished';\n  let html=`<p class=\"label\">First-try score<\/p><div class=\"big\">${right}/${total} <span style=\"font-size:20px;color:var(--muted)\">${pct}%<\/span><\/div>`;\n  if(missed.size){\n    html+=`<p class=\"label\">Review these<\/p><ul class=\"missed\">`+[...missed].map(i=>`<li><b>${CARDS[i][0]}<\/b>: ${CARDS[i][1]}<\/li>`).join('')+`<\/ul>`;\n    html+=`<div class=\"row\"><button class=\"btn\" id=\"retry\">Practice missed (${missed.size})<\/button><button class=\"btn ghost\" id=\"again\">Start over<\/button><\/div>`;\n  } else html+=`<p style=\"margin:0\">Perfect score. You know this chapter.<\/p><div class=\"row\"><button class=\"btn\" id=\"again\">Start over<\/button><\/div>`;\n  res.innerHTML=html;\n  const m=[...missed]; if($('retry'))$('retry').onclick=()=>start(m);\n  $('again').onclick=()=>start(CARDS.map((_,i)=>i));\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n$('next').onclick=()=>{r++;render();window.scrollTo({top:0,behavior:'smooth'})};\n$('shufpage').onclick=()=>{render();$('terms').scrollIntoView({behavior:'smooth',block:'start'})};\n$('shufall').onclick=()=>{start(pool.slice());const n=$('shufallnote');n.textContent='Shuffled. All words have new pages.';setTimeout(()=>n.textContent='Mixes all words across every page and starts over.',2500)};\nstart(CARDS.map((_,i)=>i));\n\n// ---- Study guide ----\nconst MATCH_TITLE=\"Nutrition Match\",GUIDE_TITLE=\"Nutrition Study Guide\";\nconst HOOK={\n\"Nutrition\": \"The whole process: choosing and eating the food you need to grow and stay healthy.\",\n\"Nutrients\": \"The chemical building blocks in food that give you growth, energy, and function.\",\n\"Calories\": \"Units of energy in food, like fuel for your body.\",\n\"Empty calories\": \"Empty = nothing inside: energy with few or no nutrients, like soda.\",\n\"Metabolism\": \"Your body's engine speed: how fast it uses energy for basic processes.\",\n\"Carbohydrates\": \"Carbs = the body's main fuel: fruits, vegetables, grains, and dairy.\",\n\"Glucose\": \"The simple sugar your brain likes best for fuel.\",\n\"Dietary fiber\": \"A plant-only carb your body can't fully digest, but it's great for you.\",\n\"Protein\": \"Builds and repairs cells and tissues, like building blocks for muscles.\",\n\"Fats\": \"Energy for your muscles, and they help carry and absorb vitamins.\",\n\"Saturated fats\": \"Saturated = Solid at room temperature, mostly from animals, like butter.\",\n\"Unsaturated fats\": \"UN-saturated = UN-solid: liquid plant oils, like olive oil.\",\n\"Trans fat\": \"Think \\\"transformed\\\" foods: it used to be in lots of processed snacks.\",\n\"Vitamins\": \"Vita = life: organic nutrients for growth, healthy skin, and releasing energy.\",\n\"Fat-soluble vitamins\": \"Dissolve in fat, so your body can store them for later (A, D, E, K).\",\n\"Water-soluble vitamins\": \"Dissolve in water, so they're used right away or leave in urine (B and C).\",\n\"Minerals\": \"Inorganic, like rocks and soil: absorbed from plants, water, and animal foods.\",\n\"Dietary Guidelines for Americans\": \"The official healthy-eating rulebook from the USDA and HHS.\",\n\"MyPlate\": \"The plate picture showing how much of each of the five food groups to eat.\",\n\"Nutrition Facts label\": \"The facts box on every packaged food: serving size, calories, nutrients, daily values.\",\n\"Daily value\": \"The % on food labels, based on a 2,000-calorie day.\",\n\"Nutrient-dense foods\": \"Dense = packed: lots of nutrients and little saturated fat, added sugar, or sodium.\",\n\"Added sugars\": \"Sugar ADDED in, not naturally in the food, like the sugar in soda.\",\n\"Food diary\": \"A diary of everything you eat each day.\",\n\"Food additives\": \"Added to food to change its flavor, shelf life, or other qualities.\",\n\"Generally recognized as safe (GRAS)\": \"GRAS = Generally Recognized As Safe: the FDA says it's safe to eat.\",\n\"Genetically modified organism (GMO)\": \"Genetically Modified: scientists changed its genes.\",\n\"Organic\": \"Grown without chemical fertilizers, pesticides, or other artificial chemicals.\",\n\"Foodborne illnesses\": \"Borne = carried: illnesses carried by food. Also called food poisoning.\",\n\"Foodborne infection\": \"Germs (bacteria, viruses, parasites) from food handled or cooked the wrong way.\",\n\"Foodborne intoxication\": \"in-TOX-ication: toxins (poisons) made by organisms in the food.\",\n\"Food allergy\": \"The immune system attacks a food as if it's harmful. Even a tiny bit can cause sudden symptoms.\",\n\"Food intolerances\": \"The body can't digest a food well, like milk. It's not an immune reaction.\",\n\"Food preferences\": \"The foods you prefer, shaped by ss=\"q\" id=\"wq\"><\/p>\n      <div class=\"opts\" id=\"wo\"><\/div>\n      <p class=\"why\" id=\"wwhy\" hidden><\/p>\n      <div class=\"row\"><button class=\"btn\" id=\"wnext\" type=\"button\" hidden>Next<\/button><\/div>\n    <\/div>\n    <div class=\"panel\" id=\"p-say\" role=\"tabpanel\" hidden>\n      <p class=\"label\" id=\"sc\"><\/p>\n      <p class=\"q\" id=\"sq\"><\/p>\n      <p class=\"sub\" id=\"shint\">Say the word out loud, then check.<\/p>\n      <div class=\"row\"><button class=\"btn\" id=\"sshow\" type=\"button\">Show answer<\/button><\/div>\n      <div id=\"sans\" hidden style=\"display:flex;flex-direction:column;gap:12px\">\n        <p class=\"answer\" id=\"sterm\"><\/p>\n        <p class=\"hook\" id=\"shook\" style=\"margin:0\"><\/p>\n        <div class=\"row\"><button class=\"btn\" id=\"sok\" type=\"button\">I got it<\/button><button class=\"btn ghost\" id=\"sno\" type=\"button\">Not yet<\/button><\/div>\n      <\/div>\n      <div id=\"send\" hidden style=\"display:flex;flex-direction:column;gap:12px\"><\/div>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\nconst CARDS=[\n[\"Airbrushing\", \"Digitally altering an image to eliminate blemishes, cellulite, bulges, or wrinkles\"],\n[\"Weight stigma\", \"Flawed belief that having a thinner body or lower weight is always better\"],\n[\"Body image\", \"Subjective mental image of one's own body; established based on self-observation and the reactions of others\"],\n[\"Muscle dysmorphia\", \"Disorder characterized by extreme concern with becoming more muscular\"],\n[\"Acid reflux disorder\", \"Condition in which a mixture of digested food and acid moves from the stomach to the lower esophagus, resulting in heartburn\"],\n[\"Constipation\", \"Infrequent or delayed hard, dry bowel movements\"],\n[\"Disordered eating\", \"Range of irregular eating behaviors; may or may not lead to diagnosis of a specific eating disorder\"],\n[\"Eating disorder\", \"Mental illness characterized by abnormal eating or disturbances in eating habits\"],\n[\"Lanugo\", \"Fine hair that grows all over the body as a result of starvation due to anorexia nervosa\"],\n[\"Orthorexia\", \"Disordered eating pattern characterized by an obsession with healthy eating\"],\n[\"Purging\", \"Attempts to rid the body of food\"],\n[\"Body compassion\", \"Feelings of acceptance, care, and kindness toward one's body\"],\n[\"Body neutrality\", \"Focus on what the body can do, rather than how it looks\"],\n[\"Body positivity\", \"Appreciation of body-type diversity; involves valuing the body and understanding it will change\"]\n];\nconst $=id=>document.getElementById(id);\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nlet pool,rounds,r,missed,selTerm,selDef,left,total,matched=new Set();\n\nfunction start(indices){\n  pool=shuffle(indices); total=pool.length; missed=new Set();\n  const n=Math.ceil(total/12); rounds=[]; let k=0; for(let i=0;i<n;i++){const size=Math.floor(total/n)+(i<total%n?1:0); rounds.push(pool.slice(k,k+size)); k+=size;}\n  r=0; $('results').hidden=true; $('game').hidden=false; render();\n}\nfunction render(keep){\n  const ids=rounds[r]; selTerm=selDef=null; if(!keep)matched=new Set(); left=ids.length-matched.size; $('next').hidden=left!==0||r>=rounds.length-1;\n  $('shufallrow').hidden=r!==0;\n  $('count').textContent=`Page ${r+1} of ${rounds.length}`;\n  $('bar').style.width=(rounds.slice(0,r).flat().length/total*100)+'%';\n  $('terms').innerHTML=''; $('defs').innerHTML='';\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='term'+(matched.has(i)?' done':'');b.textContent=CARDS[i][0];b.dataset.i=i;b.onclick=()=>pick('t',b);$('terms').append(b)});\n  shuffle(ids).forEach(i=>{const b=document.createElement('button');b.className='def'+(matched.has(i)?' done':'');b.dataset.i=i;b.innerHTML=`<span class=\"d\"><\/span>`;b.querySelector('.d').textContent=CARDS[i][1];\n    if(matched.has(i)){const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+CARDS[i][0];b.prepend(a)}\n    b.onclick=()=>pick('d',b);$('defs').append(b)});\n}\nfunction pick(kind,el){\n  if(el.classList.contains('done'))return;\n  if(kind==='t'){ if(selTerm)selTerm.classList.remove('sel'); selTerm=selTerm===el?null:el; }\n  else { if(selDef)selDef.classList.remove('sel'); selDef=selDef===el?null:el; }\n  if(el===selTerm||el===selDef) el.classList.add('sel');\n  if(selTerm&&selDef) check();\n}\nfunction check(){\n  const t=selTerm,d=selDef; t.classList.remove('sel'); d.classList.remove('sel'); selTerm=selDef=null;\n  if(t.dataset.i===d.dataset.i){\n    matched.add(+t.dataset.i); t.classList.add('done'); d.classList.add('done');\n    const a=document.createElement('span');a.className='ans';a.textContent='\u2713 '+t.textContent;d.prepend(a);\n    if(--left===0){\n      $('bar').style.width=(rounds.slice(0,r+1).flat().length/total*100)+'%';\n      if(r<rounds.length-1){$('next').hidden=false;$('next').focus();} else finish();\n    }\n  } else {\n    missed.add(+t.dataset.i); missed.add(+d.dataset.i);\n    [t,d].forEach(e=>{e.classList.add('wrong');setTimeout(()=>e.classList.remove('wrong'),450)});\n  }\n}\nfunction finish(){\n  $('game').hidden=true; const res=$('results'); res.hidden=false;\n  const right=total-missed.size; const pct=Math.round(right/total*100);\n  $('count').textContent='Finished';\n  let html=`<p class=\"label\">First-try score<\/p><div class=\"big\">${right}/${total} <span style=\"font-size:20px;color:var(--muted)\">${pct}%<\/span><\/div>`;\n  if(missed.size){\n    html+=`<p class=\"label\">Review these<\/p><ul class=\"missed\">`+[...missed].map(i=>`<li><b>${CARDS[i][0]}<\/b>: ${CARDS[i][1]}<\/li>`).join('')+`<\/ul>`;\n    html+=`<div class=\"row\"><button class=\"btn\" id=\"retry\">Practice missed (${missed.size})<\/button><button class=\"btn ghost\" id=\"again\">Start over<\/button><\/div>`;\n  } else html+=`<p style=\"margin:0\">Perfect score. You know this chapter.<\/p><div class=\"row\"><button class=\"btn\" id=\"again\">Start over<\/button><\/div>`;\n  res.innerHTML=html;\n  const m=[...missed]; if($('retry'))$('retry').onclick=()=>start(m);\n  $('again').onclick=()=>start(CARDS.map((_,i)=>i));\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n$('next').onclick=()=>{r++;render();window.scrollTo({top:0,behavior:'smooth'})};\n$('shufpage').onclick=()=>{render();$('terms').scrollIntoView({behavior:'smooth',block:'start'})};\n$('shufall').onclick=()=>{start(pool.slice());const n=$('shufallnote');n.textContent='Shuffled. All words have new pages.';setTimeout(()=>n.textContent='Mixes all words across every page and starts over.',2500)};\nstart(CARDS.map((_,i)=>i));\n\n// ---- Study guide ----\nconst MATCH_TITLE=\"Body Image Match\",GUIDE_TITLE=\"Body Image Study Guide\";\nconst HOOK={\n\"Body image\": \"Image = picture. It's the picture of your body you carry in your head.\",\n\"Airbrushing\": \"An airbrush sprays paint. The photo has been \\\"painted over\\\" to hide flaws.\",\n\"Weight stigma\": \"Stigma (a Ch 7 word) = an unfair belief. This one is about weight.\",\n\"Muscle dysmorphia\": \"Dys = bad, morph = shape. They see their own shape wrong and never feel muscular enough.\",\n\"Body positivity\": \"Positivity = LOOKS. Every body type is worth appreciating.\",\n\"Body neutrality\": \"Neutrality = ABILITIES. What your body can do, not how it looks.\",\n\"Body compassion\": \"Compassion = KINDNESS. Treat your body the way you'd treat a friend.\",\n\"Disordered eating\": \"Ends in \\\"eating\\\": it describes eating habits, which may or may not be an illness.\",\n\"Eating disorder\": \"Ends in \\\"disorder\\\": it's the actual illness a doctor diagnoses.\",\n\"Orthorexia\": \"Ortho = correct, like an orthodontist straightening teeth. Obsessed with eating only the \\\"correct\\\" foods.\",\n\"Purging\": \"Purge = get rid of.\",\n\"Lanugo\": \"Latin lana = wool. A starving body grows fine fuzz to try to stay warm.\",\n\"Acid reflux disorder\": \"Re = back, flux = flow. Stomach acid flows back up and causes heartburn.\",\n\"Constipation\": \"Things are stuck.\"\n};\nconst GROUPS=[{\"n\": \"How we see our bodies\", \"tip\": \"Positivity = looks \u00b7 Neutrality = abilities \u00b7 Compassion = kindness\", \"w\": [\"Body image\", \"Airbrushing\", \"Weight stigma\", \"Muscle dysmorphia\", \"Body positivity\", \"Body neutrality\", \"Body compassion\"]}, {\"n\": \"Eating problems\", \"tip\": \"Eating disorder ends in \\\"disorder\\\": it's the diagnosed illness. Disordered eating is a range of eating behaviors.\", \"w\": [\"Disordered eating\", \"Eating disorder\", \"Orthorexia\", \"Purging\", \"Lanugo\"]}, {\"n\": \"Digestion\", \"w\": [\"Acid reflux disorder\", \"Constipation\"]}];\nconst WHICH=[\n[\"Focusing on how your legs let you run and jump, not on how they look\", \"Body neutrality\", [\"Body positivity\", \"Body neutrality\", \"Body compassion\"]],\n[\"Believing bodies of every shape and size are worth appreciating\", \"Body positivity\", [\"Body positivity\", \"Body neutrality\", \"Body compassion\"]],\n[\"After a rough day, talking to yourself kindly about your body, the way you would to a friend\", \"Body compassion\", [\"Body positivity\", \"Body neutrality\", \"Body compassion\"]],\n[\"A doctor diagnoses a mental illness such as anorexia nervosa\", \"Eating disorder\", [\"Eating disorder\", \"Disordered eating\", \"Orthorexia\"]],\n[\"Often skipping meals or eating at strange times, which may or may not be a diagnosed illness\", \"Disordered eating\", [\"Eating disorder\", \"Disordered eating\", \"Orthorexia\"]],\n[\"Being so focused on eating only \\\"pure\\\" healthy foods that it becomes an unhealthy obsession\", \"Orthorexia\", [\"Eating disorder\", \"Disordered eating\", \"Orthorexia\"]],\n[\"Someone who is already very muscular but still believes they look too small\", \"Muscle dysmorphia\", [\"Body image\", \"Weight stigma\", \"Muscle dysmorphia\", \"Airbrushing\"]],\n[\"Believing a thinner body is always a better body\", \"Weight stigma\", [\"Body image\", \"Weight stigma\", \"Muscle dysmorphia\", \"Airbrushing\"]],\n[\"The picture of your own body that you hold in your mind\", \"Body image\", [\"Body image\", \"Weight stigma\", \"Muscle dysmorphia\", \"Airbrushing\"]],\n[\"A magazine smooths a model's skin and slims the waist in a photo before printing it\", \"Airbrushing\", [\"Body image\", \"Weight stigma\", \"Muscle dysmorphia\", \"Airbrushing\"]],\n[\"Fine, soft hair that grows over the body of someone starving because of anorexia nervosa\", \"Lanugo\", [\"Lanugo\", \"Purging\", \"Orthorexia\"]],\n[\"Trying to get rid of food from the body after eating\", \"Purging\", [\"Purging\", \"Lanugo\", \"Disordered eating\"]],\n[\"A burning feeling in the chest when stomach acid moves back up\", \"Acid reflux disorder\", [\"Acid reflux disorder\", \"Constipation\"]],\n[\"Hard, dry bowel movements that don't happen very often\", \"Constipation\", [\"Acid reflux disorder\", \"Constipation\"]]\n];\nconst DEF=Object.fromEntries(CARDS);\nconst setHook=(el,w)=>{el.innerHTML='<b>Hook:<\/b> ';el.append(HOOK[w])};\n\nlet guide=false;\n$('mode').onclick=()=>{\n  guide=!guide;\n  $('match').hidden=guide; $('how').hidden=guide; $('guide').hidden=!guide;\n  $('title').textContent=guide?GUIDE_TITLE:MATCH_TITLE;\n  $('mode').textContent=guide?'Match quiz':'Study Guide';\n  window.scrollTo({top:0});\n};\n\nfunction tab(name){\n  ['cards','which','say'].forEach(x=>{$('t-'+x).setAttribute('aria-selected',x===name);$('p-'+x).hidden=x!==name});\n  $('psetrow').hidden=name==='cards';\n}\n['cards','which','say'].forEach(x=>$('t-'+x).onclick=()=>tab(x));\ntab('cards');\n\nGROUPS.forEach(g=>{\n  const s=document.createElement('section');s.className='group';\n  const h=document.createElement('h2');h.textContent=g.n;s.append(h);\n  if(g.tip){const p=document.createElement('p');p.className='tip';p.textContent=g.tip;s.append(p)}\n  const c=document.createElement('div');c.className='cards';s.append(c);\n  g.w.forEach(w=>{\n    const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-expanded','false');\n    b.innerHTML='<b><\/b><span class=\"hint\">Tap to see the definition<\/span><span class=\"back\"><span class=\"d\"><\/span><span class=\"hook\"><\/span><\/span>';\n    b.querySelector('b').textContent=w;b.querySelector('.d').textContent=DEF[w];setHook(b.querySelector('.hook'),w);\n    b.onclick=()=>b.setAttribute('aria-expanded',b.classList.toggle('open'));\n    c.append(b);\n  });\n  $('groups').append(s);\n});\n$('allcards').onclick=()=>{\n  const open=$('allcards').textContent.startsWith('Show');\n  document.querySelectorAll('.card').forEach(b=>{b.classList.toggle('open',open);b.setAttribute('aria-expanded',open)});\n  $('allcards').textContent=open?'Hide all definitions':'Show all definitions';\n};\n\n// Practice set: all words or one group, shared by Which one? and Say the word\nconst SETS=[{n:`All ${CARDS.length} words`,w:CARDS.map(c=>c[0])},...GROUPS.map(g=>({n:`${g.n} (${g.w.length})`,w:g.w}))];\nSETS.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.n;$('pset').append(o)});\nlet cur=SETS[0].w;\n$('pset').onchange=()=>{cur=SETS[$('pset').value].w;whichStart();sayStart()};\n\nconst WHICH_ROUND=15;\nlet wq,wi,wright,wanswered;\nfunction whichStart(){wq=shuffle(WHICH.filter(x=>cur.includes(x[1]))).slice(0,WHICH_ROUND);wi=0;wright=0;whichShow()}\nfunction whichShow(){\n  wanswered=false; $('wwhy').hidden=true; $('wnext').hidden=true; $('wo').innerHTML='';\n  if(wi>=wq.length){\n    $('wc').textContent='Finished';\n    $('wq').textContent=`You got ${wright} of ${wq.length} on the first try.`;\n    $('wnext').textContent=WHICH.filter(x=>cur.includes(x[1])).length>WHICH_ROUND?'New questions':'Try again'; $('wnext').hidden=false; return;\n  }\n  const [q,a,opts]=wq[wi];\n  $('wc').textContent=`Question ${wi+1} of ${wq.length} \u00b7 Which word fits?`;\n  $('wq').textContent=q;\n  shuffle([a,...shuffle(opts.filter(o=>o!==a)).slice(0,3)]).forEach(o=>{\n    const b=document.createElement('button');b.type='button';b.className='def';b.textContent=o;\n    b.onclick=()=>whichPick(b,o);$('wo').append(b);\n  });\n}\nfunction whichPick(b,o){\n  if(wanswered)return; wanswered=true;\n  const a=wq[wi][1];\n  if(o===a){wright++;b.classList.add('done')}\n  else{b.classList.add('miss');[...$('wo').children].find(x=>x.textContent===a).classList.add('done')}\n  $('wwhy').innerHTML='<b><\/b> ';$('wwhy').querySelector('b').textContent=(o===a?'Right! ':'It\u2019s ')+a+'.';$('wwhy').append(HOOK[a]);$('wwhy').hidden=false;\n  $('wnext').textContent=wi<wq.length-1?'Next':'See score'; $('wnext').hidden=false; $('wnext').focus();\n}\n$('wnext').onclick=()=>{if(wi>=wq.length)whichStart();else{wi++;whichShow()}};\nwhichStart();\n\nlet sq,smissed,sknown,stotal;\nfunction sayStart(){sq=shuffle(CARDS.map((_,i)=>i).filter(i=>cur.includes(CARDS[i][0])));stotal=sq.length;smissed=new Set();sknown=0;$('send').hidden=true;sayShow()}\nfunction sayShow(){\n  $('sans').hidden=true;\n  const end=!sq.length;\n  ['sq','shint','sshow'].forEach(id=>$(id).hidden=end);\n  $('sc').textContent=end?'Finished':`${sknown} of ${stotal} known \u00b7 What's the word?`;\n  if(end){\n    const right=stotal-smissed.size;\n    let html=`<p class=\"q\">First-try score: ${right}/${stotal}<\/p>`;\n    if(smissed.size)html+=`<p class=\"label\">Keep practicing these<\/p><ul class=\"missed\">`+[...smissed].map(i=>`<li><b>${CARDS[i][0]}<\/b>: ${HOOK[CARDS[i][0]]}<\/li>`).join('')+`<\/ul>`;\n    html+=`<div class=\"row\"><button class=\"btn\" id=\"sagain\" type=\"button\">Go again<\/button><\/div>`;\n    $('send').innerHTML=html;$('send').hidden=false;$('sagain').onclick=sayStart;return;\n  }\n  $('sq').textContent=CARDS[sq[0]][1];\n}\n$('sshow').onclick=()=>{\n  const w=CARDS[sq[0]][0];$('sterm').textContent=w;setHook($('shook'),w);\n  $('sshow').hidden=true;$('shint').hidden=true;$('sans').hidden=false;$('sok').focus();\n};\n$('sok').onclick=()=>{sq.shift();sknown++;sayShow()};\n$('sno').onclick=()=>{const i=sq.shift();smissed.add(i);sq.splice(Math.min(3,sq.length),0,i);sayShow()};\nsayStart();\n<\/script>\n\n<\/body>\n<\/html>\n", "ch10": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch 10 Physical Activity Match<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\">\n<style>\n:root{\n  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#18292D; --muted:#5A6D70; --line:#CFDAD7;\n  --accent:#A33A4A; --accent-soft:#F4DCE0; --good:#2E7D4F; --good-soft:#DDF0E3;\n  --bad:#B3412E; --bad-soft:#F6DFDA;\n  --display:\"Bricolage Grotesque\", \"Segoe UI\", system-ui, sans-serif;\n  --body:\"Atkinson Hyperlegible\", \"Segoe UI\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    color-scheme:dark;\n    --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n    --accent:#F0909E; --accent-soft:#40202A; --good:#5BC486; --good-soft:#163527;\n    --bad:#F08A76; --bad-soft:#3E211C;\n  }\n}\n:root[data-theme=\"dark\"]{\n  color-scheme:dark;\n  --bg:#101A1C; --surface:#18252A; --ink:#E4EEEC; --muted:#93A8A9; --line:#2B3D41;\n  --accent:#F0909E; --accent-soft:#40202A; --good:#5BC486; --good-soft:#163527;\n  --bad:#F08A76; --bad-soft:#3E211C;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}\n.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direc
